<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Health.md glass — Composer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;color-scheme:dark}
a{color:#CDB6FF;text-decoration:none}a:hover{color:#FFFFFF}
button{font-family:inherit;cursor:pointer}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.45}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; background: #0E0E11; font-family: -apple-system, 'SF Pro Text', 'SF Pro Display', Inter, system-ui, sans-serif; color: #FFFFFF; overflow: hidden; ">
<div aria-hidden="true" style="position: absolute; inset: 0; overflow: hidden; z-index: 0"></div>
<div style="position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column">

<div style="flex: none; display: flex; align-items: center; justify-content: space-between; padding: 54px 16px 8px">
  <a href="ArchiveGlassDark.dc.html" aria-label="Back to Archive" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #FFFFFF; padding: 0; background: rgba(255,255,255,0.12); backdrop-filter: blur(26px) saturate(180%); -webkit-backdrop-filter: blur(26px) saturate(180%); border: 1px solid rgba(255,255,255,0.12); border-radius: 22px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), inset 0 -1px 0 rgba(255,255,255,0.06), 0 1px 2px rgba(0,0,0,0.3)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></a>
  <span style="font-size: 17px; font-weight: 600">Daily automation</span>
  <button type="button" style="height: 44px; padding: 0 18px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.12); background: #CDB6FF; color: #1A0F33; font-size: 15px; font-weight: 600; box-shadow: inset 0 1px 0 rgba(255,255,255,0.5)">Save</button>
</div>
<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 8px 16px 30px; display: flex; flex-direction: column; gap: 14px">
  <div style="padding: 20px; background: rgba(255,255,255,0.06); backdrop-filter: blur(26px) saturate(180%); -webkit-backdrop-filter: blur(26px) saturate(180%); border: 1px solid rgba(255,255,255,0.12); border-radius: 26px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), inset 0 -1px 0 rgba(255,255,255,0.06), 0 1px 2px rgba(0,0,0,0.3)">
    <p style="margin: 0; font-size: 24px; font-weight: 500; line-height: 1.6; letter-spacing: -0.4px; color: #DAD4E8">Every morning at <button type="button" onClick="{{ cycleTime }}" style="display: inline-block; padding: 2px 12px; margin: 2px 0; border-radius: 16px; border: 1px solid rgba(255,255,255,0.12); background: rgba(205,182,255,0.30); box-shadow: inset 0 1px 0 rgba(255,255,255,0.22); font: inherit; font-weight: 600; color: #FFFFFF; line-height: 1.35; text-decoration: none">{{ time }}</button>, write <button type="button" onClick="{{ cycleRange }}" style="display: inline-block; padding: 2px 12px; margin: 2px 0; border-radius: 16px; border: 1px solid rgba(255,255,255,0.12); background: rgba(205,182,255,0.30); box-shadow: inset 0 1px 0 rgba(255,255,255,0.22); font: inherit; font-weight: 600; color: #FFFFFF; line-height: 1.35; text-decoration: none">{{ range }}</button>’s <a href="MetricsG.dc.html" style="display: inline-block; padding: 2px 12px; margin: 2px 0; border-radius: 16px; border: 1px solid rgba(255,255,255,0.12); background: rgba(205,182,255,0.30); box-shadow: inset 0 1px 0 rgba(255,255,255,0.22); font: inherit; font-weight: 600; color: #FFFFFF; line-height: 1.35; text-decoration: none">{{ metricCount }} metrics</a> to <button type="button" style="display: inline-block; padding: 2px 12px; margin: 2px 0; border-radius: 16px; border: 1px solid rgba(255,255,255,0.12); background: rgba(205,182,255,0.30); box-shadow: inset 0 1px 0 rgba(255,255,255,0.22); font: inherit; font-weight: 600; color: #FFFFFF; line-height: 1.35; text-decoration: none; font-family: 'SF Mono', 'JetBrains Mono', ui-monospace, monospace; font-size: 19px; font-weight: 500">Vault/Health</button> as <button type="button" onClick="{{ cycleFormat }}" style="display: inline-block; padding: 2px 12px; margin: 2px 0; border-radius: 16px; border: 1px solid rgba(255,255,255,0.12); background: rgba(205,182,255,0.30); box-shadow: inset 0 1px 0 rgba(255,255,255,0.22); font: inherit; font-weight: 600; color: #FFFFFF; line-height: 1.35; text-decoration: none">{{ formatLabel }}</button>, and <button type="button" onClick="{{ toggleNote }}" style="display: inline-block; padding: 2px 12px; margin: 2px 0; border-radius: 16px; border: 1px solid rgba(255,255,255,0.12); background: rgba(205,182,255,0.30); box-shadow: inset 0 1px 0 rgba(255,255,255,0.22); font: inherit; font-weight: 600; color: #FFFFFF; line-height: 1.35; text-decoration: none">{{ noteLabel }}</button>.</p>
  </div>

  <div style="overflow: hidden; background: rgba(255,255,255,0.06); backdrop-filter: blur(26px) saturate(180%); -webkit-backdrop-filter: blur(26px) saturate(180%); border: 1px solid rgba(255,255,255,0.12); border-radius: 26px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), inset 0 -1px 0 rgba(255,255,255,0.06), 0 1px 2px rgba(0,0,0,0.3)">
    <div style="display: flex; justify-content: space-between; padding: 14px 18px 10px"><span style="font-size: 13px; font-weight: 600; color: #B3ABC6">Tomorrow’s file</span><span style="font-family: 'SF Mono', 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; color: #B3ABC6">{{ path }}</span></div>
    <div style="padding: 0 0 14px; font-family: 'SF Mono', 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; line-height: 1.75">
      <sc-for list="{{ lines }}" as="l" hint-placeholder-count="6">
        <div style="display: grid; grid-template-columns: 38px 1fr; padding-right: 18px">
          <span style="text-align: right; padding-right: 12px; color: #B3ABC6; opacity: 0.6">{{ l.no }}</span>
          <span style="{{ l.style }}">{{ l.text }}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; padding: 6px 18px; background: rgba(255,255,255,0.06); backdrop-filter: blur(26px) saturate(180%); -webkit-backdrop-filter: blur(26px) saturate(180%); border: 1px solid rgba(255,255,255,0.12); border-radius: 26px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), inset 0 -1px 0 rgba(255,255,255,0.06), 0 1px 2px rgba(0,0,0,0.3)">
    <div style="display: flex; justify-content: space-between; padding: 10px 0 4px"><span style="font-size: 13px; font-weight: 600; color: #B3ABC6">Fields in this note</span><a href="MetricsG.dc.html" style="font-size: 13px; font-weight: 600">All 170</a></div>
    <sc-for list="{{ chips }}" as="m" hint-placeholder-count="6">
      <button type="button" role="checkbox" aria-checked="{{ m.pressed }}" onClick="{{ m.toggle }}" style="display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 0; border: none; border-top: 1px solid rgba(255,255,255,0.14); background: transparent; color: #FFFFFF; text-align: left">
        <span style="flex: 1; font-size: 16px">{{ m.label }}</span>
        <span style="font-family: 'SF Mono', 'JetBrains Mono', ui-monospace, monospace; font-size: 11.5px; color: #B3ABC6">{{ m.key }}</span>
        <span style="{{ m.box }}">{{ m.mark }}</span>
      </button>
    </sc-for>
  </div>
  <a href="AutomationDetailG.dc.html" style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 18px; color: #FFFFFF; background: rgba(255,255,255,0.06); backdrop-filter: blur(26px) saturate(180%); -webkit-backdrop-filter: blur(26px) saturate(180%); border: 1px solid rgba(255,255,255,0.12); border-radius: 26px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), inset 0 -1px 0 rgba(255,255,255,0.06), 0 1px 2px rgba(0,0,0,0.3)"><span style="font-size: 16px">All settings</span><span style="font-size: 14px; color: #B3ABC6">Output · format · entries · schedule →</span></a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { t: 0, r: 0, f: 1, note: true, on: { sleep: true, steps: true, rhr: true, hrv: true, weight: false, mood: false } }; }
  renderVals() {
    var C = {"fill": "#3B3058", "fillText": "#FFFFFF", "partial": "rgba(255,255,255,0.07)", "bg": "#0E0E11", "text": "#FFFFFF", "sec": "#DAD4E8", "muted": "#B3ABC6", "accent": "#CDB6FF", "accentInk": "#1A0F33", "track": "rgba(255,255,255,0.20)", "coral": "#FFA184", "ok": "#8BF0B4", "surface": "rgba(255,255,255,0.10)", "surface2": "rgba(255,255,255,0.18)", "line": "rgba(255,255,255,0.14)", "glass": "rgba(255,255,255,0.06)", "glassStrong": "rgba(255,255,255,0.12)", "edge": "rgba(255,255,255,0.12)", "hi": "rgba(255,255,255,0.22)", "shadow": "0 1px 2px rgba(0,0,0,0.3)", "tint": "rgba(205,182,255,0.30)"}, self = this, s = this.state;
    var times = ['7:30', '6:00', '9:00 PM'], ranges = ['yesterday', 'the last 2 days', 'the last 7 days'], formats = ['Markdown', 'Markdown + Bases', 'JSON'];
    var M = [
      { id: 'sleep', label: 'Sleep', key: 'sleep_total_hours', v: '7.2' }, { id: 'steps', label: 'Steps', key: 'steps', v: '8412' },
      { id: 'rhr', label: 'Resting heart rate', key: 'resting_heart_rate', v: '54' }, { id: 'hrv', label: 'HRV', key: 'hrv_sdnn_ms', v: '48' },
      { id: 'weight', label: 'Weight', key: 'weight_kg', v: '72.4' }, { id: 'mood', label: 'State of mind', key: 'state_of_mind', v: 'pleasant' }
    ];
    var json = s.f === 2;
    var body = [json ? '{' : '---', json ? '  "date": "2026-10-30",' : 'date: 2026-10-30'];
    M.forEach(function (m) { if (s.on[m.id]) body.push(json ? '  "' + m.key + '": ' + (isNaN(+m.v) ? '"' + m.v + '"' : m.v) + ',' : m.key + ': ' + m.v); });
    body.push(json ? '}' : '---');
    var lines = body.map(function (t, i) {
      var meta = i === 0 || i === body.length - 1 || i === 1;
      return { no: i + 1, text: t, style: 'white-space: pre; color: ' + (meta ? C.muted : C.text) };
    });
    var count = 142 - (s.on.weight ? 0 : 1) - (s.on.mood ? 0 : 1);
    return {
      time: times[s.t], range: ranges[s.r], formatLabel: formats[s.f], noteLabel: s.note ? 'update my daily note' : 'leave daily notes alone', metricCount: count,
      cycleTime: function () { self.setState({ t: (s.t + 1) % 3 }); }, cycleRange: function () { self.setState({ r: (s.r + 1) % 3 }); },
      cycleFormat: function () { self.setState({ f: (s.f + 1) % 3 }); }, toggleNote: function () { self.setState({ note: !s.note }); },
      path: 'Vault/Health/2026-10-30.' + (json ? 'json' : 'md'), lines: lines,
      chips: M.map(function (m) {
        var on = s.on[m.id];
        return { label: m.label, key: m.key, pressed: on ? 'true' : 'false', mark: on ? '✓' : '',
          toggle: function () { var n = Object.assign({}, s.on); n[m.id] = !on; self.setState({ on: n }); },
          box: 'flex: none; width: 24px; height: 24px; border-radius: 12px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: ' + C.accentInk + '; background: ' + (on ? C.accent : 'transparent') + '; border: ' + (on ? 'none' : '1.5px solid ' + C.track) };
      })
    };
  }
}
</script>
</body>
</html>
