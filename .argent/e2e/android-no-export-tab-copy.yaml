version: 1
requires:
  platform: android
# android-no-export-tab-copy (3.5 → 4.0 parity, copy): Android 4.0 removed the Export tab, but the
# New automation sheet still said "Current folder (from Export tab)" and Settings › Schedule settings
# still said manual exports stay available "from the Export tab". This checks the 4.0 wording on
# both screens (PR #381). Nothing is saved.
#
# Prerequisite (fragment): the isolated QA app com.healthmd.android.e2e (playE2e), started UNLOCKED
# in UI test mode just before the run:
#   adb shell pm grant com.healthmd.android.e2e android.permission.POST_NOTIFICATIONS  # else Schedule
#     settings opens the system notification prompt over the text
#   adb shell am force-stop com.healthmd.android.e2e
#   adb shell am start -S -n com.healthmd.android.e2e/com.healthmd.presentation.MainActivity \
#     --ez uitesting true --es UITEST_HEALTH_AUTHORIZED true --es UITEST_PURCHASE_UNLOCKED true
# Side effects: none (the sheet is cancelled). Leaves the app on Schedule settings.
executionPrerequisite: "Notifications granted to com.healthmd.android.e2e; QA app just started UNLOCKED in UI test mode with the adb commands in the header; Archive showing, possibly under the Recover missed scheduled exports dialog."
steps:
  - echo: Unlocked QA app on Archive. Dismiss the recovery prompt if shown, then open Automations
  - when: { visible: { text: Not now } }
    steps:
      - tap: { text: Not now }
  - await: { visible: { text: See this day }, timeout: 8000 }
  - await: { idle: true }
  - tap: { text: Automations }
  - await: { visible: { text: New automation }, timeout: 8000 }
  - await: { idle: true }

  - echo: New automation › Device folder. Expect the default-folder wording, not the Export tab
  - tap: { text: New automation }
  - await: { visible: { text: Starts from the current export settings. }, timeout: 8000 }
  - await: { idle: true }
  - tap: { text: Device folder }
  - await: { visible: { text: "Default folder (Settings › Vault on this device)" }, timeout: 5000 }
  - tap: { text: Cancel }
  - await: { visible: { text: New automation }, timeout: 5000 }
  - await: { idle: true }

  - echo: Settings › Schedule settings. Expect manual exports to point at Export now
  - tap: { text: Settings }
  - await: { hidden: { text: New automation }, timeout: 8000 }
  - await: { idle: true }
  - scroll-to: { target: { text: Schedule settings } }
  - tap: { text: Schedule settings }
  - scroll-to: { target: { text: "Manual exports stay available from Export now." } }
  - await: { visible: { text: "Manual exports stay available from Export now." }, timeout: 5000 }
