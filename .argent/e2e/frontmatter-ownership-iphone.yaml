version: 1
requires:
  platform: ios
# #353: the composer's "Fields in this note" list says it picks collected data and that
# frontmatter properties are set in All settings → Format; Customize format says its
# switches alone decide frontmatter properties.
# Prerequisites: a Debug HealthMd build installed on an iPhone simulator. Synthetic
# UI-test mode (no HealthKit, test vault, fixture preview data); the default automation
# "Default" exists on first launch.
# Side effects: none (nothing is saved or exported).
# Coordinate exception: on this simulator the runner's native tree does not carry these
# SwiftUI rows, so taps are raw gesture-tap points (each preceded by an accessibility-tree
# wait on the element it hits) and waits stay raw await-ui-element steps on that tree.
steps:
  - echo: Launch Health.md in synthetic UI-test mode. Expect Archive
  - launch:
      native: com.codybontecou.obsidianhealth
      ios:
        app: com.codybontecou.obsidianhealth
        args:
          - --uitesting
          - -UITEST_HEALTH_AUTHORIZED
          - "true"
          - -UITEST_VAULT_SELECTED
          - "true"
          - -UITEST_PURCHASE_UNLOCKED
          - "true"
          - -UITEST_HEALTHKIT_EXPORT_PREVIEW_FIXTURES
          - "true"
          - -UITEST_SUPPRESSED_UPGRADE_PROMPTS
          - 1,3
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        identifier: glass.archive.sentence
      timeoutMs: 15000
  - await: { idle: true }
  - echo: Open the Automations tab. Expect the automation list
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        identifier: glass.tab.automations
  # Coordinate: centre of glass.tab.automations (not in the runner tree).
  - tool: gesture-tap
    args: { x: 0.405, y: 0.895 }
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        identifier: glass.automation.card
  - await: { idle: true }
  - echo: Open the Default automation. Expect its detail
  # Coordinate: the first (only) glass.automation.card.
  - tool: gesture-tap
    args: { x: 0.5, y: 0.27 }
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        identifier: glass.automation.editSentence
  - await: { idle: true }
  - echo: Open the composer. Expect "Fields in this note" with the note that Format owns frontmatter (#353)
  # Coordinate: centre of glass.automation.editSentence.
  - tool: gesture-tap
    args: { x: 0.206, y: 0.282 }
  - await: { idle: true }
  # Scroll the composer to the end of its content (scroll-to needs the runner tree);
  # two swipes so the All settings row always rests at the same point.
  - tool: gesture-swipe
    args: { fromX: 0.5, fromY: 0.8, toX: 0.5, toY: 0.3, momentum: false }
  - tool: gesture-swipe
    args: { fromX: 0.5, fromY: 0.8, toX: 0.5, toY: 0.3, momentum: false }
  - await: { idle: true }
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Frontmatter properties are set in All settings
      timeoutMs: 8000
  - echo: "Follow the note: All settings, then Format. Expect Customize format with the frontmatter ownership note"
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        identifier: glass.automation.allSettings
  # Coordinate: centre of glass.automation.allSettings with the composer scrolled to its end.
  - tool: gesture-tap
    args: { x: 0.5, y: 0.776 }
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        identifier: glass.automation.formatCustom
      timeoutMs: 8000
  - await: { idle: true }
  # Coordinate: centre of glass.automation.formatCustom.
  - tool: gesture-tap
    args: { x: 0.5, y: 0.686 }
  - await: { idle: true }
  # Scroll past the field groups (scroll-to needs the runner tree).
  - tool: gesture-swipe
    args: { fromX: 0.5, fromY: 0.8, toX: 0.5, toY: 0.45, momentum: false }
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Only fields switched on here go into frontmatter
      timeoutMs: 8000
