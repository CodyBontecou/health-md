version: 1
requires:
  platform: android
# android-unlock-without-destination: a locked user who has used the free export and has no export
# folder saw "Unlock Health.md" in the Export now sheet, but disabled, because the Unlock CTA shared
# the Export action's readiness gate (destination, permissions, format). Unlock only opens the
# paywall, so it must be tappable with nothing set up. This opens the sheet with no folder chosen
# and checks Unlock reaches the paywall. Nothing is exported or purchased.
#
# Prerequisite (fragment): the isolated QA app com.healthmd.android.e2e (playE2e), CLEARED so no
# export folder exists (there is no UI test key for destination state, and an automation cannot be
# saved with an unready destination), then started LOCKED with the free export used:
#   adb shell pm clear com.healthmd.android.e2e   # QA app only: drops its folder and automations
#   adb shell am force-stop com.healthmd.android.e2e
#   adb shell am start -S -n com.healthmd.android.e2e/com.healthmd.presentation.MainActivity \
#     --ez uitesting true --es UITEST_HEALTH_AUTHORIZED true --es UITEST_PURCHASE_UNLOCKED false \
#     --es UITEST_FREE_EXPORTS_USED 1 --es UITEST_STATIC_PURCHASE_PRICES true
# (If am start warns "intent has been delivered to currently running top-most instance", test mode
# did not start: force-stop and start again.)
# Side effects: the pm clear above removes the QA app's picked folder and its automations; a fresh
# app recreates only "Default" (no folder). Tests that need a folder must re-pick it.
# Leaves the app on the Default automation page.
#
# The sheet is opened from Automations › Default › Run now because the floating Export now button
# has no text or id in the runner tree. The Automations tab tap was taken before the recorder
# started and is written as the runner text tap other Android tests use; the replays prove it.
executionPrerequisite: "QA app com.healthmd.android.e2e cleared (pm clear, so no export folder) and
  just started LOCKED in UI test mode with UITEST_FREE_EXPORTS_USED 1 (adb commands in the header);
  Archive showing the Your archive starts here card."
steps:
  - echo: Cleared, locked QA app with the free export used. Open Automations
  - await: { visible: { text: Your archive starts here }, timeout: 8000 }
  - await: { idle: true }
  - tap: { text: Automations }
  - await: { visible: { text: New automation }, timeout: 8000 }
  - await: { idle: true }
  - tap: { text: { matches: '^Default$' } }
  - await: { visible: { text: Run now }, timeout: 5000 }
  - await: { idle: true }

  - echo: Default (no folder chosen) › Run now. Expect the Export now sheet with the folder setup action and Unlock Health.md
  - tap: { text: Run now }
  - await: { visible: { text: Unlock Health.md }, timeout: 8000 }
  - await: { idle: true }
  - assert: { visible: { text: Choose the folder this export writes to. } }

  - echo: Tap Unlock Health.md (disabled before the fix). Expect the paywall with Restore Purchase, then close it
  - tap: { text: Unlock Health.md }
  - await: { visible: { text: Restore Purchase }, timeout: 8000 }
  - await: { idle: true }
  - tap: { text: Close }
  - await: { hidden: { text: Restore Purchase }, timeout: 5000 }
