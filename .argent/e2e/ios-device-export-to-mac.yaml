version: 1
requires:
  platform: ios
# ios-device-export-to-mac: a physical iPhone pairs with Health.md for Mac over the local network
# and an automation set to "Connected Mac" exports yesterday into the Mac's destination folder.
#
# Prerequisites (not driven by this test):
#   - A physical iPhone (pass its UDID with --device), unlocked, with real Health data and Health.md
#     4.0 (Debug-iOS or TestFlight) installed; the user's own automation is named "Default" and
#     Mac destination is OFF.
#   - Health.md for Mac running on the same network with Receiver "Listening" and its destination
#     folder set to a QA folder named `mac-dest` (the test checks "Sent to mac-dest"). Back up the
#     Mac prefs first and point the folder back afterwards.
#   - No Mac relaunch is needed between runs: the Mac re-pairs after a disconnect since PR #401
#     (regression test: ios-device-mac-repair-after-disconnect). With an older Mac build, relaunch
#     Health.md for Mac right before the run.
# Side effects: the Mac writes <mac-dest>/Health/<yesterday>.md, a range rollup and the data
#   dictionary. The run: cleanup step deletes the "Default 2" copy and turns Mac destination off,
#   so the phone ends as it started. The user's Default automation is only duplicated, never edited.
# After the run, check the Mac folder: ls <mac-dest>/Health/
steps:
  - echo: Restart Health.md on the iPhone; expect Archive
  - launch: com.codybontecou.obsidianhealth
  - await: { visible: { id: glass.exportNow }, timeout: 15000 }
  - await: { idle: true }

  - echo: On Archive. Open Settings; expect the Mac Destination row
  - tap: { id: glass.tab.settings }
  - await: { visible: { id: glass.settings.mac }, timeout: 8000 }
  - await: { idle: true }

  - echo: On Settings. Open Mac Destination; expect the Mac destination toggle
  - tap: { id: glass.settings.mac }
  - await: { visible: { id: sync.syncToggle }, timeout: 8000 }
  - await: { idle: true }

  - echo: Turn on Mac destination; expect the iPhone to pair with the Mac (Ready for Mac Exports)
  - tap: { id: sync.syncToggle }
  - await: { visible: { text: Ready for Mac Exports }, timeout: 45000 }

  - echo: Paired. Go back and open Automations; expect the automation cards
  - tap: { id: BackButton }
  - await: { visible: { id: glass.tab.automations }, timeout: 8000 }
  - tap: { id: glass.tab.automations }
  - await: { visible: { id: glass.automation.card }, timeout: 8000 }
  - await: { idle: true }

  - echo: Open Default; expect its detail page with Duplicate
  - tap: { text: { matches: '^Default$' } }
  - await: { visible: { id: glass.automation.duplicate }, timeout: 8000 }
  - await: { idle: true }

  - echo: Duplicate Default so the user's own automation is left untouched; expect the Duplicated as notice
  - tap: { id: glass.automation.duplicate }
  - await: { visible: { id: glass.automation.duplicated.open }, timeout: 5000 }

  - echo: Back to the list and open the copy (Default 2)
  - tap: { id: BackButton }
  - tap: { text: Default 2 }
  - await: { visible: { text: "Name, Default 2" }, timeout: 8000 }
  - await: { idle: true }

  - echo: On Default 2. Open Output and set Destination to Connected Mac
  - tap: { id: glass.automation.output }
  - await: { visible: { text: "Destination, Vault on this iPhone" }, timeout: 8000 }
  - await: { idle: true }
  - tap: { text: Vault on this iPhone }
  - tap: { text: Connected Mac }
  - await: { visible: { text: "Destination, Connected Mac" }, timeout: 5000 }

  - echo: Destination is Connected Mac. Back to Default 2 and Run now
  - tap: { id: BackButton }
  - await: { visible: { text: to Connected Mac }, timeout: 5000 }
  - tap: { text: Run now }
  - await: { visible: { id: glass.exportNow.confirm }, timeout: 8000 }
  - await: { idle: true }

  - echo: Export yesterday; expect "1 day written" and "Sent to mac-dest"
  - tap: { id: glass.exportNow.confirm }
  - await: { visible: { id: status.exportBadge }, timeout: 90000 }
  - assert: { text: { in: { id: status.exportBadge }, contains: 1 day written } }
  - assert: { visible: { text: Sent to mac-dest } }

  - echo: Dismiss the export result
  - tap: { id: glass.exportMoment.dismiss }
  - await: { hidden: { text: Sent to mac-dest }, timeout: 8000 }
  - await: { idle: true }

  - echo: Clean up (delete Default 2, turn Mac destination off)
  - run: ios-device-export-to-mac-cleanup
