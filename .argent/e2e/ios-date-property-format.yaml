version: 1
requires:
  platform: ios
# Date property format (#452): EU Dash preset, Custom pattern seeding and live preview,
# and the ISO 8601 fallback for an invalid pattern, on the 4.0 Glass "Customize format"
# screen of the Default automation.
#
# Prerequisites (iOS simulator, Debug build of this branch installed):
#   UI-test mode reads launch ENVIRONMENT, which argent `launch:` cannot set, so export it
#   into the simulator's launchd once per boot before running:
#     for k in UITEST_HEALTH_AUTHORIZED UITEST_HAS_COMPLETED_ONBOARDING UITEST_VAULT_SELECTED \
#              UITEST_PURCHASE_UNLOCKED UITEST_HEALTHKIT_EXPORT_PREVIEW_FIXTURES; do
#       xcrun simctl spawn <udid> launchctl setenv $k true; done
#     for k in UITEST_SHOW_ONBOARDING UITEST_SHOW_RELEASE_NOTES UITEST_SHOW_POST_ONBOARDING_PAYWALL \
#              UITEST_CONFIGURATION_PROTECTION_ENABLED UITEST_SCHEDULE_ENABLED UITEST_DUPLICATE_EXPORT_PROFILE; do
#       xcrun simctl spawn <udid> launchctl setenv $k false; done
#     xcrun simctl spawn <udid> launchctl setenv UITEST_SUPPRESSED_UPGRADE_PROMPTS 1,3
#     xcrun simctl spawn <udid> launchctl setenv UITEST_FREE_EXPORTS_USED 0
#     xcrun simctl spawn <udid> launchctl setenv UITEST_FORMAT_PREVIEW_DATE 2026-01-13
#   With `--uitesting` the app resets onboarding/profile state at launch and starts on
#   Archive with a "Default" automation writing to TestVault.
# Side effects: changes the Default automation's date format, then resets its format
#   customization to defaults at the end. No files are exported.
# UITEST_FORMAT_PREVIEW_DATE pins the preview's "today" (Debug + --uitesting only), so the
#   preview checks are exact strings that do not depend on the run date.
# Glass rows, tabs and the segmented control are SwiftUI views with no UIView in the runner's
#   tree, so their taps replay the live coordinate gestures (each marked COORDINATE EXCEPTION)
#   and every one is followed by a raw `tool: await-ui-element` on a Glass id, which reads the
#   accessibility tree and proves the destination. UIKit pieces (menu, text field, dialog) use
#   text/id selectors.
steps:
  - echo: Launch Health.md in UI-test mode. Expect Archive
  - launch:
      native: com.codybontecou.obsidianhealth
      ios:
        app: com.codybontecou.obsidianhealth
        args:
          - --uitesting
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        identifier: glass.archive.attention
      timeoutMs: 15000
  - await: { idle: true }

  - echo: Open the Automations tab. Expect the automations list
  # COORDINATE EXCEPTION: the floating Liquid Glass tab bar is absent from the runner's
  # view-hierarchy tree (both id=glass.tab.automations and text "Automations" fail to
  # resolve), so this replays the live tap on the Automations tab at its describe frame
  # centre. The following wait on glass.automation.card proves the right screen opened.
  - tool: gesture-tap
    args:
      x: 0.405
      y: 0.895
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        identifier: glass.automation.card
  - await: { idle: true }

  - echo: Open the Default automation. Expect its settings page
  # COORDINATE EXCEPTION: the Default card is a SwiftUI view with no UIView in the runner tree;
  # live describe frame centre. The next wait on glass.automation.formatCustom proves it.
  - tool: gesture-tap
    args:
      x: 0.5
      y: 0.27
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        identifier: glass.automation.formatCustom
  - await: { idle: true }

  - echo: Open Format. Expect Customize format
  # COORDINATE EXCEPTION: the Format row is SwiftUI (not in the runner tree); live describe
  # frame centre. The next wait on glass.formatCustom.reset proves it.
  - tool: gesture-tap
    args:
      x: 0.5
      y: 0.686
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        identifier: glass.formatCustom.reset
  - await: { idle: true }

  - echo: "Setup: Reset format customization so a failed earlier run cannot leak its date format (UI-test mode does not reset it)"
  # COORDINATE EXCEPTION: toolbar Reset and the popover's Reset button, same live frames as the cleanup below.
  - tool: gesture-tap
    args:
      x: 0.866
      y: 0.096
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Reset format customization?
  # The popover ignores taps while it animates in.
  - await: { idle: true }
  - tool: gesture-tap
    args:
      x: 0.5
      y: 0.316
  - tool: await-ui-element
    args:
      condition: hidden
      selector:
        text: Reset format customization?
  - await: { idle: true }

  - echo: Jump to Dates & units. Expect the ISO 8601 picker and an ISO preview
  # COORDINATE EXCEPTION: the Glass segmented control is SwiftUI (not in the runner tree);
  # live describe frame centre. The next wait on the ISO picker label proves it scrolled.
  - tool: gesture-tap
    args:
      x: 0.803
      y: 0.163
  - await: { visible: { text: "ISO 8601 (2026-01-13)" } }
  - await: { idle: true }
  - tool: await-ui-element
    args:
      condition: text
      selector:
        identifier: glass.formatCustom.datePreview
      expectedText: "2026-01-13"
      textMatch: equals

  - echo: Open the Date format menu and choose EU Dash. Expect a DD-MM-YYYY preview
  - tap: { text: "ISO 8601 (2026-01-13)" }
  - tap: { text: "EU Dash (13-01-2026)" }
  - tool: await-ui-element
    args:
      condition: text
      selector:
        identifier: glass.formatCustom.datePreview
      expectedText: "13-01-2026"
      textMatch: equals

  - echo: Choose Custom pattern. Expect the field seeded with {day}-{month}-{year} and the same DD-MM-YYYY preview
  - tap: { text: "EU Dash (13-01-2026)" }
  - tap: { text: Custom pattern }
  - tool: await-ui-element
    args:
      condition: text
      selector:
        identifier: glass.formatCustom.customDatePattern
      expectedText: "{day}-{month}-{year}"
      textMatch: equals
  - tool: await-ui-element
    args:
      condition: text
      selector:
        identifier: glass.formatCustom.datePreview
      expectedText: "13-01-2026"
      textMatch: equals

  - echo: "Make the pattern invalid by typing ': x' (a YAML key separator). Expect the warning and an ISO preview"
  - tap: { id: glass.formatCustom.customDatePattern }
  - tool: keyboard
    args:
      text: ": x"
  - tool: await-ui-element
    args:
      condition: text
      selector:
        identifier: glass.formatCustom.customDatePattern
      expectedText: "{day}-{month}-{year}: x"
      textMatch: equals
  - tool: await-ui-element
    args:
      condition: exists
      selector:
        identifier: glass.formatCustom.customDatePatternInvalid
  - tool: await-ui-element
    args:
      condition: text
      selector:
        identifier: glass.formatCustom.datePreview
      expectedText: "2026-01-13"
      textMatch: equals

  - echo: "Clean up: Reset the format customization. Expect ISO 8601 and no warning"
  # COORDINATE EXCEPTION: toolbar Reset (glass.formatCustom.reset) is not in the runner tree;
  # live describe frame centre. The dialog tap below fails if it did not open.
  - tool: gesture-tap
    args:
      x: 0.866
      y: 0.096
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Reset format customization?
  - await: { idle: true }
  # COORDINATE EXCEPTION: the runner resolves the confirmation popover's "Reset" label but its
  # tap does not activate the SwiftUI button; live describe frame centre of the dialog button.
  # The next check fails if the reset did not happen.
  - tool: gesture-tap
    args:
      x: 0.5
      y: 0.316
  - await: { visible: { text: "ISO 8601 (2026-01-13)" } }
  - tool: await-ui-element
    args:
      condition: hidden
      selector:
        identifier: glass.formatCustom.customDatePatternInvalid
