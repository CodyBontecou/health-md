name: Health174175 full Website qualification
on:
  push:
    branches: ['prep/qualification/health174-175-fullwebsite-20261007']
permissions:
  contents: read
jobs:
  full-website:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Private finite full Website candidate recipe
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PYBOOT'
          import base64,hashlib,json,os,stat,time,types
          from pathlib import Path
          assert os.environ.get('GITHUB_ACTIONS')=='true'and os.environ.get('RUNNER_OS')=='Linux'and os.environ.get('RUNNER_ENVIRONMENT')=='github-hosted'
          assert os.environ.get('GITHUB_EVENT_NAME')=='push'and os.environ.get('GITHUB_RUN_ATTEMPT')=='1'
          assert os.environ.get('GITHUB_REF')=='refs/heads/prep/qualification/health174-175-fullwebsite-20261007'
          os.umask(0o077)
          root=Path(os.environ['RUNNER_TEMP'])/('health174175-fullwebsite-owned-'+os.environ['GITHUB_RUN_ID']);assert root.is_absolute()and not root.exists()and not root.is_symlink()
          root.mkdir(mode=0o700);assert root.resolve(strict=True)==root
          for leaf in ['sealed','home','tmp','logs','npm-cache']:
           (root/leaf).mkdir(mode=0o700)
          payload=base64.b64decode('',validate=True)
          assert len(payload)==44314 and hashlib.sha256(payload).hexdigest()=='16ca4b57f7cc6c29266d4c19fcaa630948b715c90733940bf2bbcdbe0f0b5955'
          for record in [{'name': 'runner.py', 'offset': 0, 'bytes': 7445, 'sha256': '875d0c360d19768ee28ce59b60286f9ba381c11b9a27f64cfad4338fdd798303'}, {'name': 'controller.py', 'offset': 7445, 'bytes': 16650, 'sha256': '20af7dac6d38b194455094bdb5d7004371240553312512f09bd2f1e3a142ecad'}, {'name': 'inputs.json', 'offset': 24095, 'bytes': 20219, 'sha256': 'ebf5df3d4b408df7cb16feb3cb22fee14b5a84fb28d319a703712bc396a834a6'}]:
           raw=payload[record['offset']:record['offset']+record['bytes']];assert len(raw)==record['bytes']and hashlib.sha256(raw).hexdigest()==record['sha256']
           path=root/'sealed'/record['name']
           with path.open('xb')as output:output.write(raw)
           st=path.lstat();assert stat.S_ISREG(st.st_mode)and st.st_uid==os.getuid()and st.st_nlink==1 and stat.S_IMODE(st.st_mode)==0o600
          raw=(root/'sealed'/'runner.py').read_bytes();assert hashlib.sha256(raw).hexdigest()=='875d0c360d19768ee28ce59b60286f9ba381c11b9a27f64cfad4338fdd798303'
          runner=types.ModuleType('fullwebsite_outer');exec(compile(raw,str(root/'sealed'/'runner.py'),'exec'),runner.__dict__)
          keep=['GITHUB_ACTIONS','RUNNER_OS','RUNNER_ENVIRONMENT','GITHUB_EVENT_NAME','GITHUB_RUN_ATTEMPT','GITHUB_REF']
          env={key:os.environ[key]for key in keep};env.update({'PATH':'/usr/bin:/bin','HOME':str(root/'home'),'TMPDIR':str(root/'tmp'),'LANG':'C','LC_ALL':'C','TZ':'UTC','GIT_ALLOW_PROTOCOL':''})
          def sink(chunk):
           import sys
           sys.stdout.buffer.write(chunk);sys.stdout.buffer.flush()
          try:
           receipt=runner.run_owned(['/usr/bin/python3','-c',"import hashlib,json,os,sys,time,types\nfrom pathlib import Path\nroot=Path(sys.argv[1]);sealed=root/'sealed'\ndef load(name,filename,sha):\n path=sealed/filename;raw=path.read_bytes();assert hashlib.sha256(raw).hexdigest()==sha\n module=types.ModuleType(name);exec(compile(raw,str(path),'exec'),module.__dict__);return module\nrunner=load('fullwebsite_runner','runner.py','875d0c360d19768ee28ce59b60286f9ba381c11b9a27f64cfad4338fdd798303')\ncontroller=load('fullwebsite_controller','controller.py','20af7dac6d38b194455094bdb5d7004371240553312512f09bd2f1e3a142ecad')\nraw=(sealed/'inputs.json').read_bytes();assert hashlib.sha256(raw).hexdigest()=='ebf5df3d4b408df7cb16feb3cb22fee14b5a84fb28d319a703712bc396a834a6'\ncontroller.main(run_owned=runner.run_owned,run_failure=runner.RunFailure,owned_root=root,packed=json.loads(raw),deadline=time.monotonic()+1180)\n",str(root)],cwd=root,env=env,timeout=1200,output_path=root/'logs'/'outer.log',output_cap=1572864,sink=sink)
          except runner.RunFailure as error:
           print(json.dumps({'kind':'outer-stop','receipt':error.receipt},sort_keys=True),flush=True);raise
          print(json.dumps({'kind':'outer-returned-zero','receipt':receipt},sort_keys=True),flush=True)
          PYBOOT
