name: Web CI
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_sha:
        type: string
        required: false
      full_qualification:
        type: boolean
        required: false
        default: true
permissions:
  contents: read
  actions: read
jobs:
  test:
    uses: ./.github/workflows/ci.yml
    with:
      release_sha: ${{ inputs.release_sha || github.sha }}
      full_qualification: true
