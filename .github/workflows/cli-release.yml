name: CLI Release

on:
  pull_request:
    paths:
      - 'apps/cli/**'
      - 'packages/healthmd-core-rust/**'
      - 'packages/contracts/**'
      - '.github/workflows/cli-*.yml'
      - '.github/workflows/core-rust-ci.yml'
      - '.github/workflows/apple-ci.yml'
      - '.github/workflows/android-ci.yml'
  push:
    tags:
      - 'healthmd-cli/v*'

permissions:
  contents: read

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  identity:
    name: Immutable release identity
    runs-on: ubuntu-24.04
    outputs:
      publishing: ${{ steps.identity.outputs.publishing }}
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      main-sha: ${{ steps.identity.outputs.main-sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.88.0
      - id: identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag="$GITHUB_REF_NAME"
            git fetch --force origin \
              "refs/tags/$tag:refs/tags/$tag" \
              "+refs/heads/main:refs/remotes/origin/main"
            main_sha="$(git rev-parse 'refs/remotes/origin/main^{commit}')"
            result="$(python3 apps/cli/scripts/verify-release.py \
              --tag "$tag" --sha "$GITHUB_SHA" --main-sha "$main_sha")"
            publishing=true
          else
            tag=""
            main_sha="$GITHUB_SHA"
            result="$(python3 apps/cli/scripts/verify-release.py)"
            publishing=false
          fi
          {
            echo "publishing=$publishing"
            echo "main-sha=$main_sha"
            echo "tag=$tag"
            echo "version=$(jq -r .version <<<"$result")"
          } >> "$GITHUB_OUTPUT"

  qualify-cli:
    name: Exact candidate / CLI
    needs: identity
    if: ${{ needs.identity.outputs.publishing == 'true' }}
    uses: ./.github/workflows/cli-ci.yml
    with:
      release_sha: ${{ github.sha }}
    permissions:
      contents: read

  qualify-core:
    name: Exact candidate / shared core
    needs: identity
    if: ${{ needs.identity.outputs.publishing == 'true' }}
    uses: ./.github/workflows/core-rust-ci.yml
    with:
      release_sha: ${{ github.sha }}
    permissions:
      contents: read

  qualify-apple:
    name: Exact candidate / Apple counterpart
    needs: identity
    if: ${{ needs.identity.outputs.publishing == 'true' }}
    uses: ./.github/workflows/apple-ci.yml
    with:
      release_sha: ${{ github.sha }}
    permissions:
      contents: read

  qualify-android:
    name: Exact candidate / Android counterpart
    needs: identity
    if: ${{ needs.identity.outputs.publishing == 'true' }}
    uses: ./.github/workflows/android-ci.yml
    with:
      release_sha: ${{ github.sha }}
    permissions:
      contents: read

  plan:
    name: Distribution plan
    needs: identity
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/cli
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ needs.identity.outputs.tag }}
      tag-flag: ${{ needs.identity.outputs.publishing == 'true' && format('--tag={0}', needs.identity.outputs.tag) || '' }}
      publishing: ${{ needs.identity.outputs.publishing }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install pinned dist
        shell: bash
        run: |
          set -euo pipefail
          installer="$(mktemp)"
          trap 'rm -f "$installer"' EXIT
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/cargo-dist-installer.sh \
            -o "$installer"
          echo 'e79d87e418b9d2cbe992d014985457c28a5a7c553add3da4ed1047e161c928f4  '"$installer" | sha256sum --check
          sh "$installer"
      - name: Cache dist executable
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          dist plan ${{ needs.identity.outputs.publishing == 'true' && format('--tag={0}', needs.identity.outputs.tag) || '' }} \
            --allow-dirty --output-format=json > plan-dist-manifest.json
          jq -e '.releases | length == 1' plan-dist-manifest.json >/dev/null
          jq -e '.releases[0].app_name == "healthmd-cli"' plan-dist-manifest.json >/dev/null
          echo "manifest=$(jq -c . plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: artifacts-plan-dist-manifest
          path: apps/cli/plan-dist-manifest.json

  create-draft:
    name: Create or verify draft release
    needs: [identity, plan]
    if: ${{ needs.identity.outputs.publishing == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.identity.outputs.tag }}
      VERSION: ${{ needs.identity.outputs.version }}
      PLAN: ${{ needs.plan.outputs.val }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Create immutable draft
        shell: bash
        run: |
          set -euo pipefail
          if release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" 2>/dev/null)"; then
            test "$(jq -r .draft <<<"$release")" = true
            test "$(jq -r .target_commitish <<<"$release")" = "$RELEASE_SHA"
            test "$(jq -r .prerelease <<<"$release")" = "$(jq -r .announcement_is_prerelease <<<"$PLAN")"
            echo "Reusing existing draft release for $TAG"
          else
            title="$(jq -r '.announcement_title // .releases[0].display_name // empty' <<<"$PLAN")"
            [[ -n "$title" ]] || title="Health.md CLI $VERSION"
            notes="$RUNNER_TEMP/notes.md"
            jq -r '.announcement_github_body // .releases[0].release_notes // "See apps/cli/CHANGELOG.md."' <<<"$PLAN" > "$notes"
            release_flags=(--draft --latest=false)
            if [[ "$(jq -r .announcement_is_prerelease <<<"$PLAN")" == true ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "$TAG" --verify-tag --target "$RELEASE_SHA" \
              "${release_flags[@]}" --title "$title" --notes-file "$notes"
          fi

  build-local-artifacts:
    name: Build local artifacts (${{ join(matrix.targets, ', ') }})
    needs: [identity, plan, qualify-cli, qualify-core, qualify-apple, qualify-android]
    if: >-
      ${{ always() && needs.plan.result == 'success' &&
          (needs.identity.outputs.publishing != 'true' ||
           (needs.qualify-cli.result == 'success' && needs.qualify-core.result == 'success' &&
            needs.qualify-apple.result == 'success' && needs.qualify-android.result == 'success')) &&
          fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null &&
          (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    defaults:
      run:
        working-directory: apps/cli
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    permissions:
      contents: read
    steps:
      - name: Enable Windows long paths
        working-directory: ${{ github.workspace }}
        run: git config --global core.longpaths true
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          submodules: recursive
      - name: Select pinned release Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
              sh -s -- -y --default-toolchain none --profile minimal
            export PATH="$HOME/.cargo/bin:$PATH"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustc --version | grep -F 'rustc 1.88.0'
      - name: Install pinned dist
        shell: bash
        run: |
          set -euo pipefail
          installer="$(mktemp)"
          trap 'rm -f "$installer"' EXIT
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/cargo-dist-installer.sh \
            -o "$installer"
          echo 'e79d87e418b9d2cbe992d014985457c28a5a7c553add3da4ed1047e161c928f4  '"$installer" | sha256sum --check
          sh "$installer"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: artifacts-*
          path: apps/cli/target/distrib/
          merge-multiple: true
      - name: Install pinned cargo-auditable
        shell: bash
        run: cargo install cargo-auditable --version 0.7.5 --locked
      - name: Install native dependencies
        run: ${{ matrix.packages_install }}
      - name: Build candidate archives
        shell: bash
        run: |
          set -euo pipefail
          dist build ${{ needs.plan.outputs.tag-flag }} --allow-dirty --print=linkage \
            --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
      - id: cargo-dist
        name: Collect candidate archives
        shell: bash
        run: |
          {
            echo "paths<<EOF"
            dist print-upload-files-from-manifest --manifest dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            apps/cli/${{ env.BUILD_MANIFEST_NAME }}

  sign-macos-artifacts:
    name: Sign and notarize macOS (${{ matrix.target }})
    needs: [identity, build-local-artifacts]
    if: ${{ needs.identity.outputs.publishing == 'true' && needs.build-local-artifacts.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    environment: cli-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: artifacts-build-local-${{ matrix.target }}
          path: candidate
      - name: Sign, test credential upgrade, notarize, and staple
        shell: bash
        env:
          APPLE_CLI_CERTIFICATE_P12: ${{ secrets.APPLE_CLI_CERTIFICATE_P12 }}
          APPLE_CLI_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CLI_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.CLI_APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.identity.outputs.version }}
        run: |
          set -euo pipefail
          test "$(jq -r .apple.team_id apps/cli/release-identities.json)" = "$APPLE_TEAM_ID"
          archive="$(find candidate -type f -name "healthmd-cli-${TARGET}.tar.xz" -print -quit)"
          test -n "$archive"
          apps/cli/scripts/sign-macos-archive.sh "$archive" "$TARGET" "$VERSION"
          if [[ "$(dirname "$archive")" != candidate ]]; then
            cp "$archive" "candidate/$(basename "$archive")"
            cp "${archive%.tar.xz}.dmg" "candidate/$(basename "${archive%.tar.xz}.dmg")"
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: artifacts-signed-${{ matrix.target }}
          path: |
            candidate/healthmd-cli-${{ matrix.target }}.tar.xz
            candidate/healthmd-cli-${{ matrix.target }}.dmg
            candidate/*-dist-manifest.json
          if-no-files-found: error

  assemble-release-artifacts:
    name: Assemble exact signed candidate set
    needs: [identity, build-local-artifacts, sign-macos-artifacts]
    if: >-
      ${{ always() && needs.identity.outputs.publishing == 'true' &&
          needs.build-local-artifacts.result == 'success' &&
          needs.sign-macos-artifacts.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: artifacts-build-local-*
          path: unsigned
          merge-multiple: true
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: artifacts-signed-*
          path: signed
          merge-multiple: true
      - name: Replace unsigned platform archives exactly
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          cp -R unsigned/. release/
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            name="healthmd-cli-${target}.tar.xz"
            replacement="$(find signed -type f -name "$name" -print -quit)"
            destination="$(find release -type f -name "$name" -print -quit)"
            checksum="$(find release -type f -name "${name}.sha256" -print -quit)"
            test -n "$replacement" && test -n "$destination" && test -n "$checksum"
            cp "$replacement" "$destination"
            (cd "$(dirname "$destination")" && sha256sum "$name") > "$checksum"
          done
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            dmg="$(find signed -type f -name "healthmd-cli-${target}.dmg" -print -quit)"
            test -n "$dmg"
            cp "$dmg" release/
          done
          test "$(find release -type f \( -name '*.tar.xz' -o -name '*.zip' \) | wc -l | tr -d ' ')" = 4
          test "$(find release -type f -name '*.dmg' | wc -l | tr -d ' ')" = 2
      - name: Attest exact signed candidate set
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: |
            release/*.tar.xz
            release/*.zip
            release/*.dmg
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: artifacts-release-candidates
          path: release/
          if-no-files-found: error

  qualify-local-artifacts:
    name: Smoke packaged binaries (${{ join(matrix.targets, ', ') }})
    needs: [identity, plan, build-local-artifacts, assemble-release-artifacts]
    if: >-
      ${{ always() && needs.build-local-artifacts.result == 'success' &&
          (needs.identity.outputs.publishing != 'true' ||
           needs.assemble-release-artifacts.result == 'success') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Download unsigned PR candidates
        if: ${{ needs.identity.outputs.publishing != 'true' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: artifacts-build-local-*
          path: candidate
          merge-multiple: true
      - name: Download signed release candidates
        if: ${{ needs.identity.outputs.publishing == 'true' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: artifacts-release-candidates
          path: candidate
      - name: Execute exact packaged candidate
        shell: bash
        env:
          TARGET: ${{ join(matrix.targets, ',') }}
          VERSION: ${{ needs.identity.outputs.version }}
        run: |
          set -euo pipefail
          archive="$(find candidate -type f \
            \( -name "healthmd-cli-${TARGET}.tar.xz" -o -name "healthmd-cli-${TARGET}.zip" \) \
            -print -quit)"
          test -n "$archive"
          python3 apps/cli/scripts/safe-extract-release.py "$archive" unpacked
          suffix=""
          [[ "$RUNNER_OS" == Windows ]] && suffix=".exe"
          healthmd="$(find unpacked -type f -name "healthmd${suffix}" -print -quit)"
          mcp="$(find unpacked -type f -name "healthmd-mcp${suffix}" -print -quit)"
          test -n "$healthmd" && test -n "$mcp"
          "$healthmd" --version | grep -F "$VERSION"
          "$healthmd" --help >/dev/null
          "$healthmd" mcp schema healthmd_sleep_sessions > schema.json
          python3 - <<'PY'
          import json
          value = json.load(open("schema.json", encoding="utf-8"))
          assert value["schema"] == "healthmd.mcp_tool_schema"
          assert value["tool"]["name"] == "healthmd_sleep_sessions"
          PY
          "$mcp" --help >/dev/null
      - name: Verify Developer ID, notarization, and stapling after extraction
        if: ${{ needs.identity.outputs.publishing == 'true' && runner.os == 'macOS' }}
        shell: bash
        env:
          TARGET: ${{ join(matrix.targets, ',') }}
          APPLE_TEAM_ID: ${{ vars.CLI_APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test "$(jq -r .apple.team_id apps/cli/release-identities.json)" = "$APPLE_TEAM_ID"
          healthmd_identifier="$(jq -r .apple.healthmd_identifier apps/cli/release-identities.json)"
          healthmd_mcp_identifier="$(jq -r .apple.healthmd_mcp_identifier apps/cli/release-identities.json)"
          for executable in unpacked/*/healthmd unpacked/*/healthmd-mcp; do
            codesign --verify --strict --verbose=2 "$executable"
            details="$(codesign -dv --verbose=4 "$executable" 2>&1)"
            grep -F "TeamIdentifier=${APPLE_TEAM_ID}" <<<"$details"
            expected_identifier="$healthmd_identifier"
            [[ "$(basename "$executable")" == healthmd-mcp ]] && expected_identifier="$healthmd_mcp_identifier"
            test "$(sed -n 's/^Identifier=//p' <<<"$details")" = "$expected_identifier"
            spctl --assess --type execute --verbose=2 "$executable"
          done
          dmg="$(find candidate -type f -name "healthmd-cli-${TARGET}.dmg" -print -quit)"
          test -n "$dmg"
          codesign --verify --strict --verbose=2 "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
      - name: Verify Authenticode after extraction
        if: ${{ needs.identity.outputs.publishing == 'true' && runner.os == 'Windows' }}
        shell: pwsh
        env:
          EXPECTED_SIGNER_SUBJECT: ${{ vars.CLI_WINDOWS_SIGNER_SUBJECT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $executables = @(Get-ChildItem unpacked -Recurse -File -Filter '*.exe')
          if ($executables.Count -ne 2) { throw "expected two signed executables" }
          foreach ($executable in $executables) {
            $signature = Get-AuthenticodeSignature -LiteralPath $executable.FullName
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid -or
                $null -eq $signature.TimeStamperCertificate -or
                $null -eq $signature.SignerCertificate -or
                $signature.SignerCertificate.Subject -cne $env:EXPECTED_SIGNER_SUBJECT) {
              throw "signature qualification failed for $($executable.Name)"
            }
          }

  build-global-artifacts:
    name: Build checksums and installers
    needs: [identity, plan, build-local-artifacts, assemble-release-artifacts, qualify-local-artifacts]
    if: >-
      ${{ always() && needs.build-local-artifacts.result == 'success' &&
          needs.qualify-local-artifacts.result == 'success' &&
          (needs.identity.outputs.publishing != 'true' ||
           needs.assemble-release-artifacts.result == 'success') }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/cli
    env:
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      - name: Download unsigned PR candidates
        if: ${{ needs.identity.outputs.publishing != 'true' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: artifacts-build-local-*
          path: apps/cli/target/distrib/
          merge-multiple: true
      - name: Download signed release candidates
        if: ${{ needs.identity.outputs.publishing == 'true' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: artifacts-release-candidates
          path: apps/cli/target/distrib/
      - id: cargo-dist
        shell: bash
        run: |
          set -euo pipefail
          dist build ${{ needs.plan.outputs.tag-flag }} --allow-dirty --output-format=json \
            --artifacts=global > dist-manifest.json
          {
            echo "paths<<EOF"
            jq --raw-output '.upload_files[]' dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            apps/cli/${{ env.BUILD_MANIFEST_NAME }}

  seal-release-artifacts:
    name: Sign final checksum closure
    needs: [identity, assemble-release-artifacts, sbom]
    if: >-
      ${{ needs.identity.outputs.publishing == 'true' &&
          needs.assemble-release-artifacts.result == 'success' &&
          needs.sbom.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: artifacts-release-candidates
          path: release
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: artifacts-build-global
          path: global
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: artifacts-cli-sbom
          path: sbom
      - name: Install pinned cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.1
      - name: Recompute and sign exact final checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t archives < <(find release -maxdepth 1 -type f \( -name '*.tar.xz' -o -name '*.zip' \) -print | sort)
          mapfile -t dmgs < <(find release -maxdepth 1 -type f -name '*.dmg' -print | sort)
          test "${#archives[@]}" = 4
          test "${#dmgs[@]}" = 2
          mapfile -t archive_checksums < <(find release -maxdepth 1 -type f -name '*.sha256' -print | sort)
          mapfile -t sbom_payloads < <(find sbom -maxdepth 1 -type f -print | sort)
          test "${#archive_checksums[@]}" = 4
          test "${#sbom_payloads[@]}" = 3
          dmg_checksums=()
          for dmg in "${dmgs[@]}"; do
            checksum="global/$(basename "$dmg").sha256"
            digest="$(sha256sum "$dmg" | cut -d ' ' -f 1)"
            printf '%s  %s\n' "$digest" "$(basename "$dmg")" > "$checksum"
            dmg_checksums+=("$checksum")
          done
          cp apps/cli/release-identities.json global/release-identities.json
          payloads=(
            "${archives[@]}"
            "${dmgs[@]}"
            "${archive_checksums[@]}"
            "${dmg_checksums[@]}"
            "${sbom_payloads[@]}"
            global/healthmd-cli-installer.sh
            global/healthmd.rb
            global/release-identities.json
          )
          test "${#payloads[@]}" = 18
          printf '%s\n' "${payloads[@]##*/}" | LC_ALL=C sort | uniq -d > duplicate-names.txt
          test ! -s duplicate-names.txt
          : > global/sha256.sum
          for payload in "${payloads[@]}"; do
            test -f "$payload"
            digest="$(sha256sum "$payload" | cut -d ' ' -f 1)"
            printf '%s  %s\n' "$digest" "$(basename "$payload")" >> global/sha256.sum
          done
          LC_ALL=C sort -k2,2 -o global/sha256.sum global/sha256.sum
          cosign sign-blob --yes \
            --bundle global/sha256.sum.sigstore.json \
            global/sha256.sum
      - name: Attest exact post-signing global assets
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: |
            global/healthmd-cli-installer.sh
            global/healthmd.rb
            global/release-identities.json
            global/sha256.sum
            global/sha256.sum.sigstore.json
            global/*.dmg.sha256
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: artifacts-sealed-global
          path: global/
          if-no-files-found: error

  qualify-global-artifacts:
    name: Qualify checksums and installer URLs
    needs: [identity, plan, build-global-artifacts, seal-release-artifacts]
    if: >-
      ${{ always() && needs.build-global-artifacts.result == 'success' &&
          (needs.identity.outputs.publishing != 'true' ||
           needs.seal-release-artifacts.result == 'success') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download unsigned PR candidates
        if: ${{ needs.identity.outputs.publishing != 'true' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: artifacts-build-local-*
          path: candidate
          merge-multiple: true
      - name: Download signed release candidates
        if: ${{ needs.identity.outputs.publishing == 'true' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: artifacts-release-candidates
          path: candidate
      - name: Download unsigned PR global artifacts
        if: ${{ needs.identity.outputs.publishing != 'true' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: artifacts-build-global
          path: candidate
      - name: Download sealed release global artifacts
        if: ${{ needs.identity.outputs.publishing == 'true' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: artifacts-sealed-global
          path: candidate
      - name: Download release SBOM closure
        if: ${{ needs.identity.outputs.publishing == 'true' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: artifacts-cli-sbom
          path: candidate
      - name: Install pinned cosign
        if: ${{ needs.identity.outputs.publishing == 'true' }}
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.1
      - name: Verify global release closure
        env:
          TAG: ${{ needs.identity.outputs.tag }}
          VERSION: ${{ needs.identity.outputs.version }}
          PUBLISHING: ${{ needs.identity.outputs.publishing }}
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          sha256sum --check sha256.sum
          for checksum in *.sha256; do sha256sum --check "$checksum"; done
          if [[ "$PUBLISHING" == true ]]; then
            expected_identity="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/cli-release.yml@${GITHUB_REF}"
            cosign verify-blob \
              --bundle sha256.sum.sigstore.json \
              --certificate-identity "$expected_identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              sha256.sum
            grep -F "$TAG" healthmd-cli-installer.sh healthmd.rb
            if grep -R -F '/releases/latest' healthmd-cli-installer.sh healthmd.rb; then
              echo "installer must not use the repository-wide latest release" >&2
              exit 1
            fi
            test "$(find . -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')" = 2
            test -f healthmd-cli-aarch64-apple-darwin.dmg.sha256
            test -f healthmd-cli-x86_64-apple-darwin.dmg.sha256
          fi
          test "$(find . -maxdepth 1 -type f \( -name '*.tar.xz' -o -name '*.zip' \) | wc -l | tr -d ' ')" = 4

  sbom:
    name: Qualify release SBOM
    needs: [identity, qualify-local-artifacts]
    if: ${{ needs.identity.outputs.publishing == 'true' && needs.qualify-local-artifacts.result == 'success' }}
    uses: ./.github/workflows/cli-sbom.yml
    with:
      tag: ${{ needs.identity.outputs.tag }}
      release_sha: ${{ github.sha }}
      main_sha: ${{ needs.identity.outputs.main-sha }}
    permissions:
      attestations: write
      contents: read
      id-token: write

  upload-draft:
    name: Upload qualified draft assets
    needs: [identity, create-draft, qualify-global-artifacts, sbom]
    if: >-
      ${{ needs.identity.outputs.publishing == 'true' && needs.create-draft.result == 'success' &&
          needs.qualify-global-artifacts.result == 'success' && needs.sbom.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.identity.outputs.tag }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: artifacts-release-candidates
          path: artifacts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: artifacts-sealed-global
          path: artifacts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: artifacts-cli-sbom
          path: artifacts
      - name: Upload only qualified assets
        shell: bash
        run: |
          set -euo pipefail
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          test "$(jq -r .draft <<<"$release")" = true
          test "$(jq -r .target_commitish <<<"$release")" = "$RELEASE_SHA"
          find artifacts -type f \( -name '*-dist-manifest.json' -o -name 'plan-dist-manifest.json' \) -delete
          mapfile -t assets < <(find artifacts -type f -print | sort)
          test "${#assets[@]}" -gt 0
          gh release upload "$TAG" "${assets[@]}" --clobber

  verify-draft-assets:
    name: Verify remote draft bytes
    needs: [identity, upload-draft]
    if: ${{ needs.upload-draft.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.identity.outputs.tag }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: artifacts-release-candidates
          path: expected
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: artifacts-sealed-global
          path: expected
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: artifacts-cli-sbom
          path: expected
      - name: Install pinned cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.1
      - name: Compare every remote asset byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          find expected -type f \( -name '*-dist-manifest.json' -o -name 'plan-dist-manifest.json' \) -delete
          mkdir remote
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir remote
          find expected -type f -printf '%f\n' | LC_ALL=C sort > expected.names
          find remote -type f -printf '%f\n' | LC_ALL=C sort > remote.names
          cmp expected.names remote.names
          while IFS= read -r name; do
            expected_path="$(find expected -type f -name "$name" -print -quit)"
            remote_path="$(find remote -type f -name "$name" -print -quit)"
            test -n "$expected_path" && test -n "$remote_path"
            test "$(sha256sum "$expected_path" | cut -d ' ' -f 1)" = \
              "$(sha256sum "$remote_path" | cut -d ' ' -f 1)"
          done < expected.names
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          test "$(jq -r .draft <<<"$release")" = true
          test "$(jq -r .target_commitish <<<"$release")" = "$RELEASE_SHA"
          expected_identity="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/cli-release.yml@${GITHUB_REF}"
          cosign verify-blob \
            --bundle remote/sha256.sum.sigstore.json \
            --certificate-identity "$expected_identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            remote/sha256.sum
          (cd remote && sha256sum --check sha256.sum)

  finalize-release:
    name: Publish qualified release
    needs: [identity, plan, verify-draft-assets]
    if: ${{ needs.verify-draft-assets.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: cli-release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.identity.outputs.tag }}
      RELEASE_SHA: ${{ github.sha }}
      VERSION: ${{ needs.identity.outputs.version }}
      PLAN: ${{ needs.plan.outputs.val }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: artifacts-release-candidates
          path: expected
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: artifacts-sealed-global
          path: expected
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: artifacts-cli-sbom
          path: expected
      - name: Install pinned cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.1
      - name: Reverify remote bytes after publication approval
        shell: bash
        run: |
          set -euo pipefail
          find expected -type f \( -name '*-dist-manifest.json' -o -name 'plan-dist-manifest.json' \) -delete
          mkdir remote
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir remote
          find expected -type f -printf '%f\n' | LC_ALL=C sort > expected.names
          find remote -type f -printf '%f\n' | LC_ALL=C sort > remote.names
          cmp expected.names remote.names
          while IFS= read -r name; do
            expected_path="$(find expected -type f -name "$name" -print -quit)"
            remote_path="$(find remote -type f -name "$name" -print -quit)"
            test "$(sha256sum "$expected_path" | cut -d ' ' -f 1)" = \
              "$(sha256sum "$remote_path" | cut -d ' ' -f 1)"
          done < expected.names
          expected_identity="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/cli-release.yml@${GITHUB_REF}"
          cosign verify-blob \
            --bundle remote/sha256.sum.sigstore.json \
            --certificate-identity "$expected_identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            remote/sha256.sum
          (cd remote && sha256sum --check sha256.sum)
      - name: Atomically publish without changing repository latest
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$RELEASE_SHA"
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          test "$(jq -r .target_commitish <<<"$release")" = "$RELEASE_SHA"
          expected_prerelease="$(jq -r .announcement_is_prerelease <<<"$PLAN")"
          test "$(jq -r .prerelease <<<"$release")" = "$expected_prerelease"
          if [[ "$(jq -r .draft <<<"$release")" == true ]]; then
            release_id="$(jq -r .id <<<"$release")"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              -F draft=false -f make_latest=false >/dev/null
            release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          fi
          test "$(jq -r .draft <<<"$release")" = false
          while IFS= read -r expected_asset; do
            jq -e --arg name "$expected_asset" \
              '.assets | any(.name == $name)' <<<"$release" >/dev/null
          done < <(jq -r '.releases[0].artifacts[]' <<<"$PLAN")
          for expected_asset in \
            "healthmd-cli-$VERSION.spdx.json" \
            "healthmd-cli-$VERSION.cdx.json" \
            "healthmd-cli-$VERSION.sbom.sha256" \
            "healthmd-cli-aarch64-apple-darwin.dmg" \
            "healthmd-cli-aarch64-apple-darwin.dmg.sha256" \
            "healthmd-cli-x86_64-apple-darwin.dmg" \
            "healthmd-cli-x86_64-apple-darwin.dmg.sha256" \
            "release-identities.json" \
            "sha256.sum.sigstore.json"; do
            jq -e --arg name "$expected_asset" \
              '.assets | any(.name == $name)' <<<"$release" >/dev/null
          done
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          test "$latest" != "$TAG"

  publish-homebrew-formula:
    name: Publish stable Homebrew formula
    needs: [identity, plan, finalize-release]
    if: >-
      ${{ needs.finalize-release.result == 'success' &&
          (!fromJson(needs.plan.outputs.val).announcement_is_prerelease ||
           fromJson(needs.plan.outputs.val).publish_prereleases) }}
    runs-on: ubuntu-22.04
    env:
      PLAN: ${{ needs.plan.outputs.val }}
      GITHUB_USER: healthmd-release-bot
      GITHUB_EMAIL: admin+bot@health.md
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: true
          repository: CodyBontecou/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: artifacts-sealed-global
          path: ${{ runner.temp }}/formula-artifact
      - name: Commit generated formula idempotently
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "$GITHUB_USER"
          git config user.email "$GITHUB_EMAIL"
          while IFS= read -r release; do
            filename="$(jq -r '.artifacts[] | select(endswith(".rb"))' <<<"$release")"
            name="${filename%.rb}"
            version="$(jq -r .app_version <<<"$release")"
            source_formula="$(find "$RUNNER_TEMP/formula-artifact" -type f -name "$filename" -print -quit)"
            test -n "$source_formula"
            mkdir -p Formula
            cp "$source_formula" "Formula/$filename"
            export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
            brew update
            brew style --except-cops FormulaAudit/Homepage,FormulaAudit/Desc,FormulaAuditStrict \
              "Formula/$filename"
            git add "Formula/$filename"
            if ! git diff --cached --quiet; then
              git commit -m "$name $version"
            fi
          done < <(jq -c '.releases[] | select([.artifacts[] | endswith(".rb")] | any)' <<<"$PLAN")
          if [[ "$(git rev-list --count '@{upstream}..HEAD')" -gt 0 ]]; then
            git push
          fi
          test -z "$(git status --porcelain)"
