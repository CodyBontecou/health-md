name: Apple Nightly Extended Tests

on:
  schedule:
    - cron: '0 4 * * *'  # 4:00 AM UTC daily
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extended-ios:
    # Notelet requires Swift tools 6.3. GitHub-hosted macos-15 currently selects
    # an older Swift toolchain, so use the self-hosted runner's matching Xcode.
    runs-on: self-hosted
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/apple

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Prepare and validate shared Rust core for Apple
        run: make prepare-healthmd-core-rust

      - name: Select newest compatible iOS Simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          IOS_DESTINATION=$(scripts/select-ios-simulator.sh)
          echo "Using simulator destination: ${IOS_DESTINATION}"
          echo "ios_destination=${IOS_DESTINATION}" >> "$GITHUB_OUTPUT"

      - name: Run iOS unit tests
        run: |
          set -euo pipefail
          mkdir -p build/logs
          make test-ios IOS_SIM='${{ steps.simulator.outputs.ios_destination }}' 2>&1 | tee build/logs/build-ios.log

      - name: Run full UI test suite (iOS, non-blocking)
        if: ${{ success() }}
        continue-on-error: true
        timeout-minutes: 20
        run: |
          set -euo pipefail
          xcodebuild test \
            -project HealthMd.xcodeproj \
            -scheme HealthMd-UITests-iOS \
            -destination '${{ steps.simulator.outputs.ios_destination }}' \
            -configuration Debug-iOS \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee -a build/logs/build-ios.log \
            | grep -E "Test Case|error:|PASSED|FAILED|Executed"

      - name: Check warnings (iOS — strict)
        if: ${{ !cancelled() }}
        run: scripts/check-warnings.sh build/logs/build-ios.log

      - name: Upload iOS nightly artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nightly-ios-logs
          path: apps/apple/build/logs/build-ios.log
          retention-days: 30

  extended-macos:
    # Notelet currently requires Swift tools 6.3; use the self-hosted runner
    # with the matching Xcode instead of GitHub-hosted macos-15.
    runs-on: self-hosted
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/apple

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Prepare and validate shared Rust core for Apple
        run: make prepare-healthmd-core-rust

      - name: Run macOS unit tests
        run: |
          set -euo pipefail
          mkdir -p build/logs
          make test-macos 2>&1 | tee build/logs/build-macos.log

      - name: Collect code coverage (macOS)
        if: ${{ success() }}
        timeout-minutes: 30
        run: make coverage

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          if [ -d build/coverage/HealthMd.xcresult ]; then
            echo "## Nightly Code Coverage" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            xcrun xccov view --report --only-targets build/coverage/HealthMd.xcresult >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "Coverage data unavailable" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check coverage threshold
        if: ${{ !cancelled() }}
        run: scripts/check-coverage.sh build/coverage/HealthMd.xcresult

      - name: Check warnings (macOS — strict)
        if: ${{ !cancelled() }}
        run: scripts/check-warnings.sh build/logs/build-macos.log

      - name: Upload macOS nightly artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nightly-macos-artifacts
          path: |
            apps/apple/build/coverage/HealthMd.xcresult
            apps/apple/build/logs/build-macos.log
          retention-days: 30
