name: Apple Nightly Extended Tests

on:
  schedule:
    - cron: '0 4 * * *'  # 4:00 AM UTC daily
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-shared-core:
    runs-on: xcode-27
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/apple
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'

      - name: Verify pinned SDK27 compiler and public API
        run: bash scripts/qualify-history-authorization-sdk27.sh

      - name: Restore exact-source shared Rust core from Apple CI
        uses: actions/cache/restore@v4
        with:
          path: |
            apps/apple/Packages/HealthMdCoreRust/Artifacts/HealthmdCore.xcframework
            apps/apple/Packages/HealthMdCoreRust/Artifacts/.healthmd-core-source.sha256
          key: >-
            apple-shared-core-sdk27-27A266a-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('packages/healthmd-core-rust/Cargo.toml',
            'packages/healthmd-core-rust/Cargo.lock',
            'packages/healthmd-core-rust/rust-toolchain.toml',
            'packages/healthmd-core-rust/crates/**',
            'packages/healthmd-core-rust/scripts/*apple*',
            'apps/apple/Packages/HealthMdCoreRust/Bindings/**') }}

      - name: Set up pinned Rust compiler for binding verification
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache binding compiler dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: apple-nightly-bindings
          workspaces: packages/healthmd-core-rust -> target

      # Always validate the source digest, bindings and slices, including hits.
      - name: Prepare and validate shared Rust core for Apple
        run: make prepare-healthmd-core-rust

      - name: Record validated source commit
        run: git rev-parse HEAD > Packages/HealthMdCoreRust/Artifacts/.nightly-source-sha

      - name: Share validated native core from this run
        uses: actions/upload-artifact@v4
        with:
          name: nightly-shared-core
          path: |
            apps/apple/Packages/HealthMdCoreRust/Artifacts/HealthmdCore.xcframework
            apps/apple/Packages/HealthMdCoreRust/Artifacts/.healthmd-core-source.sha256
            apps/apple/Packages/HealthMdCoreRust/Artifacts/.nightly-source-sha
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  ui-runner-gate:
    needs: prepare-shared-core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      # Claim the long iOS/unit and UI/build runners before matrix fan-out can
      # occupy the account's macOS slots. This gate consumes no macOS runner.
      - name: Allocate critical Apple build runners first
        working-directory: apps/apple
        timeout-minutes: 16
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/apple_nightly_ui.py wait-build-runners
          --root build/nightly-ui --source-sha '${{ github.sha }}'
          --repository '${{ github.repository }}' --run-id '${{ github.run_id }}'

  extended-ios:
    needs: prepare-shared-core
    # Match Apple CI's hosted Xcode 26 / Swift 6.3 runner.
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/apple

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'

      - name: Verify pinned SDK27 compiler and public API
        run: bash scripts/qualify-history-authorization-sdk27.sh

      - name: Download validated native core from this run
        uses: actions/download-artifact@v4
        with:
          name: nightly-shared-core
          path: apps/apple/Packages/HealthMdCoreRust/Artifacts

      - name: Validate native core source and slices
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat Packages/HealthMdCoreRust/Artifacts/.nightly-source-sha)" = '${{ github.sha }}'
          test -s Packages/HealthMdCoreRust/Artifacts/.healthmd-core-source.sha256
          ../../packages/healthmd-core-rust/scripts/validate-apple-xcframework.sh \
            Packages/HealthMdCoreRust/Artifacts/HealthmdCore.xcframework

      - name: Select newest compatible iOS Simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          IOS_DESTINATION=$(scripts/select-ios-simulator.sh)
          echo "Using simulator destination: ${IOS_DESTINATION}"
          echo "ios_destination=${IOS_DESTINATION}" >> "$GITHUB_OUTPUT"
          python3 scripts/apple_nightly_ui.py start-simulator --root build/nightly-unit \
            --source-sha '${{ github.sha }}' --destination "$IOS_DESTINATION"

      - name: Run iOS unit tests
        run: |
          set -euo pipefail
          mkdir -p build/logs
          make test-ios CORE_RUST_PREPARE=: IOS_TEST_BUILD_FLAGS="ARCHS=$(uname -m) ONLY_ACTIVE_ARCH=YES COMPILER_INDEX_STORE_ENABLE=NO" IOS_SIM='${{ steps.simulator.outputs.ios_destination }}' 2>&1 | tee build/logs/build-ios.log

      - name: Check warnings (iOS — strict)
        if: ${{ !cancelled() }}
        run: scripts/check-warnings.sh build/logs/build-ios.log

      - name: Upload iOS nightly artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nightly-ios-logs
          path: |
            apps/apple/build/logs/build-ios.log
            apps/apple/build/test-results/HealthMd-iOS.xcresult
            apps/apple/build/logs/xcodebuild-ios-raw.log
          retention-days: 30

  extended-macos:
    needs: [prepare-shared-core, ui-runner-gate]
    # Match the toolchain and coverage-enabled suite used by Apple CI.
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/apple

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'

      - name: Verify pinned SDK27 compiler and public API
        run: bash scripts/qualify-history-authorization-sdk27.sh

      - name: Download validated native core from this run
        uses: actions/download-artifact@v4
        with:
          name: nightly-shared-core
          path: apps/apple/Packages/HealthMdCoreRust/Artifacts

      - name: Validate native core source and slices
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat Packages/HealthMdCoreRust/Artifacts/.nightly-source-sha)" = '${{ github.sha }}'
          test -s Packages/HealthMdCoreRust/Artifacts/.healthmd-core-source.sha256
          ../../packages/healthmd-core-rust/scripts/validate-apple-xcframework.sh \
            Packages/HealthMdCoreRust/Artifacts/HealthmdCore.xcframework

      - name: Run macOS unit tests with coverage
        timeout-minutes: 45
        run: |
          set -euo pipefail
          mkdir -p build/logs
          make coverage CORE_RUST_PREPARE=: 2>&1 | tee build/logs/build-macos.log

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          if [ -d build/coverage/HealthMd.xcresult ]; then
            echo "## Nightly Code Coverage" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            xcrun xccov view --report --only-targets build/coverage/HealthMd.xcresult >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "Coverage data unavailable" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check coverage threshold
        if: ${{ !cancelled() }}
        run: scripts/check-coverage.sh build/coverage/HealthMd.xcresult

      - name: Check warnings (macOS — strict)
        if: ${{ !cancelled() }}
        run: scripts/check-warnings.sh build/logs/build-macos.log

      - name: Upload macOS nightly artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nightly-macos-artifacts
          path: |
            apps/apple/build/coverage/HealthMd.xcresult
            apps/apple/build/logs/build-macos.log
          retention-days: 30

  prepare-ui:
    needs: prepare-shared-core
    # Match Apple CI's hosted Xcode 26 / Swift 6.3 runner.
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/apple

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'

      - name: Verify pinned SDK27 compiler and public API
        run: bash scripts/qualify-history-authorization-sdk27.sh

      - name: Download validated native core from this run
        uses: actions/download-artifact@v4
        with:
          name: nightly-shared-core
          path: apps/apple/Packages/HealthMdCoreRust/Artifacts

      - name: Validate native core source and slices
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat Packages/HealthMdCoreRust/Artifacts/.nightly-source-sha)" = '${{ github.sha }}'
          test -s Packages/HealthMdCoreRust/Artifacts/.healthmd-core-source.sha256
          ../../packages/healthmd-core-rust/scripts/validate-apple-xcframework.sh \
            Packages/HealthMdCoreRust/Artifacts/HealthmdCore.xcframework

      - name: Start simulator before independent work
        id: ui_simulator
        shell: bash
        run: |
          set -euo pipefail
          IOS_DESTINATION=$(scripts/select-ios-simulator.sh)
          echo "ios_destination=${IOS_DESTINATION}" >> "$GITHUB_OUTPUT"
          python3 scripts/apple_nightly_ui.py start-simulator --root build/nightly-ui \
            --source-sha '${{ github.sha }}' --destination "$IOS_DESTINATION"

      - name: Build and enumerate complete UI suite once
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/logs build/nightly-ui
          touch build/nightly-ui/.healthmd-ui-build-start
          xcodebuild build-for-testing \
            -project HealthMd.xcodeproj -scheme HealthMd-UITests-iOS \
            -configuration Debug-iOS -destination '${{ steps.ui_simulator.outputs.ios_destination }}' \
            -derivedDataPath build/nightly-ui \
            ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee build/logs/nightly-ui-build.log
          UI_MANIFEST=$(python3 scripts/validate_ios_ui_xctestrun.py \
            --derived-data build/nightly-ui --source-sha '${{ github.sha }}' \
            --receipt build/logs/nightly-ui-build-receipt.json)
          xcodebuild test-without-building -xctestrun "$UI_MANIFEST" \
            -destination '${{ steps.ui_simulator.outputs.ios_destination }}' -enumerate-tests \
            -test-enumeration-style flat -test-enumeration-format json \
            -test-enumeration-output-path "$PWD/build/nightly-ui/ui-enumeration.json" \
            2>&1 | tee -a build/logs/nightly-ui-build.log
          python3 scripts/apple_nightly_ui.py plan --root build/nightly-ui --source-sha '${{ github.sha }}'
          python3 scripts/apple_nightly_ui.py pack --root build/nightly-ui \
            --artifact build/nightly-ui-products --source-sha '${{ github.sha }}' \
            --destination '${{ steps.ui_simulator.outputs.ios_destination }}'

      - name: Check UI build warnings (strict)
        if: ${{ !cancelled() }}
        run: scripts/check-warnings.sh build/logs/nightly-ui-build.log

      - name: Upload prepared UI products
        uses: actions/upload-artifact@v4
        with:
          name: nightly-ui-products
          path: apps/apple/build/nightly-ui-products
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload complete UI plan
        uses: actions/upload-artifact@v4
        with:
          name: nightly-ui-plan
          path: |
            apps/apple/build/nightly-ui/ui-plan.json
            apps/apple/build/nightly-ui/ui-enumeration.json
          retention-days: 30
          if-no-files-found: error

      - name: Upload UI build diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nightly-ui-build-logs
          path: apps/apple/build/logs/nightly-ui-*
          retention-days: 30

      # Reuse the build runner's warm simulator for one complete UI shard.
      # The other three workers can consume products as soon as they upload.
      - name: Prepare builder simulator and run UI shard zero
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apple_nightly_ui.py ready-simulator \
            --root build/nightly-ui-execution --source-sha '${{ github.sha }}' \
            --destination '${{ steps.ui_simulator.outputs.ios_destination }}'
          python3 scripts/apple_nightly_ui.py run \
            --artifact build/nightly-ui-products --root build/nightly-ui-execution \
            --source-sha '${{ github.sha }}' --shard 0 \
            --destination '${{ steps.ui_simulator.outputs.ios_destination }}'

      - name: Check builder UI runtime warnings (strict)
        if: ${{ !cancelled() }}
        run: scripts/check-warnings.sh build/logs/nightly-ui-0.log

      - name: Upload builder UI inventory
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nightly-ui-inventory-0
          path: apps/apple/build/logs/ui-shard-0.json
          retention-days: 30
          if-no-files-found: error

      - name: Upload builder UI diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nightly-ui-results-0
          path: |
            apps/apple/build/logs/nightly-ui-0.log
            apps/apple/build/test-results/Nightly-UI-0.xcresult
          retention-days: 30

  ui-shards:
    needs: [prepare-shared-core, ui-runner-gate]
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: apps/apple
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'

      - name: Verify pinned SDK27 compiler and public API
        run: bash scripts/qualify-history-authorization-sdk27.sh

      - name: Start simulator before independent work
        id: ui_simulator
        shell: bash
        run: |
          set -euo pipefail
          IOS_DESTINATION=$(scripts/select-ios-simulator.sh)
          echo "ios_destination=${IOS_DESTINATION}" >> "$GITHUB_OUTPUT"
          python3 scripts/apple_nightly_ui.py start-simulator --root build/nightly-ui \
            --source-sha '${{ github.sha }}' --destination "$IOS_DESTINATION"

      - name: Wait for simulator and native Files providers
        shell: bash
        run: >-
          python3 scripts/apple_nightly_ui.py ready-simulator
          --root build/nightly-ui --source-sha '${{ github.sha }}'
          --destination '${{ steps.ui_simulator.outputs.ios_destination }}'

      # Workers boot while the separate UI producer compiles. Wait only for
      # this run's products; source/toolchain/inventory checks still precede tests.
      - name: Wait for exact-run UI products
        timeout-minutes: 16
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/apple_nightly_ui.py wait-products
          --root build/nightly-ui --source-sha '${{ github.sha }}'
          --repository '${{ github.repository }}' --run-id '${{ github.run_id }}'

      - name: Download exact-run prepared UI products
        uses: actions/download-artifact@v4
        with:
          name: nightly-ui-products
          path: apps/apple/build/nightly-ui-products

      - name: Run and audit assigned UI shard
        if: ${{ success() }}
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apple_nightly_ui.py run \
            --artifact build/nightly-ui-products --root build/nightly-ui \
            --source-sha '${{ github.sha }}' --shard '${{ matrix.shard }}' \
            --destination '${{ steps.ui_simulator.outputs.ios_destination }}'

      - name: Check UI runtime warnings (strict)
        if: ${{ !cancelled() }}
        run: scripts/check-warnings.sh build/logs/nightly-ui-${{ matrix.shard }}.log

      - name: Upload UI shard inventory
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nightly-ui-inventory-${{ matrix.shard }}
          path: apps/apple/build/logs/ui-shard-${{ matrix.shard }}.json
          retention-days: 30
          if-no-files-found: error

      - name: Upload UI shard diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nightly-ui-results-${{ matrix.shard }}
          path: |
            apps/apple/build/logs/nightly-ui-${{ matrix.shard }}.log
            apps/apple/build/test-results/Nightly-UI-${{ matrix.shard }}.xcresult
          retention-days: 30

  ui-inventory:
    needs: [prepare-ui, ui-shards]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Require all UI workers to pass
        env:
          UI_BUILD_RESULT: ${{ needs.prepare-ui.result }}
          UI_SHARD_RESULT: ${{ needs.ui-shards.result }}
        run: test "$UI_BUILD_RESULT" = success && test "$UI_SHARD_RESULT" = success

      - name: Download compiled full-suite inventory
        uses: actions/download-artifact@v4
        with:
          name: nightly-ui-plan
          path: apps/apple/build/nightly-ui-inventory

      - name: Download every UI shard receipt
        uses: actions/download-artifact@v4
        with:
          pattern: nightly-ui-inventory-*
          path: apps/apple/build/nightly-ui-inventory/shards

      - name: Verify complete UI coverage exactly once
        working-directory: apps/apple
        run: >-
          python3 scripts/apple_nightly_ui.py aggregate
          --root build/nightly-ui-inventory --source-sha '${{ github.sha }}'

      - name: Upload verified UI inventory
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nightly-ui-full-inventory
          path: apps/apple/build/nightly-ui-inventory
          retention-days: 30
