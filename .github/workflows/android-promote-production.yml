name: Android Promote production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact Android semantic version to promote'
        required: true
        type: string
      version_code:
        description: 'Exact Google Play versionCode to promote from Internal Testing'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-google-play-mutation
  cancel-in-progress: false

env:
  PACKAGE_NAME: com.healthmd.android

jobs:
  promote-production:
    name: Promote Android release to production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: google-play
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Checkout promotion workflow revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable promotion request
        id: release
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          [[ "$GITHUB_REF_NAME" == "ops/android-production-$VERSION-"* \
            || "$GITHUB_REF_NAME" == "android/v$VERSION" ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse --verify refs/remotes/origin/main >/dev/null
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main

          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]

          tag="android/v$VERSION"
          git show-ref --verify --quiet "refs/tags/$tag"
          test "$(git cat-file -t "$tag")" = tag

          tagged_gradle=$(git show "$tag:apps/android/app/build.gradle.kts")
          tagged_version=$(printf '%s\n' "$tagged_gradle" \
            | sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' \
            | head -1)
          tagged_code=$(printf '%s\n' "$tagged_gradle" \
            | sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' \
            | head -1)
          test "$tagged_version" = "$VERSION"
          test "$tagged_code" = "$VERSION_CODE"

          tagged_sha=$(git rev-parse "$tag^{commit}")
          git merge-base --is-ancestor "$tagged_sha" refs/remotes/origin/main

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$tagged_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout immutable release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Verify release source checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.release.outputs.sha }}
          VERSION: ${{ inputs.version }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)" = "$VERSION"
          test "$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)" = "$VERSION_CODE"

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: true

      - name: Validate wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          min-wrapper-count: 1

      - name: Configure ephemeral Google Play credentials
        shell: bash
        env:
          PLAY_CONSOLE_KEY_JSON: ${{ secrets.PLAY_CONSOLE_KEY_JSON }}
        run: |
          set -euo pipefail
          test -n "${PLAY_CONSOLE_KEY_JSON:-}"
          play_key="$RUNNER_TEMP/play-console-key.json"
          printf '%s' "$PLAY_CONSOLE_KEY_JSON" > "$play_key"
          chmod 600 "$play_key"
          echo "PLAY_CONSOLE_KEY_PATH=$play_key" >> "$GITHUB_ENV"

      - name: Create Google Play access token
        id: play-auth
        shell: bash
        run: |
          set -euo pipefail
          private_key="$RUNNER_TEMP/play-console-private-key.pem"
          jq -er '.private_key' "$PLAY_CONSOLE_KEY_PATH" > "$private_key"
          chmod 600 "$private_key"

          client_email=$(jq -er '.client_email' "$PLAY_CONSOLE_KEY_PATH")
          token_uri=$(jq -er '.token_uri' "$PLAY_CONSOLE_KEY_PATH")
          now=$(date +%s)
          base64url() {
            openssl base64 -A | tr '+/' '-_' | tr -d '='
          }
          header=$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | base64url)
          claims=$(jq -nc \
            --arg iss "$client_email" \
            --arg scope 'https://www.googleapis.com/auth/androidpublisher' \
            --arg aud "$token_uri" \
            --argjson iat "$now" \
            '{iss: $iss, scope: $scope, aud: $aud, iat: $iat, exp: ($iat + 1200)}' \
            | base64url)
          unsigned="$header.$claims"
          signature=$(printf '%s' "$unsigned" \
            | openssl dgst -sha256 -sign "$private_key" \
            | base64url)
          token_response=$(curl --fail-with-body --retry 3 --retry-all-errors --max-time 30 -sS \
            -X POST "$token_uri" \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer' \
            --data-urlencode "assertion=$unsigned.$signature")
          access_token=$(printf '%s' "$token_response" | jq -er '.access_token')
          echo "::add-mask::$access_token"
          echo "access_token=$access_token" >> "$GITHUB_OUTPUT"
          rm -f "$private_key"

      - name: Verify internal source and production precondition
        id: preflight
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.play-auth.outputs.access_token }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          query_track() {
            local track=$1
            local destination=$2
            curl --fail-with-body --retry 3 --retry-all-errors --max-time 30 -sS \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/${PACKAGE_NAME}/tracks/${track}/releases" \
              -o "$destination"
          }
          has_code() {
            local file=$1
            jq -e --argjson code "$VERSION_CODE" '
              any(.releases[]?.activeArtifacts[]?; (.versionCode | tonumber) == $code)
            ' "$file" >/dev/null
          }

          internal="$RUNNER_TEMP/google-play-internal.json"
          production="$RUNNER_TEMP/google-play-production-before.json"
          query_track internal "$internal"
          query_track production "$production"

          max_production_code=$(jq '[.releases[]?.activeArtifacts[]?.versionCode | tonumber] | max // 0' "$production")
          if (( max_production_code > VERSION_CODE )); then
            echo "::error::Production already contains newer versionCode $max_production_code"
            exit 1
          fi

          if has_code "$production"; then
            echo "already_production=true" >> "$GITHUB_OUTPUT"
            echo "Version code $VERSION_CODE is already present on production; promotion will be reconciled without mutation."
            exit 0
          fi

          if ! has_code "$internal"; then
            echo "::error::Version code $VERSION_CODE is not active on the internal track"
            exit 1
          fi
          echo "already_production=false" >> "$GITHUB_OUTPUT"

      - name: Promote exact internal artifact to production
        id: promote
        if: steps.preflight.outputs.already_production != 'true'
        continue-on-error: true
        env:
          VERSION_CODE: ${{ inputs.version_code }}
        run: >-
          ./gradlew --no-daemon
          :app:promoteReleaseArtifact
          --from-track internal
          --promote-track production
          --version-code "$VERSION_CODE"
          --release-status completed
          --stacktrace

      - name: Verify production postcondition
        id: verify
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.play-auth.outputs.access_token }}
          VERSION_CODE: ${{ inputs.version_code }}
          PROMOTE_OUTCOME: ${{ steps.promote.outcome }}
        run: |
          set -euo pipefail
          production="$RUNNER_TEMP/google-play-production-after.json"
          candidate=''
          for _ in $(seq 1 20); do
            curl --fail-with-body --retry 3 --retry-all-errors --max-time 30 -sS \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/${PACKAGE_NAME}/tracks/production/releases" \
              -o "$production"
            candidate=$(jq -c --argjson code "$VERSION_CODE" '
              first(
                .releases[]? as $release
                | $release.activeArtifacts[]?
                | select((.versionCode | tonumber) == $code)
                | {
                    version_code: (.versionCode | tonumber),
                    release_name: $release.releaseName,
                    lifecycle_state: $release.releaseLifecycleState
                  }
              ) // empty
            ' "$production")
            if [[ -n "$candidate" ]]; then
              break
            fi
            sleep 15
          done

          if [[ -z "$candidate" ]]; then
            echo "::error::Production postcondition is absent for versionCode $VERSION_CODE (promotion step: ${PROMOTE_OUTCOME:-skipped})"
            exit 1
          fi

          release_name=$(printf '%s' "$candidate" | jq -er '.release_name // ""')
          lifecycle_state=$(printf '%s' "$candidate" | jq -er '.lifecycle_state')
          echo "release_name=$release_name" >> "$GITHUB_OUTPUT"
          echo "lifecycle_state=$lifecycle_state" >> "$GITHUB_OUTPUT"
          echo "Verified production versionCode $VERSION_CODE with lifecycle state $lifecycle_state."

      - name: Send production changes for review
        id: submit-review
        if: steps.verify.outputs.lifecycle_state == 'RELEASE_LIFECYCLE_STATE_NOT_SENT_FOR_REVIEW'
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.play-auth.outputs.access_token }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          edit_response=$(curl --fail-with-body --retry 3 --retry-all-errors --max-time 30 -sS \
            -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/${PACKAGE_NAME}/edits" \
            --data '{}')
          edit_id=$(printf '%s' "$edit_response" | jq -er '.id')

          cleanup_edit() {
            if [[ -n "${edit_id:-}" ]]; then
              curl --fail-with-body --retry 3 --retry-all-errors --max-time 30 -sS \
                -X DELETE \
                -H "Authorization: Bearer $ACCESS_TOKEN" \
                "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/${PACKAGE_NAME}/edits/${edit_id}" \
                >/dev/null || true
            fi
          }
          trap cleanup_edit EXIT

          production_track="$RUNNER_TEMP/google-play-production-edit.json"
          curl --fail-with-body --retry 3 --retry-all-errors --max-time 30 -sS \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/${PACKAGE_NAME}/edits/${edit_id}/tracks/production" \
            -o "$production_track"
          jq -e --argjson code "$VERSION_CODE" '
            any(.releases[]?.versionCodes[]?; tonumber == $code)
          ' "$production_track" >/dev/null

          curl --fail-with-body --retry 3 --retry-all-errors --max-time 30 -sS \
            -X PUT \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/${PACKAGE_NAME}/edits/${edit_id}/tracks/production" \
            --data-binary "@$production_track" \
            >/dev/null

          curl --fail-with-body --retry 3 --retry-all-errors --max-time 30 -sS \
            -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/${PACKAGE_NAME}/edits/${edit_id}:commit?changesNotSentForReview=false&changesInReviewBehavior=ERROR_IF_IN_REVIEW" \
            --data '' \
            >/dev/null
          edit_id=''
          trap - EXIT
          echo "Submitted production versionCode $VERSION_CODE for Google Play review."

      - name: Verify review submission lifecycle
        id: verify-review
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.play-auth.outputs.access_token }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          production="$RUNNER_TEMP/google-play-production-review.json"
          candidate=''
          for _ in $(seq 1 40); do
            curl --fail-with-body --retry 3 --retry-all-errors --max-time 30 -sS \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/${PACKAGE_NAME}/tracks/production/releases" \
              -o "$production"
            candidate=$(jq -c --argjson code "$VERSION_CODE" '
              first(
                .releases[]? as $release
                | $release.activeArtifacts[]?
                | select((.versionCode | tonumber) == $code)
                | {
                    release_name: $release.releaseName,
                    lifecycle_state: $release.releaseLifecycleState
                  }
              ) // empty
            ' "$production")
            lifecycle_state=$(printf '%s' "$candidate" | jq -r '.lifecycle_state // empty')
            case "$lifecycle_state" in
              RELEASE_LIFECYCLE_STATE_IN_REVIEW|\
              RELEASE_LIFECYCLE_STATE_APPROVED_NOT_PUBLISHED|\
              RELEASE_LIFECYCLE_STATE_PUBLISHED)
                echo "release_name=$(printf '%s' "$candidate" | jq -r '.release_name // ""')" >> "$GITHUB_OUTPUT"
                echo "lifecycle_state=$lifecycle_state" >> "$GITHUB_OUTPUT"
                echo "Verified review-submission lifecycle: $lifecycle_state"
                exit 0
                ;;
            esac
            sleep 15
          done
          echo "::error::Production versionCode $VERSION_CODE remains not sent for review"
          exit 1

      - name: Remove ephemeral credentials
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/play-console-key.json" "$RUNNER_TEMP/play-console-private-key.pem"

      - name: Promotion summary
        if: ${{ always() }}
        env:
          VERSION: ${{ inputs.version }}
          VERSION_CODE: ${{ inputs.version_code }}
          TAG: ${{ steps.release.outputs.tag }}
          SHA: ${{ steps.release.outputs.sha }}
          ALREADY_PRODUCTION: ${{ steps.preflight.outputs.already_production }}
          PROMOTE_OUTCOME: ${{ steps.promote.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          REVIEW_SUBMISSION_OUTCOME: ${{ steps.submit-review.outcome }}
          REVIEW_VERIFICATION_OUTCOME: ${{ steps.verify-review.outcome }}
          RELEASE_NAME: ${{ steps.verify-review.outputs.release_name || steps.verify.outputs.release_name }}
          LIFECYCLE_STATE: ${{ steps.verify-review.outputs.lifecycle_state || steps.verify.outputs.lifecycle_state }}
        run: |
          {
            echo "## Android production promotion"
            echo
            echo "- Version: $VERSION"
            echo "- Version code: $VERSION_CODE"
            echo "- Source track: internal"
            echo "- Destination track: production"
            echo "- Already on production: ${ALREADY_PRODUCTION:-unknown}"
            echo "- Promotion step: ${PROMOTE_OUTCOME:-skipped}"
            echo "- Production verification: ${VERIFY_OUTCOME:-not-run}"
            echo "- Review submission: ${REVIEW_SUBMISSION_OUTCOME:-skipped}"
            echo "- Review lifecycle verification: ${REVIEW_VERIFICATION_OUTCOME:-not-run}"
            echo "- Google Play lifecycle: ${LIFECYCLE_STATE:-unknown}"
            echo "- Google Play release name: ${RELEASE_NAME:-unknown}"
            echo "- Tag: ${TAG:-unknown}"
            echo "- Commit: ${SHA:-unknown}"
          } >> "$GITHUB_STEP_SUMMARY"
