name: PR189 JVM diagnosis (not qualification)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr189-jvm-diagnostic-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # The action's default also requests the retired SDK 'tools' package.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Restore pinned Rust toolchain and native build cache
        uses: ./.github/actions/android-native-cache
        with:
          cache-targets: android

      - name: Install pinned Android NDK
        shell: bash
        run: |
          set -euo pipefail
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$android_sdk"
          sdkmanager "ndk;27.1.12297006"
          echo "ANDROID_NDK_HOME=$android_sdk/ndk/27.1.12297006" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$android_sdk/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Validate wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          min-wrapper-count: 1

      - name: Prepare the unchanged native core
        run: ./scripts/run-ci-gradle.sh :healthmd-core:prepareRustDebug :healthmd-core:checkHealthMdCoreKotlinBindings --stacktrace
      - name: Run bounded Release JVM diagnosis
        working-directory: ${{ github.workspace }}
        run: bash .github/scripts/pr189-jvm-diagnostic.sh
      - name: Retain synthetic JVM diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr189-jvm-release-diagnostics
          path: |
            apps/android/build/reports/pr189-jvm-diagnostic/
            apps/android/app/build/test-results/testPlayReleaseUnitTest/
            apps/android/app/build/reports/tests/testPlayReleaseUnitTest/
          retention-days: 3
          if-no-files-found: warn
