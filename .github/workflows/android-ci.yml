name: Android CI

on:
  # Run on every PR so the stable final gate can be a required check. Main-branch pushes
  # remain path-aware to avoid rebuilding an unaffected component after merge.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'apps/cli/**'
      - 'packages/contracts/**'
      - 'packages/healthmd-core-rust/**'
      - 'docs/migration/**'
      - '.github/workflows/README.md'
      - '.github/workflows/android-*.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      release_sha:
        description: Exact commit to qualify
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Validate shared contracts
        working-directory: ${{ github.workspace }}
        run: |
          python3 packages/contracts/validate.py
          (cd packages/contracts && python3 -m unittest test_validate_shared_setup.py)

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install pinned Google Play CLI
        shell: bash
        run: |
          set -euo pipefail
          download="$RUNNER_TEMP/gplay-download"
          curl -fsSL \
            https://github.com/tamtom/play-console-cli/releases/download/v0.8.0/gplay-linux-amd64 \
            -o "$download"
          echo "ea9d812878dcc61faa0401a306f3f648ab6779d87358e07afb8590e9c96a313a  $download" \
            | sha256sum --check --strict
          install -m 0755 "$download" "$RUNNER_TEMP/gplay"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Validate Google Play listing metadata
        run: ./scripts/validate-play-listing.sh

      - name: Validate paired Android promotion policy
        run: ./scripts/test-android-promotion-policy.sh

      - name: Validate Wear audit evidence links
        run: ./scripts/verify-wear-audit-evidence.sh

      - name: Validate Android release scripts and evidence policies
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/*.sh scripts/tests/*.sh
          bash scripts/tests/test_check_wear_adb_pair_readiness.sh
          bash scripts/tests/test_check_github_wear_release_environments.sh
          bash scripts/tests/test_google_play_generated_apk_policy.sh
          bash scripts/tests/test_validate_wear_artifact_policy.sh
          ruby -c fastlane/Fastfile
          python3 -m py_compile scripts/*.py scripts/tests/*.py
          python3 scripts/tests/test_android_workflow_action_pins.py
          python3 scripts/tests/test_android_release_documentation_policy.py
          python3 scripts/tests/test_extract_wear_release_evidence_archive.py
          python3 scripts/tests/test_validate_wear_release_attestation.py
          bash scripts/tests/test_seal_wear_release_evidence.sh
          bash scripts/tests/test_verify_android_production_promotion_evidence.sh
          bash scripts/tests/test_verify_android_production_promotion_recovery_evidence.sh
          python3 scripts/tests/test_verify_wear_battery_evidence.py
          python3 scripts/tests/test_verify_wear_paired_qa_evidence.py
          python3 scripts/tests/test_verify_wear_play_screenshot_evidence.py
          python3 scripts/tests/test_verify_wear_play_screenshot_upload_evidence.py

      - name: Validate Wear screenshots when manual assets are present
        shell: bash
        run: |
          if [[ -f play-store/wear/screenshots/wear-app.png || -f play-store/wear/screenshots/wear-tile.png ]]; then
            python3 ./scripts/validate-wear-play-assets.py
          else
            echo "Manual Wear Play screenshots are pending; release workflow enforces them."
          fi

      - name: Set up pinned Rust Android toolchain
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal
          rustup target add --toolchain 1.88.0 \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android \
            i686-linux-android
          rustup run 1.88.0 cargo install cargo-ndk --version 4.1.2 --locked

      - name: Install pinned Android NDK
        shell: bash
        run: |
          set -euo pipefail
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$android_sdk"
          sdkmanager "ndk;27.1.12297006"
          echo "ANDROID_NDK_HOME=$android_sdk/ndk/27.1.12297006" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$android_sdk/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Validate wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          min-wrapper-count: 1

      - name: Prepare source-built Rust core
        run: ./gradlew :healthmd-core:prepareRustDebug :healthmd-core:checkHealthMdCoreKotlinBindings --stacktrace

      - name: Run app variant, wearable contract, Wear, and protocol tests
        shell: bash
        run: |
          set -euo pipefail
          # Keep Compose compiler peaks bounded and compile one app variant at a time.
          ./gradlew --no-daemon --max-workers=2 \
            :app:testDebugUnitTest \
            :healthmd-core:testDebugUnitTest \
            :wearable-contract:test \
            :wear:testDebugUnitTest \
            :direct-protocol:test \
            --stacktrace
          ./gradlew --no-daemon --max-workers=2 :app:testReleaseUnitTest --stacktrace
          ./gradlew --no-daemon --max-workers=2 :app:testE2eUnitTest --stacktrace

      - name: Run Wear lint, assemble, and bundle
        run: ./gradlew :wear:lintDebug :wear:assembleDebug :wear:bundleDebug --stacktrace

      - name: Run Android lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Assemble debug app and validate packaged pair and retained Play-generated APK policy
        run: |
          ./gradlew :app:assembleDebug :app:bundleDebug --stacktrace
          ./scripts/test-wear-bundle-manifest-verifier.sh \
            wear/build/outputs/bundle/debug/wear-debug.aab \
            app/build/outputs/bundle/debug/app-debug.aab
          bash scripts/tests/test_verify_google_play_generated_apk_evidence.sh

      - name: Enable KVM access
        run: sudo chmod 666 /dev/kvm

      - name: Run shared-core instrumentation smoke test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          script: |
            cd apps/android && ./gradlew :healthmd-core:connectedDebugAndroidTest :app:connectedDebugAndroidTest --stacktrace
            cd apps/android && ANDROID_SERIAL=emulator-5554 HEALTHMD_ANDROID_E2E_HOST=10.0.2.2 ./scripts/run-direct-cli-ui-e2e.sh

  wear-emulator-smoke:
    name: Wear emulator smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Enable KVM access
        run: sudo chmod 666 /dev/kvm
      - name: Install and launch Wear artifact
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          # API 34 is the latest standard android-wear image addressable by
          # android-emulator-runner; newer Wear images use extension/signed package IDs.
          api-level: 34
          target: android-wear
          arch: x86_64
          profile: wearos_small_round
          avd-name: healthmd-wear-ci
          pre-emulator-launch-script: >-
            config="$HOME/.android/avd/healthmd-wear-ci.avd/config.ini" && test -f "$config" &&
            { grep -q '^hw.rotaryInput' "$config" &&
            sed -i 's/^hw\.rotaryInput.*/hw.rotaryInput = yes/' "$config" ||
            printf 'hw.rotaryInput = yes\n' >> "$config"; }
          script: >-
            adb shell dumpsys input | grep -q 'Sources: ROTARY_ENCODER'
            && cd apps/android
            && ./gradlew :wear:assembleDebug :wear:bundleDebug --stacktrace
            && ./scripts/run-wear-emulator-smoke.sh wear/build/outputs/apk/debug/wear-debug.apk
            && ./scripts/validate-wear-artifact.sh wear/build/outputs/apk/debug/wear-debug.apk
            && ./scripts/test-wear-bundle-manifest-verifier.sh wear/build/outputs/bundle/debug/wear-debug.aab

  rust-kotlin-direct-interop:
    name: Rust/Kotlin direct interop
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0

      - name: Run live Rust/Kotlin protocol gate
        env:
          HEALTHMD_LIVE_DIRECT_PORT: '18647'
          HEALTHMD_LIVE_PAIRING_CODE: '12345678901234567890'
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/healthmd-rust-listener.log"
          timeout 600s cargo test \
            --manifest-path apps/cli/Cargo.toml \
            -p healthmd-client \
            --test android_live_listener \
            accepts_android_pairing_and_v2_negotiation \
            -- --ignored --nocapture >"$log" 2>&1 &
          listener_pid=$!
          cleanup() {
            kill "$listener_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=false
          for _ in $(seq 1 180); do
            if grep -q "ANDROID_LIVE_LISTENER_READY:${HEALTHMD_LIVE_DIRECT_PORT}" "$log"; then
              ready=true
              break
            fi
            if ! kill -0 "$listener_pid" 2>/dev/null; then
              cat "$log"
              wait "$listener_pid"
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat "$log"
            echo "Rust live listener did not become ready" >&2
            exit 1
          fi
          (
            cd apps/android
            ./gradlew :direct-protocol:test \
              --tests com.healthmd.direct.protocol.LiveCliInteropTest \
              --stacktrace
          )
          wait "$listener_pid"
          trap - EXIT
          cat "$log"

  gate:
    name: Android CI
    if: ${{ always() }}
    needs: [test, wear-emulator-smoke, rust-kotlin-direct-interop]
    runs-on: ubuntu-24.04
    steps:
      - name: Require Android checks
        env:
          TEST_RESULT: ${{ needs.test.result }}
          INTEROP_RESULT: ${{ needs.rust-kotlin-direct-interop.result }}
          WEAR_RESULT: ${{ needs.wear-emulator-smoke.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$INTEROP_RESULT" = success
          test "$WEAR_RESULT" = success
