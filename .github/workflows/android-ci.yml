# Temporary diagnostic branch only. This is not PR qualification.
name: Android native Save diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-save-diagnosis-${{ github.ref }}
  cancel-in-progress: false
jobs:
  instrumentation:
    name: Focused native Save reproduction
    runs-on: ubuntu-24.04
    # Diagnostic only: repeat one unchanged native journey across its 10 displays.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Set up pinned Rust Android toolchain
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal
          rustup target add --toolchain 1.88.0 \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android \
            i686-linux-android
          rustup run 1.88.0 cargo install cargo-ndk --version 4.1.2 --locked

      - name: Install pinned Android NDK
        shell: bash
        run: |
          set -euo pipefail
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$android_sdk"
          sdkmanager "ndk;27.1.12297006"
          echo "ANDROID_NDK_HOME=$android_sdk/ndk/27.1.12297006" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$android_sdk/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Prepare source-built Rust core before the emulator boots
        run: ./gradlew --no-daemon :healthmd-core:prepareRustDebug :app:assemblePlayDebug :app:assemblePlayDebugAndroidTest --stacktrace

      - name: Enable KVM access
        run: sudo chmod 666 /dev/kvm

      - name: Repeat the unchanged native Save journey
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          script: |
            adb -s emulator-5554 shell input keyevent KEYCODE_WAKEUP
            adb -s emulator-5554 shell wm dismiss-keyguard
            # The short-window editor matrix exercises the real software keyboard. Hosted
            # API 35 headless AVDs can leave that IME suppressed, so make the software-IME
            # contract explicit and prove a default method is ready before instrumentation.
            adb -s emulator-5554 shell settings put secure show_ime_with_hard_keyboard 1
            test "$(adb -s emulator-5554 shell settings get secure show_ime_with_hard_keyboard | tr -d '\r')" = 1
            for attempt in $(seq 1 30); do default_ime=$(adb -s emulator-5554 shell settings get secure default_input_method | tr -d '\r'); if [ -n "$default_ime" ] && [ "$default_ime" != null ] && adb -s emulator-5554 shell ime list -s | tr -d '\r' | grep -Fx "$default_ime"; then exit 0; fi; sleep 1; done; exit 1
            # Native keyboard and Back tests require a fully unlocked emulator window.
            # Make that fixture explicit on this owned AVD.
            adb -s emulator-5554 shell input keyevent KEYCODE_WAKEUP
            adb -s emulator-5554 shell locksettings set-disabled true
            test "$(adb -s emulator-5554 shell locksettings get-disabled | tr -d '\r')" = true
            adb -s emulator-5554 shell wm dismiss-keyguard
            adb -s emulator-5554 install apps/android/app/build/outputs/apk/play/debug/app-play-debug.apk
            adb -s emulator-5554 install apps/android/app/build/outputs/apk/androidTest/play/debug/app-play-debug-androidTest.apk
            python3 .github/scripts/reproduce-native-save.py

      - name: Retain instrumentation reports and per-test results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-save-reproduction-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: apps/android/build/native-save-repro/**
