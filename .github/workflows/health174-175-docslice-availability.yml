name: Health174175 doc-slice availability qualification
on:
  push:
    branches: [prep/qualification/health174-175-docslice-availability-20261007]
permissions:
  contents: read
jobs:
  documentation-slice:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Sealed baseline-negative then candidate12 documentation cases
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import base64,hashlib,json,os,stat,time,types
          from pathlib import Path
          assert os.environ.get('GITHUB_ACTIONS')=='true'and os.environ.get('RUNNER_OS')=='Linux'and os.environ.get('RUNNER_ENVIRONMENT')=='github-hosted'
          assert os.environ.get('GITHUB_EVENT_NAME')=='push'and os.environ.get('GITHUB_RUN_ATTEMPT')=='1'
          assert os.environ.get('GITHUB_REF')=='refs/heads/prep/qualification/health174-175-docslice-availability-20261007'
          os.umask(0o077)
          root=Path(os.environ['RUNNER_TEMP'])/('health174175-docslice-owned-'+os.environ['GITHUB_RUN_ID']);assert root.is_absolute()and not root.exists()and not root.is_symlink()
          root.mkdir(mode=0o700);assert root.resolve(strict=True)==root
          for leaf in ['sealed','home','tmp','logs']:
           (root/leaf).mkdir(mode=0o700)
          payload=base64.b64decode('',validate=True)
          assert len(payload)==58614 and hashlib.sha256(payload).hexdigest()=='5db1ee5cf84d68a3ceb2800983621f0ebda6c5d6db6f9dc3b3f2c0ed5764fa48'
          for record in [{'name': 'runner.py', 'offset': 0, 'bytes': 7855, 'sha256': '36744856e6b2965ced89451ef15f72dcd39d3ca934dc32efb678830803889f3a'}, {'name': 'controller.py', 'offset': 7855, 'bytes': 10316, 'sha256': 'af25ebe3a1562ab3bf92f0d4fdeb43ed4b7de868404b9f21576936e1c873b665'}, {'name': 'inputs.json', 'offset': 18171, 'bytes': 40443, 'sha256': '5679856e933efe6cc67dc9e0c1166e33b4ea1eae386eb11da26828b06edbb09a'}]:
           raw=payload[record['offset']:record['offset']+record['bytes']];assert len(raw)==record['bytes']and hashlib.sha256(raw).hexdigest()==record['sha256']
           path=root/'sealed'/record['name']
           with path.open('xb')as output:output.write(raw)
           st=path.lstat();assert stat.S_ISREG(st.st_mode)and st.st_uid==os.getuid()and st.st_nlink==1 and stat.S_IMODE(st.st_mode)==0o600
          raw=(root/'sealed'/'runner.py').read_bytes();assert hashlib.sha256(raw).hexdigest()=='36744856e6b2965ced89451ef15f72dcd39d3ca934dc32efb678830803889f3a'
          runner=types.ModuleType('doc_slice_outer');exec(compile(raw,str(root/'sealed'/'runner.py'),'exec'),runner.__dict__)
          keep=['GITHUB_ACTIONS','RUNNER_OS','RUNNER_ENVIRONMENT','GITHUB_EVENT_NAME','GITHUB_RUN_ATTEMPT','GITHUB_REF']
          env={key:os.environ[key]for key in keep};env.update({'PATH':'/usr/bin:/bin','HOME':str(root/'home'),'TMPDIR':str(root/'tmp'),'LANG':'C','LC_ALL':'C','TZ':'UTC','GIT_ALLOW_PROTOCOL':''})
          def sink(chunk):
           import sys
           sys.stdout.buffer.write(chunk);sys.stdout.buffer.flush()
          try:
           receipt=runner.run_owned(['/usr/bin/python3','-c',"import hashlib,json,os,sys,time,types\nfrom pathlib import Path\nroot=Path(sys.argv[1]);sealed=root/'sealed'\ndef load(name,filename,sha):\n path=sealed/filename;raw=path.read_bytes();assert hashlib.sha256(raw).hexdigest()==sha\n module=types.ModuleType(name);exec(compile(raw,str(path),'exec'),module.__dict__);return module\nrunner=load('doc_slice_runner','runner.py','36744856e6b2965ced89451ef15f72dcd39d3ca934dc32efb678830803889f3a')\ncontroller=load('doc_slice_controller','controller.py','af25ebe3a1562ab3bf92f0d4fdeb43ed4b7de868404b9f21576936e1c873b665')\nraw=(sealed/'inputs.json').read_bytes();assert hashlib.sha256(raw).hexdigest()=='5679856e933efe6cc67dc9e0c1166e33b4ea1eae386eb11da26828b06edbb09a'\ncontroller.main(run_owned=runner.run_owned,run_failure=runner.RunFailure,owned_root=root,packed=json.loads(raw),deadline=time.monotonic()+480)\n",str(root)],cwd=root,env=env,timeout=500,output_path=root/'logs'/'outer.log',output_cap=131072,sink=sink)
          except runner.RunFailure as error:
           print(json.dumps({'kind':'outer-stop','receipt':error.receipt},sort_keys=True),flush=True);raise
          print(json.dumps({'kind':'outer-returned-zero','receipt':receipt},sort_keys=True),flush=True)
          PY
