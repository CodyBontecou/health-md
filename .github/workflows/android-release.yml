name: Android Release

on:
  push:
    tags:
      - 'android/v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing android/v* tag to rebuild/publish after a workflow-only fix'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: android-google-play-mutation
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve exact release identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      release_sha: ${{ steps.identity.outputs.release_sha }}
    steps:
      - name: Check out source for identity resolution
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve and validate the immutable release tag
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.release_tag || '' }}" ]]; then
            [[ "${{ github.event_name }}" == workflow_dispatch ]] || {
              echo '::error::release_tag is valid only for manual recovery'; exit 1;
            }
            tag="${{ inputs.release_tag }}"
            [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" == android/recovery/* ]] || {
              echo '::error::workflow-only recovery must run from an android/recovery/* tag'; exit 1;
            }
            git fetch --force --no-tags origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
            [[ "$(git cat-file -t "$GITHUB_REF_NAME")" == tag ]] || {
              echo '::error::workflow-only recovery ref must be an annotated tag'; exit 1;
            }
            [[ "$(git rev-parse "$GITHUB_REF_NAME^{commit}")" == "$GITHUB_SHA" ]] || {
              echo '::error::workflow-only recovery tag does not peel to the workflow SHA'; exit 1;
            }
          else
            [[ "${{ github.ref_type }}" == tag ]] || {
              echo '::error::push trigger must be an android/v* tag'; exit 1;
            }
            tag="${{ github.ref_name }}"
          fi
          [[ "$tag" == android/v* ]] || { echo "::error::invalid Android release tag: $tag"; exit 1; }
          git fetch --force --no-tags origin "+refs/tags/${tag}:refs/tags/${tag}"
          [[ "$(git cat-file -t "$tag")" == tag ]] || {
            echo "::error::$tag is not an annotated tag"; exit 1;
          }
          sha="$(git rev-parse "${tag}^{commit}")"
          git fetch --force origin '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor "$sha" refs/remotes/origin/main || {
            echo "::error::$tag does not point to a main-reachable commit"; exit 1;
          }
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || {
            echo '::error::workflow revision is not main-reachable'; exit 1;
          }
          {
            echo "tag=$tag"
            echo "release_sha=$sha"
          } >> "$GITHUB_OUTPUT"

  qualify:
    name: Qualify exact Android release SHA
    needs: resolve
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/android-ci.yml
    with:
      release_sha: ${{ needs.resolve.outputs.release_sha }}

  publish-internal:
    needs: [resolve, qualify]
    name: Publish phone internal release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: google-play
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Checkout release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout trusted release tooling revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: .release-tooling
          persist-credentials: false
          sparse-checkout: |
            apps/android/scripts/google-play-phone-policy.sh
            apps/android/scripts/upload-google-play-phone-release.sh
          sparse-checkout-cone-mode: false

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install pinned Google Play metadata validator
        shell: bash
        run: |
          set -euo pipefail
          download="$RUNNER_TEMP/gplay-download"
          curl -fsSL https://github.com/tamtom/play-console-cli/releases/download/v0.8.0/gplay-linux-amd64 -o "$download"
          echo 'ea9d812878dcc61faa0401a306f3f648ab6779d87358e07afb8590e9c96a313a  '"$download" \
            | sha256sum --check --strict
          install -m 0755 "$download" "$RUNNER_TEMP/gplay"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Validate phone listing metadata
        run: ./scripts/validate-play-listing.sh

      - name: Set up pinned Rust Android toolchain
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal
          rustup target add --toolchain 1.88.0 \
            aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          rustup run 1.88.0 cargo install cargo-ndk --version 4.1.2 --locked

      - name: Install pinned Android NDK
        shell: bash
        run: |
          set -euo pipefail
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$android_sdk"
          sdkmanager 'ndk;27.1.12297006'
          echo "ANDROID_NDK_HOME=$android_sdk/ndk/27.1.12297006" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$android_sdk/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: true

      - name: Validate wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          min-wrapper-count: 1

      - name: Validate tag, phone-only scope, and committed version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_SHA: ${{ needs.resolve.outputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          version="${RELEASE_TAG#android/v}"
          version_name="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          version_code="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          git fetch --force origin '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor "$RELEASE_SHA" refs/remotes/origin/main
          test "$version_name" = "$version"
          [[ "$version_code" =~ ^[1-9][0-9]*$ ]]
          (( version_code < 1000000 ))
          jq -e --arg version "$version" --argjson code "$version_code" '
            .schemaVersion == 1 and .releaseVersionName == $version and
            .googlePlay.phone.status == "release_candidate" and
            .googlePlay.phone.versionCode == $code and
            .googlePlay.phone.testingTrack == "internal" and
            .googlePlay.wear.status == "deferred" and
            .googlePlay.wear.published == false and
            .googlePlay.wear.runtimeAdvertisedByPhone == false
          ' release-scope.json >/dev/null
          {
            echo "release_sha=$RELEASE_SHA"
            echo "version=$version"
            echo "version_code=$version_code"
          } >> "$GITHUB_OUTPUT"

      - name: Configure ephemeral signing credentials
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            test -n "${!name:-}"
          done
          signing_key="$RUNNER_TEMP/health-md-release.jks"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$signing_key"
          chmod 600 "$signing_key"
          {
            printf 'RELEASE_STORE_FILE=%s\n' "$signing_key"
            printf 'RELEASE_STORE_PASSWORD=%s\n' "$RELEASE_STORE_PASSWORD"
            printf 'RELEASE_KEY_ALIAS=%s\n' "$RELEASE_KEY_ALIAS"
            printf 'RELEASE_KEY_PASSWORD=%s\n' "$RELEASE_KEY_PASSWORD"
          } > local.properties
          chmod 600 local.properties

      - name: Verify bindings and prepare source-built Rust core
        run: >-
          ./gradlew --no-daemon
          :healthmd-core:checkHealthMdCoreKotlinBindings
          :healthmd-core:prepareRustRelease
          --stacktrace

      - name: Build signed phone app bundle
        env:
          CAMPAIGN_ATTRIBUTION_ENDPOINT_URL: ${{ secrets.CAMPAIGN_ATTRIBUTION_ENDPOINT_URL }}
          CAMPAIGN_ATTRIBUTION_INGEST_TOKEN: ${{ secrets.CAMPAIGN_ATTRIBUTION_INGEST_TOKEN }}
        run: ./gradlew --no-daemon :app:bundlePlayRelease --stacktrace

      - name: Inspect phone bundle ABIs, identity, and deferred-Wear boundary
        run: |
          ../../packages/healthmd-core-rust/scripts/inspect-android-aab.sh app/build/outputs/bundle/playRelease/app-play-release.aab
          ./scripts/verify-phone-only-artifact.sh app/build/outputs/bundle/playRelease/app-play-release.aab

      - name: Remove ephemeral signing credentials after inspection
        shell: bash
        run: rm -f local.properties "$RUNNER_TEMP/health-md-release.jks"

      - name: Retain signed phone bundle with native debug symbols
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: healthmd-android-phone-${{ steps.version.outputs.version }}-attempt-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: apps/android/app/build/outputs/bundle/playRelease/app-play-release.aab

      - name: Create immutable phone upload intent receipt
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_SHA: ${{ needs.resolve.outputs.release_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          aab=app/build/outputs/bundle/playRelease/app-play-release.aab
          upload_tool="$GITHUB_WORKSPACE/.release-tooling/apps/android/scripts/upload-google-play-phone-release.sh"
          test -f "$upload_tool"
          jq -n --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow '.github/workflows/android-release.yml' \
            --arg workflowSha "$WORKFLOW_SHA" --arg workflowRef "$WORKFLOW_REF" \
            --arg uploadToolSha256 "$(sha256sum "$upload_tool" | awk '{print $1}')" \
            --arg tag "$RELEASE_TAG" --arg sha "$RELEASE_SHA" \
            --arg peeled "$(git rev-parse "$RELEASE_TAG^{commit}")" --arg version "$VERSION" \
            --argjson runId "$GITHUB_RUN_ID" --argjson runAttempt "$GITHUB_RUN_ATTEMPT" \
            --argjson code "$VERSION_CODE" --arg aab "$(sha256sum "$aab" | awk '{print $1}')" \
            --arg preparedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{
              schemaVersion:1,repository:$repository,workflow:$workflow,
              workflowSha:$workflowSha,workflowRef:$workflowRef,uploadToolSha256:$uploadToolSha256,
              runId:$runId,runAttempt:$runAttempt,tag:$tag,headSha:$sha,tagPeeledSha:$peeled,
              versionName:$version,phoneVersionCode:$code,phoneTrack:"internal",
              releaseStatus:"completed",phoneAabSha256:$aab,wearIncluded:false,
              uploadPrepared:true,preparedAtUtc:$preparedAt
            }' > "$RUNNER_TEMP/phone-upload-intent.json"

      - name: Retain immutable phone upload intent receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: healthmd-android-phone-upload-${{ steps.version.outputs.version }}-${{ steps.version.outputs.release_sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/phone-upload-intent.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Authenticate to Google Play with protected Workload Identity
        id: play-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GOOGLE_PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false

      - name: Upload phone bundle to Internal Testing
        env:
          CONFIRM_PLAY_PHONE_UPLOAD: com.healthmd.android:internal:${{ steps.version.outputs.version_code }}
          PHONE_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          PHONE_PLAY_TRACK: internal
          PLAY_RELEASE_STATUS: completed
          PLAY_UPLOAD_RECEIPT_PATH: ${{ runner.temp }}/phone-upload-receipt.json
          PLAY_ACCESS_TOKEN: ${{ steps.play-auth.outputs.access_token }}
          PLAY_RELEASE_ROOT: ${{ github.workspace }}/apps/android
        run: >-
          "$GITHUB_WORKSPACE/.release-tooling/apps/android/scripts/upload-google-play-phone-release.sh"

      - name: Retain verified phone upload receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: healthmd-android-phone-upload-result-${{ steps.version.outputs.version }}-${{ steps.version.outputs.release_sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/phone-upload-receipt.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Remove ephemeral credentials
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f local.properties "$RUNNER_TEMP/health-md-release.jks"

      - name: Release summary
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          {
            echo '## Android phone internal release'
            echo
            echo "- Version: $VERSION"
            echo "- Version code: $VERSION_CODE"
            echo '- Track: internal (phone)'
            echo '- Wear OS artifact: deferred and not uploaded'
            echo '- Binary destination: Google Play only'
          } >> "$GITHUB_STEP_SUMMARY"
