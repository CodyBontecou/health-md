name: Website CI

on:
  # Pull requests are path-filtered by the changes job so the stable final gate
  # still reports a conclusive required context on every PR without building the
  # site for unrelated changes. Scheduled and dispatched runs always validate.
  pull_request:
  push:
    branches: [main]
    paths:
      - '.agents/skills/**'
      - 'apps/website/**'
      - 'apps/apple/docs/reference/**'
      - 'apps/apple/scripts/generated-*-docs.sh'
      - 'packages/contracts/**'
      - 'packages/healthmd-core-rust/**'
      - '.github/workflows/website-ci.yml'
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [healthmd-reference-updated]

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect website-affecting changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - name: Check out source for the local composite action
        uses: actions/checkout@v4
      - name: Detect whether Website CI must run
        id: detect
        uses: ./.github/actions/component-changes
        with:
          component: Website CI
          paths: |
            .agents/skills/**
            apps/website/**
            apps/apple/docs/reference/**
            apps/apple/scripts/generated-*-docs.sh
            packages/contracts/**
            packages/healthmd-core-rust/**
            .github/workflows/website-ci.yml

  validate:
    needs: changes
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/website
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve external source revisions
        id: external-sources
        run: |
          revision=$(node -p "require('./external-sources.json').obsidian_plugin.revision")
          echo "obsidian_revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned Obsidian plugin source
        uses: actions/checkout@v4
        with:
          repository: CodyBontecou/health-md-visualizations
          ref: ${{ steps.external-sources.outputs.obsidian_revision }}
          path: .external/health-md-visualizations

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/website/package-lock.json
            apps/website/docs-src/package-lock.json
            .external/health-md-visualizations/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix docs-src ci
          npm --prefix "$GITHUB_WORKSPACE/.external/health-md-visualizations" ci

      - name: Test pinned Obsidian plugin source
        # Kept unconditional: the visualization bundle resolves plugin imports such as
        # "leaflet" from the plugin checkout's own node_modules, so its install cannot
        # be skipped behind a revision marker without breaking visualizations:sync.
        run: |
          npm --prefix "$GITHUB_WORKSPACE/.external/health-md-visualizations" test
          npm --prefix "$GITHUB_WORKSPACE/.external/health-md-visualizations" run typecheck
          npm --prefix "$GITHUB_WORKSPACE/.external/health-md-visualizations" run build

      - name: Sync visualizations from external plugin source
        run: npm run visualizations:sync
        env:
          HEALTHMD_OBSIDIAN_PLUGIN_REPO: ${{ github.workspace }}/.external/health-md-visualizations

      - name: Check generated visualization assets are committed
        run: |
          generated_status="$(git status --porcelain --untracked-files=all -- \
            assets/healthmd-plugin-visualizations.js \
            assets/healthmd-plugin-visualizations.js.map \
            assets/healthmd-plugin-visualizations.css \
            assets/visualizations-catalog.json \
            assets/visualizations-data/health-sample.json \
            assets/visualizations-data/health-rollups.json)"
          if [ -n "$generated_status" ]; then
            printf '%s\n' "$generated_status"
            echo "Generated visualization assets are stale or untracked. Run npm run visualizations:sync and commit the outputs."
            exit 1
          fi

      - name: Check authoritative reference snapshot
        run: npm run reference:check -- --source "$GITHUB_WORKSPACE/apps/apple"

      - name: Check website localization contracts
        run: npm run i18n:check

      - name: Build docs and validate links
        run: npm run docs:check

      - name: Run website tests
        run: npm test
        env:
          HEALTHMD_OBSIDIAN_PLUGIN_REPO: ${{ github.workspace }}/.external/health-md-visualizations

      - name: Build complete website
        run: npm run build

  gate:
    name: Website CI
    if: ${{ always() }}
    needs: [changes, validate]
    runs-on: ubuntu-latest
    steps:
      - name: Require website checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHANGES_RUN: ${{ needs.changes.outputs.run }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          set -e
          test "$CHANGES_RESULT" = success
          if [ "$CHANGES_RUN" != "true" ]; then
            echo "No website-affecting changes in this pull request; Website CI skipped."
            exit 0
          fi
          test "$VALIDATE_RESULT" = success
