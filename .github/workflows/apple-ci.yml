name: Apple CI

on:
  push:
    branches:
      - main
      - testing
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_sha:
        description: Exact commit to qualify
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-ios:
    # Notelet requires Swift tools 6.3. The macos-26 hosted image includes
    # Xcode 26.6, so PR validation does not depend on a self-hosted runner.
    runs-on: macos-26
    timeout-minutes: 75
    defaults:
      run:
        working-directory: apps/apple

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - name: Verify build-number format
        # Guard against the v1.8.0/1.8.1 regression. Two checks:
        #  (a) CURRENT_PROJECT_VERSION in pbxproj must be a 12-digit YYYYMMDDHHMM
        #      timestamp.
        #  (b) Info.plist CFBundleVersion must be the $(CURRENT_PROJECT_VERSION)
        #      macro, not a hardcoded literal — otherwise the literal silently
        #      overrides any pbxproj bump (root cause of the v1.8.0/v1.8.1
        #      shipped builds).
        run: |
          set -e
          bad=$(awk '/CURRENT_PROJECT_VERSION =/ { gsub(/[ \t;]/, "", $3); print $3 }' \
                  HealthMd.xcodeproj/project.pbxproj | sort -u | grep -vE '^[0-9]{12}$' || true)
          if [ -n "$bad" ]; then
            echo "::error::CURRENT_PROJECT_VERSION must be a 12-digit YYYYMMDDHHMM timestamp."
            echo "Offending values:"
            echo "$bad"
            echo
            echo "Why: a small integer (e.g. \"1\", \"2\") would be numerically less than the"
            echo "freemium build threshold and silently auto-unlock the paywall for all new"
            echo "installs (the v1.8.0/1.8.1 bug)."
            exit 1
          fi

          # Reject any Info.plist whose CFBundleVersion is a literal value
          # rather than the $(CURRENT_PROJECT_VERSION) macro.
          # shellcheck disable=SC2016
          while IFS= read -r plist; do
            value=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$plist" 2>/dev/null || true)
            if [ -n "$value" ] && [ "$value" != '$(CURRENT_PROJECT_VERSION)' ]; then
              echo "::error::$plist hardcodes CFBundleVersion = \"$value\". Use \$(CURRENT_PROJECT_VERSION) instead."
              echo "Why: a literal value silently overrides pbxproj bumps and asc xcode version edit."
              exit 1
            fi
            mvalue=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$plist" 2>/dev/null || true)
            if [ -n "$mvalue" ] && [ "$mvalue" != '$(MARKETING_VERSION)' ]; then
              echo "::error::$plist hardcodes CFBundleShortVersionString = \"$mvalue\". Use \$(MARKETING_VERSION) instead."
              exit 1
            fi
          done < <(find HealthMd -name 'Info.plist' -not -path '*/build/*')

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Prepare and validate shared Rust core for Apple
        run: make prepare-healthmd-core-rust

      - name: Select iOS Simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail

          IOS_DEVICE_LINE=$(
            xcrun simctl list devices available iOS \
              | grep -E "iPhone (17 Pro|17|16 Pro|16|15 Pro|15)" \
              | head -n 1 \
              || true
          )

          if [[ -z "${IOS_DEVICE_LINE}" ]]; then
            IOS_DEVICE_LINE=$(
              xcrun simctl list devices available iOS \
                | grep -E "iPhone" \
                | head -n 1 \
                || true
            )
          fi

          if [[ -z "${IOS_DEVICE_LINE}" ]]; then
            echo "::error::No available iOS Simulator device found"
            exit 1
          fi

          IOS_DEVICE=$(echo "${IOS_DEVICE_LINE}" | sed -E 's/^[[:space:]]*([^()]*) .*/\1/' | xargs)
          IOS_UDID=$(echo "${IOS_DEVICE_LINE}" | sed -nE 's/.*\(([0-9A-Fa-f-]+)\).*/\1/p')
          SIM_ARCH=$(uname -m)
          [[ "${SIM_ARCH}" == "aarch64" ]] && SIM_ARCH="arm64"

          IOS_DESTINATION="platform=iOS Simulator,name=${IOS_DEVICE},arch=${SIM_ARCH}"
          if [[ -n "${IOS_UDID}" ]]; then
            IOS_DESTINATION="platform=iOS Simulator,id=${IOS_UDID},arch=${SIM_ARCH}"
          fi

          echo "Using simulator: ${IOS_DEVICE} (${IOS_UDID:-no-udid}), arch=${SIM_ARCH}"
          echo "ios_destination=${IOS_DESTINATION}" >> "$GITHUB_OUTPUT"

      - name: Run iOS unit tests
        run: |
          set -euo pipefail
          mkdir -p build/logs
          make test-ios IOS_SIM="${{ steps.simulator.outputs.ios_destination }}" 2>&1 | tee build/logs/build-ios.log

      - name: Report iOS test result
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          result=build/test-results/HealthMd-iOS.xcresult
          if [[ ! -d "$result" ]]; then
            echo "::error::xcodebuild did not create the iOS xcresult bundle"
            exit 1
          fi
          summary=$(xcrun xcresulttool get test-results summary --path "$result")
          printf '%s\n' "$summary" | tee build/logs/ios-test-summary.json
          printf "## iOS test result\n\n\`\`\`json\n%s\n\`\`\`\n" "$summary" >> "$GITHUB_STEP_SUMMARY"
          RESULT_SUMMARY="$summary" python3 - <<'PY'
          import json
          import os

          summary = json.loads(os.environ["RESULT_SUMMARY"])
          result = summary.get("result", "Unknown")
          failures = summary.get("failedTests", 0)
          details = "; ".join(
              failure.get("failureText", failure.get("testName", "unknown test failure"))
              for failure in summary.get("testFailures", [])[:5]
          )
          if result != "Passed" or failures:
              print(f"::error::xcresult reports {result} with {failures} failed tests: {details}")
              raise SystemExit(1)
          else:
              print(f"xcresult reports Passed: {summary.get('passedTests', 0)} passed, "
                    f"{summary.get('skippedTests', 0)} skipped")
          PY

      - name: Check warnings (iOS)
        if: ${{ !cancelled() }}
        run: scripts/check-warnings.sh build/logs/xcodebuild-ios-raw.log

      - name: Check TDD evidence
        if: ${{ !cancelled() }}
        run: scripts/check-tdd-evidence.sh

      - name: Upload iOS artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-diagnostics
          path: |
            apps/apple/build/logs/build-ios.log
            apps/apple/build/logs/xcodebuild-ios-raw.log
            apps/apple/build/logs/ios-test-summary.json
            apps/apple/build/test-results/HealthMd-iOS.xcresult
          retention-days: 14

  test-macos:
    # Keep the macOS suite on the same hosted Xcode 26 toolchain as the iOS job.
    runs-on: macos-26
    timeout-minutes: 75
    defaults:
      run:
        working-directory: apps/apple

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Prepare and validate shared Rust core for Apple
        run: make prepare-healthmd-core-rust

      - name: Validate macOS localizations
        run: make check-macos-localizations

      - name: Run macOS unit tests with coverage
        timeout-minutes: 45
        run: |
          set -euo pipefail
          mkdir -p build/logs
          make coverage 2>&1 | tee build/logs/build-macos.log

      - name: Verify generated export documentation
        if: ${{ success() }}
        run: make check-export-docs

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          if [ -d build/coverage/HealthMd.xcresult ]; then
            echo "## Code Coverage" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            xcrun xccov view --report --only-targets build/coverage/HealthMd.xcresult >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "Coverage data unavailable" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check coverage threshold
        if: ${{ !cancelled() }}
        run: scripts/check-coverage.sh build/coverage/HealthMd.xcresult

      - name: Check warnings (macOS)
        if: ${{ !cancelled() }}
        run: scripts/check-warnings.sh build/logs/build-macos.log

      - name: Upload macOS artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            apps/apple/build/coverage/HealthMd.xcresult
            apps/apple/build/logs/build-macos.log
          retention-days: 14

  test-ios-ui:
    name: iOS UI regressions
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/apple

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Prepare and validate shared Rust core for Apple
        run: make prepare-healthmd-core-rust

      - name: Select iOS Simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail

          IOS_DEVICE_LINE=$(
            xcrun simctl list devices available iOS \
              | grep -E "iPhone (17 Pro|17|16 Pro|16|15 Pro|15)" \
              | head -n 1 \
              || true
          )
          if [[ -z "${IOS_DEVICE_LINE}" ]]; then
            IOS_DEVICE_LINE=$(
              xcrun simctl list devices available iOS \
                | grep -E "iPhone" \
                | head -n 1 \
                || true
            )
          fi
          if [[ -z "${IOS_DEVICE_LINE}" ]]; then
            echo "::error::No available iOS Simulator device found"
            exit 1
          fi

          IOS_DEVICE=$(echo "${IOS_DEVICE_LINE}" | sed -E 's/^[[:space:]]*([^()]*) .*/\1/' | xargs)
          IOS_UDID=$(echo "${IOS_DEVICE_LINE}" | sed -nE 's/.*\(([0-9A-Fa-f-]+)\).*/\1/p')
          SIM_ARCH=$(uname -m)
          [[ "${SIM_ARCH}" == "aarch64" ]] && SIM_ARCH="arm64"

          IOS_DESTINATION="platform=iOS Simulator,name=${IOS_DEVICE},arch=${SIM_ARCH}"
          if [[ -n "${IOS_UDID}" ]]; then
            IOS_DESTINATION="platform=iOS Simulator,id=${IOS_UDID},arch=${SIM_ARCH}"
          fi

          echo "Using simulator: ${IOS_DEVICE} (${IOS_UDID:-no-udid}), arch=${SIM_ARCH}"
          echo "ios_destination=${IOS_DESTINATION}" >> "$GITHUB_OUTPUT"

      - name: Run UI smoke tests (iOS)
        timeout-minutes: 35
        run: |
          set -euo pipefail
          mkdir -p build/logs
          xcodebuild test \
            -project HealthMd.xcodeproj \
            -scheme HealthMd-UITests-iOS \
            -destination '${{ steps.simulator.outputs.ios_destination }}' \
            -configuration Debug-iOS \
            -only-testing:HealthMdUITests/HealthMdUILaunchTests/testAppLaunches \
            -only-testing:HealthMdUITests/ExportJourneyUITests/testFirstRunExportJourney_showsExportButton_andCompletesExport \
            -only-testing:HealthMdUITests/ExportJourneyUITests/testDateRangePresets_visibleAndCustomPickersHiddenByDefault \
            -only-testing:HealthMdUITests/ExportJourneyUITests/testDateRangePresets_customRevealsStartAndEndPickers \
            -only-testing:HealthMdUITests/OnboardingJourneyUITests/testReleaseNotesStillAppearForReturningUsers \
            -only-testing:HealthMdUITests/PaywallJourneyUITests/testPaywallShown_whenQuotaExhausted \
            -only-testing:HealthMdUITests/ScheduleSyncJourneyUITests/testSyncView_showsDisconnectedState \
            -only-testing:HealthMdUITests/ConfigurationProtectionJourneyUITests/testBlockedChangeToastNavigatesToProtectionToggle \
            -only-testing:HealthMdUITests/ConfigurationProtectionJourneyUITests/testTurningProtectionOffRestoresConfigurationControls \
            -only-testing:HealthMdUITests/ExportProfilesJourneyUITests/testQA_MigrationShowsDefaultProfileInSettings \
            -only-testing:HealthMdUITests/ExportProfilesJourneyUITests/testQA_ManagementDuplicateRenameDeleteAndLastProfileGuard \
            -only-testing:HealthMdUITests/ExportProfilesJourneyUITests/testQA_ProfileSchedulesToggleCadenceAndUsageFooter \
            -only-testing:HealthMdUITests/ExportProfilesJourneyUITests/testQA_ManageProfilesViewDetailCopyIDActivateAndRename \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee build/logs/build-ios-ui.log \
            | grep -E "Test Case|error:|PASSED|FAILED|Executed"

      - name: Run App Review export regression (iPad)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail

          IPAD_LINE=$(
            xcrun simctl list devices available iOS \
              | grep -E "iPad (Air|Pro)" \
              | head -n 1 \
              || true
          )

          if [[ -n "${IPAD_LINE}" ]]; then
            IPAD_UDID=$(echo "${IPAD_LINE}" | sed -nE 's/.*\(([0-9A-Fa-f-]+)\).*/\1/p')
          else
            IPAD_DEVICE_TYPE=$(
              xcrun simctl list devicetypes \
                | grep -E "iPad Air 11-inch|iPad Pro 11-inch|iPad Air" \
                | head -n 1 \
                | sed -nE 's/.*\((com\.apple\.CoreSimulator\.SimDeviceType\.[^)]+)\).*/\1/p'
            )
            IOS_RUNTIME=$(
              xcrun simctl list runtimes available \
                | grep -E "^iOS " \
                | tail -n 1 \
                | sed -nE 's/.* - (com\.apple\.CoreSimulator\.SimRuntime\.iOS-[^)]+).*/\1/p'
            )
            if [[ -z "${IPAD_DEVICE_TYPE}" || -z "${IOS_RUNTIME}" ]]; then
              echo "::error::No iPad device type or iOS runtime is available"
              exit 1
            fi
            IPAD_UDID=$(xcrun simctl create "HealthMd CI iPad" "${IPAD_DEVICE_TYPE}" "${IOS_RUNTIME}")
          fi

          if [[ -z "${IPAD_UDID}" ]]; then
            echo "::error::Could not resolve an iPad Simulator UDID"
            exit 1
          fi

          echo "Running App Review regression on iPad ${IPAD_UDID}"
          xcodebuild test \
            -project HealthMd.xcodeproj \
            -scheme HealthMd-UITests-iOS \
            -destination "platform=iOS Simulator,id=${IPAD_UDID}" \
            -configuration Debug-iOS \
            -only-testing:HealthMdUITests/ExportJourneyUITests/testNoDataExport_showsGuidanceInsteadOfGenericError \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee -a build/logs/build-ios-ui.log \
            | grep -E "Test Case|error:|PASSED|FAILED|Executed"

      - name: Check warnings (iOS UI)
        if: ${{ !cancelled() }}
        run: scripts/check-warnings.sh build/logs/build-ios-ui.log

      - name: Upload iOS UI artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-build-logs
          path: apps/apple/build/logs/build-ios-ui.log
          retention-days: 14

  connectivity-package:
    name: HealthMdConnectivity package
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Test standalone direct protocol package
        run: swift test --package-path apps/apple/Packages/HealthMdConnectivity

  gate:
    name: Apple CI
    if: ${{ always() }}
    needs: [test-ios, test-ios-ui, test-macos, connectivity-package]
    runs-on: ubuntu-24.04
    steps:
      - name: Require Apple checks
        env:
          IOS_RESULT: ${{ needs.test-ios.result }}
          IOS_UI_RESULT: ${{ needs.test-ios-ui.result }}
          MACOS_RESULT: ${{ needs.test-macos.result }}
          CONNECTIVITY_RESULT: ${{ needs.connectivity-package.result }}
        run: |
          test "$IOS_RESULT" = success
          test "$IOS_UI_RESULT" = success
          test "$MACOS_RESULT" = success
          test "$CONNECTIVITY_RESULT" = success
