name: PR189 native Resume SDK27 qualification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: pr189-resume-sdk27-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 17a08f0c7d2dec7af42dc726af2470377203a5a8
          path: candidate
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'
      - name: Verify pinned source and SDK27 native core
        working-directory: candidate/apps/apple
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 17a08f0c7d2dec7af42dc726af2470377203a5a8
          test "$(git rev-parse HEAD^{tree})" = c6084ed4409ada1ed5f368f8a58af69100020786
          git diff --exit-code
          mkdir -p build/logs/pr189-resume-sdk27
          {
            git rev-parse HEAD HEAD^{tree}
            xcodebuild -version
            xcrun swiftc --version
            uname -m
          } | tee build/logs/pr189-resume-sdk27/identity.txt
          bash scripts/qualify-history-authorization-sdk27.sh
          ../../packages/healthmd-core-rust/scripts/prepare-apple-xcframework.sh
          cp build/logs/history-sdk27-receipt.txt Packages/HealthMdCoreRust/Artifacts/.healthmd-core-sdk27.txt
          python3 scripts/compare-history-sdk27-receipts.py build/logs/history-sdk27-receipt.txt Packages/HealthMdCoreRust/Artifacts/.healthmd-core-sdk27.txt
          actual=$(../../packages/healthmd-core-rust/scripts/apple-source-digest.sh)
          test "$actual" = "$(cat Packages/HealthMdCoreRust/Artifacts/.healthmd-core-source.sha256)"
          ../../packages/healthmd-core-rust/scripts/validate-apple-xcframework.sh Packages/HealthMdCoreRust/Artifacts/HealthmdCore.xcframework
      - name: Compile and run owning Resume controls
        working-directory: candidate/apps/apple
        shell: bash
        run: |
          set -euo pipefail
          out=build/logs/pr189-resume-sdk27
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('HealthMdTests/Export/AgentBridgeExportPlanningTests.swift').read_text()
          names=re.findall(r'^\s*func (testNative\w*Resume\w*)\(',text,re.M)
          assert len(names)==len(set(names)) and len(names)>=30
          assert len([n for n in names if n.startswith('testNativeWireResume')])==7
          Path('build/logs/pr189-resume-sdk27/expected-cases.txt').write_text('\n'.join(names)+'\n')
          PY
          args=()
          while IFS= read -r name; do
            args+=("-only-testing:HealthMdTests/AgentBridgeExportPlanningTests/$name")
          done < "$out/expected-cases.txt"
          status=0
          xcodebuild test -project HealthMd.xcodeproj -scheme HealthMd-Tests-macOS \
            -derivedDataPath build/pr189-resume-derived \
            -destination "platform=macOS,arch=$(uname -m)" \
            -resultBundlePath build/pr189-resume.xcresult \
            -enableCodeCoverage YES "${args[@]}" \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee "$out/cases.log" || status=$?
          python3 - "$out/cases.log" "$status" "$out/expected-cases.txt" <<'PY'
          from pathlib import Path
          import json,re,sys
          expected=set(Path(sys.argv[3]).read_text().splitlines())
          cases=re.findall(r"Test Case '-\[HealthMdTests.AgentBridgeExportPlanningTests ([^\]]+)\]' (passed|failed|skipped) ",Path(sys.argv[1]).read_text())
          receipt={'native_exit':int(sys.argv[2]),'expected':sorted(expected),'observed':cases}
          Path(sys.argv[1]).with_name('receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          if len(cases)!=len(expected) or {n for n,_ in cases}!=expected or any(r!='passed' for _,r in cases):
              raise SystemExit('Incomplete or failing Resume qualification; no passing claim')
          if sys.argv[2]!='0': raise SystemExit('Native command failed')
          PY
          git diff --exit-code
          exit "$status"
      - name: Preserve minimal synthetic qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr189-native-resume-sdk27
          path: candidate/apps/apple/build/logs/
          retention-days: 3
          if-no-files-found: warn
