name: PR189 focused Stop diagnosis (not qualification)
on:
  workflow_dispatch:
    inputs:
      apply_fixture_candidate:
        description: Apply the reviewed test-only Stop phase correction
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: pr189-stop-diagnostic-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 964740c99b2c82a52d85a2912cb7efcd065736a1
          path: candidate
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'
      - uses: actions/download-artifact@v4
        with:
          name: apple-sdk27-shared-core
          path: candidate/apps/apple/Packages/HealthMdCoreRust/Artifacts
          run-id: 40492751907
          github-token: ${{ github.token }}
      - name: Verify exact candidate and prepared native core
        working-directory: candidate/apps/apple
        run: |
          test "$(git rev-parse HEAD)" = 964740c99b2c82a52d85a2912cb7efcd065736a1
          test "$(git rev-parse HEAD^{tree})" = 905f1b91b9a96e96e5e52b261e651a9273871387
          git diff --exit-code
          bash scripts/qualify-history-authorization-sdk27.sh
          python3 scripts/compare-history-sdk27-receipts.py build/logs/history-sdk27-receipt.txt Packages/HealthMdCoreRust/Artifacts/.healthmd-core-sdk27.txt
          actual=$(../../packages/healthmd-core-rust/scripts/apple-source-digest.sh)
          test "$actual" = "$(cat Packages/HealthMdCoreRust/Artifacts/.healthmd-core-source.sha256)"
          ../../packages/healthmd-core-rust/scripts/validate-apple-xcframework.sh Packages/HealthMdCoreRust/Artifacts/HealthmdCore.xcframework
      - name: Run selected Stop diagnostic cases
        env:
          APPLY_STOP_FIXTURE_CANDIDATE: ${{ inputs.apply_fixture_candidate && 'true' || 'false' }}
        run: bash .github/scripts/pr189-stop-focused.sh
      - name: Retain synthetic diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr189-sdk27-stop-diagnostics
          path: candidate/apps/apple/build/logs/
          retention-days: 3
          if-no-files-found: warn
