          test -s Packages/HealthMdCoreRust/Artifacts/.healthmd-core-source.sha256
          ../../packages/healthmd-core-rust/scripts/validate-apple-xcframework.sh \
            Packages/HealthMdCoreRust/Artifacts/HealthmdCore.xcframework

      - name: Validate macOS localizations
        run: make check-macos-localizations
      - name: Test native inventory and reference runner policy
        run: |
          python3 scripts/tests/test_native_test_shards.py
          python3 -m unittest discover -s scripts/tests -p 'test_reference_docs_runner.py'
      - name: Build macOS unit-test products
        timeout-minutes: 25
        run: |
          set -euo pipefail
          mkdir -p build/logs
          make build-macos-tests CORE_RUST_PREPARE=: MACOS_DERIVED_DATA_DIR=build/macos-qa-derived MACOS_CODE_COVERAGE=YES 2>&1 | tee build/logs/build-macos.log
      - name: Enumerate and retain complete qualified native products
        id: package
