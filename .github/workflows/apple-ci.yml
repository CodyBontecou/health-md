          (cd build/macos-qa && shasum -a 256 HealthMd-macOS.app.tar.gz > SHA256SUMS)

      - name: Upload tested macOS QA candidate
        if: ${{ success() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-tested-qa-candidate
          path: apps/apple/build/macos-qa/
          if-no-files-found: error
          retention-days: 3

      - name: Verify generated export documentation
        if: ${{ success() }}
        run: make check-export-docs-after-tests

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          if [ -d build/coverage/HealthMd.xcresult ]; then
            echo "## Code Coverage" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            xcrun xccov view --report --only-targets build/coverage/HealthMd.xcresult >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "Coverage data unavailable" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check coverage threshold
        if: ${{ !cancelled() }}
        run: scripts/check-coverage.sh build/coverage/HealthMd.xcresult

      - name: Check warnings (macOS)
        if: ${{ !cancelled() }}
        run: scripts/check-warnings.sh build/logs/build-macos.log

      - name: Collect bounded named Mac automation test receipt
        id: macos-automation-receipt
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          mkdir -p build/logs
          python3 -m unittest discover -s scripts/tests -p 'test_ci_automation_test_receipt.py' -v
          xcrun xcresulttool get test-results tests --path build/coverage/HealthMd.xcresult > build/logs/macos-test-tree.json
          python3 scripts/ci-automation-test-receipt.py build/logs/macos-test-tree.json build/logs/macos-automation-test-receipt.txt --head "$GITHUB_SHA" --platform macOS --diagnostics build/logs/macos-automation-test-diagnostics.txt

      - name: Upload bounded Mac automation test receipt
        if: ${{ !cancelled() && steps.macos-automation-receipt.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-automation-test-receipt
          path: apps/apple/build/logs/macos-automation-test-receipt.txt
          if-no-files-found: error
          retention-days: 14

      - name: Collect verified native-generated automation reference text
        if: ${{ !cancelled() }}
        run: |
          if [[ -d build/logs/generated-automation-reference ]]; then
            mkdir -p build/generated-automation-reference
            cp -R build/logs/generated-automation-reference/. build/generated-automation-reference/
          fi

      - name: Upload native-generated automation reference text
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-automation-reference-text
          path: apps/apple/build/generated-automation-reference
          if-no-files-found: warn
          retention-days: 1

      - name: Upload macOS artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            apps/apple/build/coverage/HealthMd.xcresult
            apps/apple/build/logs/build-macos.log
            apps/apple/build/logs/macos-test-tree.json
            apps/apple/build/logs/native-case-inventory.json
            apps/apple/build/logs/macos-automation-test-diagnostics.txt
          retention-days: 14

  prepare-ui-artifacts:
    name: Prepare qualified UI products once
    needs: [changes, prepare-shared-core]
    if: ${{ needs.changes.outputs.ios_ui == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 20
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}
    defaults:
      run:
        working-directory: apps/apple

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'

      - name: Restore prepared shared Rust core
        uses: actions/download-artifact@v4
        with:
          name: apple-sdk27-shared-core
          path: apps/apple/Packages/HealthMdCoreRust/Artifacts

      - name: Verify SDK27 consumer provenance (UI)
        run: |
          bash scripts/qualify-history-authorization-sdk27.sh
          python3 scripts/compare-history-sdk27-receipts.py build/logs/history-sdk27-receipt.txt Packages/HealthMdCoreRust/Artifacts/.healthmd-core-sdk27.txt

      - name: Validate prepared shared Rust core
        run: |
          test -f Packages/HealthMdCoreRust/Artifacts/HealthmdCore.xcframework/Info.plist
          test -s Packages/HealthMdCoreRust/Artifacts/.healthmd-core-source.sha256
          ../../packages/healthmd-core-rust/scripts/validate-apple-xcframework.sh \
            Packages/HealthMdCoreRust/Artifacts/HealthmdCore.xcframework

      - name: Test iOS simulator selection policy
        run: python3 scripts/tests/test_select_ios_simulator.py

      - name: Verify UI ownership controls on actual macOS
        timeout-minutes: 5
        run: |
          python3 --version
          command -v python3 bash ps
          bash --version
          python3 scripts/test-history-ui-pipeline-status.py
          python3 scripts/test-owned-ui-processes.py

      - name: Test UI build and execution contract
        run: |
          python3 scripts/tests/test_ios_ui_build_contract.py
          python3 scripts/tests/test_ios_ui_shards.py

      - name: Build UI test artifacts once
        id: ui_artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/logs build/test-results
          MD_UI_DERIVED_DATA=$(mktemp -d "$PWD/build/ios-ui-derived-data.XXXXXX")
          touch "$MD_UI_DERIVED_DATA/.healthmd-ui-build-start"
          python3 scripts/ui_test_document_fixture.py create \
            --source HealthMd/Info.plist --output "$MD_UI_DERIVED_DATA/ui-test-Info.plist"
          xcodebuild build-for-testing \
            -project HealthMd.xcodeproj \
            -scheme HealthMd-UITests-iOS \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug-iOS \
            -derivedDataPath "$MD_UI_DERIVED_DATA" \
            HEALTHMD_IOS_INFO_PLIST="$MD_UI_DERIVED_DATA/ui-test-Info.plist" \
            ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee build/logs/build-ios-ui-compile.log
          MD_UI_XCTESTRUN=$(python3 scripts/validate_ios_ui_xctestrun.py \
            --derived-data "$MD_UI_DERIVED_DATA" \
            --source-sha "$(git rev-parse HEAD)" \
            --receipt build/logs/ios-ui-build-receipt.json)
          MD_UI_APP=$(python3 -c 'import json; print(json.load(open("build/logs/ios-ui-build-receipt.json"))["products"][0]["path"])')
          {
            echo "xctestrun=$MD_UI_XCTESTRUN"
            echo "app=$MD_UI_APP"
            echo "derived_data=$MD_UI_DERIVED_DATA"
          } >> "$GITHUB_OUTPUT"

      - name: Package qualified UI products and compile log
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/prepared-ios-ui
          cp build/logs/build-ios-ui-compile.log '${{ steps.ui_artifacts.outputs.derived_data }}/compile.log'
          MD_UI_ARCHIVE_SHA=$(python3 scripts/prepared_ios_ui_artifacts.py pack \
            --derived-data '${{ steps.ui_artifacts.outputs.derived_data }}' \
            --source-sha "$(git rev-parse HEAD)" \
            --archive build/prepared-ios-ui/ui-products.tar.gz)
          echo "sha256=$MD_UI_ARCHIVE_SHA" >> "$GITHUB_OUTPUT"

      - name: Share exact qualified UI products
        uses: actions/upload-artifact@v4
        with:
          name: apple-sdk27-ui-products
          path: apps/apple/build/prepared-ios-ui/ui-products.tar.gz
          compression-level: 0 # Avoid compressing the gzip stream again.
          if-no-files-found: error
          retention-days: 1

  ios-ui-shards:
    name: iOS UI shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    needs: [changes, prepare-shared-core, prepare-ui-artifacts]
    if: ${{ needs.changes.outputs.ios_ui == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/apple

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'

      - name: Restore prepared shared Rust core
        uses: actions/download-artifact@v4
        with:
          name: apple-sdk27-shared-core
          path: apps/apple/Packages/HealthMdCoreRust/Artifacts

      - name: Verify SDK27 consumer provenance (UI)
        run: |
          bash scripts/qualify-history-authorization-sdk27.sh
          python3 scripts/compare-history-sdk27-receipts.py build/logs/history-sdk27-receipt.txt Packages/HealthMdCoreRust/Artifacts/.healthmd-core-sdk27.txt

      - name: Validate prepared shared Rust core
        run: |
          test -f Packages/HealthMdCoreRust/Artifacts/HealthmdCore.xcframework/Info.plist
          test -s Packages/HealthMdCoreRust/Artifacts/.healthmd-core-source.sha256
          ../../packages/healthmd-core-rust/scripts/validate-apple-xcframework.sh \
            Packages/HealthMdCoreRust/Artifacts/HealthmdCore.xcframework

      - name: Restore exact qualified UI products
        uses: actions/download-artifact@v4
        with:
          name: apple-sdk27-ui-products
          path: apps/apple/build/prepared-ios-ui

      - name: Verify restored UI products
        id: ui_artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/logs build/test-results
          MD_UI_DERIVED_DATA=$(mktemp -d "$PWD/build/ios-ui-derived-data.XXXXXX")
          MD_UI_XCTESTRUN=$(python3 scripts/prepared_ios_ui_artifacts.py restore \
            --derived-data "$MD_UI_DERIVED_DATA" \
            --source-sha "$(git rev-parse HEAD)" \
            --archive build/prepared-ios-ui/ui-products.tar.gz \
            --sha256 '${{ needs.prepare-ui-artifacts.outputs.sha256 }}' \
            --receipt build/logs/ios-ui-build-receipt.json)
          cp "$MD_UI_DERIVED_DATA/compile.log" build/logs/build-ios-ui-compile.log
          MD_UI_APP=$(python3 -c 'import json; print(json.load(open("build/logs/ios-ui-build-receipt.json"))["products"][0]["path"])')
          echo "xctestrun=$MD_UI_XCTESTRUN" >> "$GITHUB_OUTPUT"
          echo "app=$MD_UI_APP" >> "$GITHUB_OUTPUT"

      - name: Select newest compatible iOS Simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          # Preserve the runner's actual compatibility metadata even when selection fails.
          xcrun simctl list runtimes available -j | tee build/logs/ios-ui-runtimes.json
          xcrun simctl list devicetypes -j > build/logs/ios-ui-device-types.json
          xcrun simctl list devices available -j > build/logs/ios-ui-devices.json
          if [[ '${{ matrix.shard }}' == 3 ]]; then
            IOS_DESTINATION=$(scripts/select-ios-simulator.sh --device-family iPad --create-missing)
          else
            IOS_DESTINATION=$(scripts/select-ios-simulator.sh)
          fi
          echo "Using simulator destination: ${IOS_DESTINATION}"
          echo "ios_destination=${IOS_DESTINATION}" >> "$GITHUB_OUTPUT"

      - name: Run UI smoke tests (iOS)
        timeout-minutes: ${{ matrix.shard == 3 && 15 || 35 }}
        run: |
          set -euo pipefail
          python3 scripts/ios_ui_shards.py run \
            --shard '${{ matrix.shard }}' \
            --source-sha "$(git rev-parse HEAD)" \
            --run-id '${{ github.run_id }}' --attempt '${{ github.run_attempt }}' \
            --xctestrun '${{ steps.ui_artifacts.outputs.xctestrun }}' \
            --build-receipt build/logs/ios-ui-build-receipt.json \
            --prepared-sha256 '${{ needs.prepare-ui-artifacts.outputs.sha256 }}' \
            --destination '${{ steps.simulator.outputs.ios_destination }}' \
            --result build/test-results/HealthMd-UI-Shard.xcresult \
            --log build/logs/build-ios-ui.log \
            --receipt build/logs/ui-case-receipt.json

      - name: Check warnings (iOS UI)
        if: ${{ !cancelled() }}
        run: |
          scripts/check-warnings.sh build/logs/build-ios-ui-compile.log
          scripts/check-warnings.sh build/logs/build-ios-ui.log
          python3 - <<'PY'
          from pathlib import Path
          runtime_log = Path("build/logs/build-ios-ui.log").read_text(errors="replace")
          if "Accessing StateObject<" in runtime_log:
              raise SystemExit("::error::UI launch accessed StateObject before SwiftUI installed its storage")
          print("PASS: no premature StateObject access in UI runtime.")
          PY

      - name: Upload iOS UI artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: |
            apps/apple/build/logs/build-ios-ui-compile.log
            apps/apple/build/logs/ios-ui-build-receipt.json
            apps/apple/build/logs/build-ios-ui.log
            apps/apple/build/test-results/HealthMd-UI-*.xcresult
            apps/apple/build/logs/ui-*.json
            apps/apple/build/logs/ui-owner-*.abort
          retention-days: 14

  test-ios-ui:
    name: iOS UI regressions
    needs: [changes, prepare-ui-artifacts, ios-ui-shards]
    if: ${{ always() && needs.changes.outputs.ios_ui == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout coverage verifier
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - name: Collect every UI lane without overwriting matching report paths
        uses: actions/download-artifact@v4
        with:
          pattern: ios-ui-${{ github.run_id }}-${{ github.run_attempt }}-shard-*
          path: ui-shards
      - name: Require all selected UI cases from this source and run
        env:
          PREPARE_RESULT: ${{ needs.prepare-ui-artifacts.result }}
          SHARDS_RESULT: ${{ needs.ios-ui-shards.result }}
        run: |
          set -euo pipefail
          test "$PREPARE_RESULT" = success
          test "$SHARDS_RESULT" = success
          python3 apps/apple/scripts/ios_ui_shards.py verify \
            --reports ui-shards --source-sha "$(git rev-parse HEAD)" \
            --run-id '${{ github.run_id }}' --attempt '${{ github.run_attempt }}' \
            --output ui-case-inventory.json
      - name: Retain complete UI evidence with the stable artifact name
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-build-logs
          path: |
            ui-shards/
            ui-case-inventory.json
          if-no-files-found: error
          retention-days: 14

  connectivity-package:
    name: HealthMdConnectivity package
    needs: changes
    if: ${{ needs.changes.outputs.connectivity == 'true' }}
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Test standalone direct protocol package
        run: swift test --package-path apps/apple/Packages/HealthMdConnectivity

  gate:
    name: Apple CI
    if: ${{ always() }}
    needs:
      - changes
      - workflow-policy
      - prepare-shared-core
      - prepare-ui-artifacts
      - test-ios
      - test-ios-ui
      - test-macos
      - connectivity-package
    runs-on: ubuntu-24.04
    steps:
      - name: Require Apple checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          POLICY_SELECTED: ${{ needs.changes.outputs.policy }}
          POLICY_RESULT: ${{ needs.workflow-policy.result }}
          PREPARE_SELECTED: ${{ needs.changes.outputs.prepare }}
          PREPARE_RESULT: ${{ needs.prepare-shared-core.result }}
          IOS_SELECTED: ${{ needs.changes.outputs.ios }}
          IOS_RESULT: ${{ needs.test-ios.result }}
          PREPARE_UI_RESULT: ${{ needs.prepare-ui-artifacts.result }}
          IOS_UI_SELECTED: ${{ needs.changes.outputs.ios_ui }}
          IOS_UI_RESULT: ${{ needs.test-ios-ui.result }}
          MACOS_SELECTED: ${{ needs.changes.outputs.macos }}
          MACOS_RESULT: ${{ needs.test-macos.result }}
          CONNECTIVITY_SELECTED: ${{ needs.changes.outputs.connectivity }}
          CONNECTIVITY_RESULT: ${{ needs.connectivity-package.result }}
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = success
          require_job() {
            case "$1:$2" in
              true:success|false:skipped|false:success) ;;
              *) echo "::error::$3 has selection '$1' and result '$2'; selected checks must succeed."; exit 1 ;;
            esac
          }
          require_job "$PREPARE_SELECTED" "$PREPARE_RESULT" "shared core"
          require_job "$IOS_SELECTED" "$IOS_RESULT" "iOS unit tests"
          require_job "$IOS_UI_SELECTED" "$IOS_UI_RESULT" "iOS UI regressions"
          require_job "$MACOS_SELECTED" "$MACOS_RESULT" "macOS coverage and documentation"
          require_job "$CONNECTIVITY_SELECTED" "$CONNECTIVITY_RESULT" "standalone connectivity package"
          require_job "$IOS_UI_SELECTED" "$PREPARE_UI_RESULT" "UI artifact preparation"
          require_job "$POLICY_SELECTED" "$POLICY_RESULT" "release workflow policy"
