# Isolated diagnostic branch only. NEVER merge this replacement workflow.
name: Apple CI
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-stop-diagnostic:
    runs-on: xcode-27
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/apple
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'
      - name: Restore exact unchanged core from the observed qualification run
        uses: actions/download-artifact@v4
        with:
          name: apple-sdk27-shared-core
          path: apps/apple/Packages/HealthMdCoreRust/Artifacts
          run-id: 40363861856
          github-token: ${{ github.token }}
      - name: Validate toolchain and exact prepared core
        run: |
          set -euo pipefail
          bash scripts/qualify-history-authorization-sdk27.sh
          python3 - <<'PYCODE'
          import importlib.util
          import json
          from pathlib import Path
          import re
          import subprocess
          spec = importlib.util.spec_from_file_location('provenance', 'scripts/compare-history-sdk27-receipts.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          consumer = Path('build/logs/history-sdk27-receipt.txt').read_text()
          producer = Path('Packages/HealthMdCoreRust/Artifacts/.healthmd-core-sdk27.txt').read_text()
          identities = {}
          for name, value in [('consumer', consumer), ('producer', producer)]:
              fields = {}
              for field in ['HEAD', 'TREE']:
                  matches = re.findall(r'^' + field + r'=([0-9a-f]{40})$', value, re.MULTILINE)
                  if len(matches) != 1:
                      raise RuntimeError('missing/ambiguous retained source identity')
                  fields[field] = matches[0]
              identities[name] = fields
          current = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if identities['consumer']['HEAD'] != current:
              raise RuntimeError('consumer is not this diagnostic source')
          def toolchain(value):
              return module.build_identity('\n'.join(line for line in value.splitlines()
                  if not line.startswith(('HEAD=', 'TREE='))) + '\n')
          if toolchain(consumer) != toolchain(producer):
              raise RuntimeError('diagnostic core/consumer toolchains differ')
          digest = subprocess.check_output(['../../packages/healthmd-core-rust/scripts/apple-source-digest.sh'], text=True).strip()
          retained = Path('Packages/HealthMdCoreRust/Artifacts/.healthmd-core-source.sha256').read_text().strip()
          if not re.fullmatch(r'[0-9a-f]{64}', digest) or digest != retained:
              raise RuntimeError('retained core inputs differ from diagnostic source')
          identities['unchanged_core_source_sha256'] = digest
          identities['purpose'] = 'diagnosis-only cross-revision core reuse; not exact-head qualification'
          Path('build/logs/stop-diagnostic-core-provenance.json').write_text(json.dumps(identities, indent=2) + '\n')
          print(json.dumps(identities, sort_keys=True))
          PYCODE
          ../../packages/healthmd-core-rust/scripts/validate-apple-xcframework.sh Packages/HealthMdCoreRust/Artifacts/HealthmdCore.xcframework
      - name: Build original coverage profile test products
        timeout-minutes: 25
        run: |
          make build-macos-tests CORE_RUST_PREPARE=: MACOS_DERIVED_DATA_DIR=build/stop-diagnostic-derived MACOS_CODE_COVERAGE=YES
      - name: Run exact owning Stop cases and immutable-record controls
        # Five cases retain their original 120-second default; leave room for
        # restart/teardown after failures without changing qualification gates.
        timeout-minutes: 12
        run: |
          set -euo pipefail
          mkdir -p build/logs
          xcodebuild test-without-building \
            -project HealthMd.xcodeproj -scheme HealthMd-Tests-macOS \
            -derivedDataPath build/stop-diagnostic-derived \
            -destination "platform=macOS,arch=$(uname -m)" \
            -enableCodeCoverage YES \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -only-testing:HealthMdTests/AgentBridgeExportPlanningTests/testAcceptedJobPureReusePreservesDurableIdentityAndRejectsChangedFields \
            -only-testing:HealthMdTests/AgentBridgeExportPlanningTests/testWarmedAcceptedJobNeverCachesLiveStopExpiryOrPeerAuthority \
            -only-testing:HealthMdTests/AgentBridgeExportPlanningTests/testNativeResumedTransferConfirmsExactRetainedSourceStop \
            -only-testing:HealthMdTests/AgentBridgeExportPlanningTests/testNativeTransferConfirmsSourceStopAtEachACKAndHostCommitWithoutAnotherReader \
            -only-testing:HealthMdTests/AgentBridgeExportPlanningTests/testNativeTransferSenderConsumesKeepalivesBeforeEveryACKAndHostCommit \
            -resultBundlePath build/stop-diagnostic.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee build/logs/stop-diagnostic.log
      - name: Preserve minimal synthetic phase evidence in job output
        if: ${{ always() }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('build/logs/stop-diagnostic.log')
          if path.exists():
              for line in path.read_text(errors='replace').splitlines():
                  if any(marker in line for marker in ('[STOP-DIAG]', 'exceeded execution time', 'Test Case', 'XCTAssert', '** TEST')):
                      print(line)
          PY
