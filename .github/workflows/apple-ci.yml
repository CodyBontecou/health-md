# Isolated diagnostic branch only. Never merge this replacement workflow.
name: Apple CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owned-process-diagnostic:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'
      - name: Reproduce unchanged ownership assertions with error-location diagnostics
        timeout-minutes: 9
        shell: bash
        working-directory: apps/apple
        run: |
          set -euo pipefail
          python3 --version
          command -v python3 bash ps
          bash --version
          python3 - <<'PY'
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import tempfile

          # Copies only: production source, original tests and qualification
          # workflow remain intact on the PR branch. No devices/native commands.
          with tempfile.TemporaryDirectory(prefix='healthmd-owner-diagnostic-', dir=os.environ['RUNNER_TEMP']) as temporary:
              root = Path(temporary)
              source = Path('scripts/run-owned-ui.py').read_text()
              needle = '                print(f"Owned UI cleanup unverified: {error}", file=sys.stderr)'
              if source.count(needle) != 1:
                  raise RuntimeError('diagnostic source anchor changed')
              source = source.replace(needle, needle + '\n                __import__("traceback").print_exc(file=sys.stderr)')
              # This only prints the exact original cleanup exception stack;
              # no swallowing, replacement statuses, retries or wider signals.
              (root / 'run-owned-ui.py').write_text(source)
              shutil.copyfile('scripts/test-owned-ui-processes.py', root / 'test-owned-ui-processes.py')
              command = [sys.executable, str(root / 'test-owned-ui-processes.py')]
              print('Diagnostic source: current GITHUB_SHA; full original 18-test suite', flush=True)
              result = subprocess.run(command + ['-v'], timeout=180)
              if result.returncode:
                  raise SystemExit(result.returncode)
              # Bounded recurrence diagnosis, stop at FIRST failure. Passing
              # repetitions are not retries of a red qualification or a repair.
              # 180 + 6*45 = 450 seconds maximum, leaving 90 seconds
              # of step headroom for interpreter/cleanup/diagnostic overhead.
              for iteration in range(6):
                  print(f'Ownership diagnostic sequence {iteration + 1}/6', flush=True)
                  result = subprocess.run(command + [
                      'OwnershipControls.test_cleanup_inspection_and_record_failure_override_success',
                      'OwnershipControls.test_deadline_during_each_invocation_no_next_native_or_tablet',
                      '-v'], timeout=45)
                  if result.returncode:
                      raise SystemExit(result.returncode)
          PY
