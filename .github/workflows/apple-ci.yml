name: PR189 full macOS VM-ledger SDK27 diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: pr189-rss-ledger-sdk27-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 84585b3c72d567ab03c5e53f250d840631cce313
          path: candidate
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'
      - name: Verify pinned source and SDK27 native core
        working-directory: candidate/apps/apple
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 84585b3c72d567ab03c5e53f250d840631cce313
          test "$(git rev-parse 'HEAD^{tree}')" = 832a00ab4c49c521b7bbba7459c5cd132c1dad62
          git diff --exit-code
          mkdir -p build/logs/pr189-rss-ledger-sdk27
          {
            git rev-parse HEAD 'HEAD^{tree}'
            xcodebuild -version
            xcrun swiftc --version
            uname -m
          } | tee build/logs/pr189-rss-ledger-sdk27/identity.txt
          bash scripts/qualify-history-authorization-sdk27.sh
          ../../packages/healthmd-core-rust/scripts/prepare-apple-xcframework.sh
          cp build/logs/history-sdk27-receipt.txt Packages/HealthMdCoreRust/Artifacts/.healthmd-core-sdk27.txt
          python3 scripts/compare-history-sdk27-receipts.py build/logs/history-sdk27-receipt.txt Packages/HealthMdCoreRust/Artifacts/.healthmd-core-sdk27.txt
          actual=$(../../packages/healthmd-core-rust/scripts/apple-source-digest.sh)
          test "$actual" = "$(cat Packages/HealthMdCoreRust/Artifacts/.healthmd-core-source.sha256)"
          ../../packages/healthmd-core-rust/scripts/validate-apple-xcframework.sh Packages/HealthMdCoreRust/Artifacts/HealthmdCore.xcframework
      - name: Reproduce the complete macOS test order with VM-ledger evidence
        working-directory: candidate/apps/apple
        shell: bash
        run: |
          set -euo pipefail
          out=build/logs/pr189-rss-ledger-sdk27
          # Keep the original full-suite order, 72 MiB input, 32 MiB bound and 2 ms sampler.
          # The pinned candidate adds same-observation ledger counters to assertion failures.
          status=0
          xcodebuild test -project HealthMd.xcodeproj -scheme HealthMd-Tests-macOS \
            -derivedDataPath build/pr189-rss-ledger-derived \
            -destination "platform=macOS,arch=$(uname -m)" \
            -resultBundlePath build/pr189-rss-ledger.xcresult \
            -enableCodeCoverage YES \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee "$out/cases.log" || status=$?
          python3 - "$out/cases.log" "$status" <<'PYCODE'
          from pathlib import Path
          import json,re,sys
          text=Path(sys.argv[1]).read_text()
          cases=re.findall(r"Test Case '-\[HealthMdTests\.([^\]]+)\]' (passed|failed|skipped) ",text)
          target='ConnectedCorpusPartitionFileTests testStreamableDecoderMapsLargeProductionHealthDayDataWithoutItemSizedRSSCopy'
          target_cases=[(n,r) for n,r in cases if n==target]
          ledger=[line for line in text.splitlines() if 'Production HealthData encoding must not create an item-sized Data copy' in line]
          receipt={'source':'84585b3c72d567ab03c5e53f250d840631cce313','native_exit':int(sys.argv[2]),'observed_count':len(cases),'failed':[n for n,r in cases if r=='failed'],'target':target_cases,'ledger_assertions':ledger}
          Path(sys.argv[1]).with_name('receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          if len(target_cases)!=1: raise SystemExit('Memory diagnostic target missing or duplicated')
          if target_cases[0][1]=='failed' and not any('baseline: footprint=' in line and 'peak: footprint=' in line for line in ledger):
              raise SystemExit('Failure lacks the required VM ledger evidence')
          if len(cases)<2990: raise SystemExit('Full suite execution incomplete')
          PYCODE
          git diff --exit-code
          exit "$status"
      - name: Preserve minimal synthetic qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr189-rss-ledger-sdk27
          path: candidate/apps/apple/build/logs/
          retention-days: 3
          if-no-files-found: warn
