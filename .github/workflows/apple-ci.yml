name: Apple CI

on:
  push:
    branches:
      - main
      - testing
    # Path-aware pushes keep unrelated merges off the scarce macOS runner pool;
    # pull requests are path-filtered by the changes job so the stable gate
    # still reports a conclusive context on every PR.
    paths:
      - 'AGENTS.md'
      - '.github/actions/**'
      - 'apps/apple/**'
      - 'apps/website/external-sources.json'
      - 'apps/website/assets/healthmd-plugin-visualizations.js'
      - 'apps/website/assets/visualizations-data/health-sample.json'
      - 'apps/website/assets/visualizations-data/health-rollups.json'
      - 'packages/contracts/**'
      - 'packages/healthmd-core-rust/**'
      - 'Makefile'
      - '.github/workflows/README.md'
      - '.github/workflows/apple-ci.yml'
      - '.github/workflows/release-ios.yml'
      - '.github/workflows/release-macos.yml'
      - '.github/scripts/**'
      - '.github/workflows/apple-nightly.yml'
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_sha:
        description: Exact commit to qualify
        required: false
        type: string
      full_qualification:
        description: Run every job when qualifying a reusable workflow caller
        required: false
        type: boolean
        default: true

concurrency:
  # Reusable workflows inherit github.workflow from the release caller. Keep
  # this namespace distinct from the parent and isolate each qualification run
  # so a later release cannot cancel (or replace a pending) exact-SHA suite.
  group: apple-ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.release_sha && github.run_id || 'branch' }}
  cancel-in-progress: ${{ !inputs.release_sha }}

jobs:
  changes:
    name: Detect Apple-affecting changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.detect.outputs.run }}
      prepare: ${{ steps.detect.outputs.prepare }}
      ios: ${{ steps.detect.outputs.ios }}
      ios_ui: ${{ steps.detect.outputs.ios_ui }}
      macos: ${{ steps.detect.outputs.macos }}
      connectivity: ${{ steps.detect.outputs.connectivity }}
      policy: ${{ steps.detect.outputs.policy }}
    steps:
      - name: Check out source for job selection
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - name: Test Apple PR routing and final gate
        run: |
          python3 -m unittest discover -s apps/apple/scripts/tests -p 'test_apple_ci_*.py'
          python3 apps/apple/scripts/tests/test_ci_apple_core_slices.py
          python3 apps/apple/scripts/tests/test_ios_ui_shards.py
          python3 apps/apple/scripts/tests/test_start_ci_ios_simulator.py
      - name: Validate Apple documentation links
        # Links can target any repository file, including files in skipped jobs.
        run: python3 apps/apple/scripts/check-documentation-links.py
      - name: Detect which Apple jobs must run
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_FULL_QUALIFICATION: ${{ inputs.full_qualification || false }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: python3 apps/apple/scripts/apple-ci-plan.py --release-sha "$RELEASE_SHA"
      - name: Verify device shards fail closed
        run: |
          python3 apps/apple/scripts/test-history-ui-pipeline-status.py
          python3 apps/apple/scripts/test-owned-ui-processes.py

  prepare-core-slices:
    name: Build Apple Rust slice ${{ matrix.target }}
    needs: [changes, probe-shared-core]
    if: ${{ needs.changes.outputs.prepare == 'true' && needs.probe-shared-core.result == 'success' && needs.probe-shared-core.outputs.cache-hit == 'false' }}
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios, aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'
      - name: Qualify SDK27 compiler before native slice build
        run: bash apps/apple/scripts/qualify-history-authorization-sdk27.sh

      - name: Fingerprint active Apple toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          fingerprint=$({ xcodebuild -version; xcrun --sdk iphonesimulator --show-sdk-version; xcrun --sdk macosx --show-sdk-version; } | shasum -a 256 | awk '{print $1}')
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Restore exact-source native slice
        id: slice_cache
        uses: actions/cache@v4
        with:
          path: build/apple-core-slices/${{ matrix.target }}.a
          key: apple-core-slice-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('packages/healthmd-core-rust/vendor/**', 'packages/healthmd-core-rust/Cargo.toml', 'packages/healthmd-core-rust/Cargo.lock', 'packages/healthmd-core-rust/rust-toolchain.toml', 'packages/healthmd-core-rust/crates/**', 'packages/healthmd-core-rust/scripts/*apple*', 'apps/apple/Packages/HealthMdCoreRust/Bindings/**') }}
      - name: Restore pinned binding-generator compilation on its native worker
        if: ${{ matrix.target == 'aarch64-apple-ios' }}
        uses: actions/cache@v4
        with:
          path: packages/healthmd-core-rust/target/debug
          key: apple-core-host-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('packages/healthmd-core-rust/vendor/**', 'packages/healthmd-core-rust/Cargo.lock', 'packages/healthmd-core-rust/rust-toolchain.toml') }}
      - name: Check bindings while the other native slices compile
        if: ${{ matrix.target == 'aarch64-apple-ios' }}
        run: packages/healthmd-core-rust/scripts/generate-apple-bindings.sh --check
      - name: Build unchanged release-profile native slice
        if: ${{ steps.slice_cache.outputs.cache-hit != 'true' }}
        run: |
          packages/healthmd-core-rust/scripts/build-apple-xcframework.sh \
            --slice '${{ matrix.target }}' 'build/apple-core-slices/${{ matrix.target }}.a'
      - name: Bind the actual archive to this source and toolchain
        run: |
          python3 apps/apple/scripts/ci_apple_core_slices.py receipt \
            --slices build/apple-core-slices --target '${{ matrix.target }}' \
            --source-sha "$(git rev-parse HEAD)" --toolchain '${{ steps.toolchain.outputs.fingerprint }}'
      - name: Retain uniquely named native slice and source receipt
        uses: actions/upload-artifact@v4
        with:
          name: apple-core-slice-${{ matrix.target }}
          path: build/apple-core-slices/${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 1

  workflow-policy:
    name: Apple release workflow policy
    needs: changes
    if: ${{ needs.changes.outputs.policy == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Test the executing workflow revision's policy. The native jobs below
      # qualify release_sha, including when recovery's workflow SHA differs.
      - name: Checkout workflow policy
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Test Apple release workflow policy
        run: |
          python3 -m venv "$RUNNER_TEMP/apple-release-policy-venv"
          "$RUNNER_TEMP/apple-release-policy-venv/bin/pip" install --disable-pip-version-check PyYAML==6.0.3
          "$RUNNER_TEMP/apple-release-policy-venv/bin/python" -m unittest discover \
            -s .github/scripts/tests -p 'test_apple_*.py' -v

  probe-shared-core:
    name: Check validated shared-core bundle before native fanout
    needs: changes
    if: ${{ needs.changes.outputs.prepare == 'true' }}
    # Free standard public-repository SDK27 runner, never xlarge.
    runs-on: xcode-27
    timeout-minutes: 5
    outputs:
      cache-hit: ${{ steps.admit.outputs.ready }}
    defaults:
      run:
        working-directory: apps/apple
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'

      - name: Require SDK27 public history signature and record provenance
        run: |
          bash scripts/qualify-history-authorization-sdk27.sh
          mkdir -p Packages/HealthMdCoreRust/Artifacts
          cp build/logs/history-sdk27-receipt.txt Packages/HealthMdCoreRust/Artifacts/.healthmd-core-sdk27.txt

      - name: Fingerprint active Apple toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          fingerprint=$({ xcodebuild -version; xcrun --sdk iphonesimulator --show-sdk-version; xcrun --sdk macosx --show-sdk-version; } | shasum -a 256 | awk '{print $1}')
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - id: shared-core-cache
        name: Restore exact-source shared-core cache
        uses: actions/cache/restore@v4
        with:
          path: |
            apps/apple/Packages/HealthMdCoreRust/Artifacts/HealthmdCore.xcframework
            apps/apple/Packages/HealthMdCoreRust/Artifacts/.healthmd-core-source.sha256
          key: >-
            apple-shared-core-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('packages/healthmd-core-rust/vendor/**', 'packages/healthmd-core-rust/Cargo.toml', 'packages/healthmd-core-rust/Cargo.lock', 'packages/healthmd-core-rust/rust-toolchain.toml', 'packages/healthmd-core-rust/crates/**', 'packages/healthmd-core-rust/scripts/*apple*', 'apps/apple/Packages/HealthMdCoreRust/Bindings/**') }}

      - name: Restore binding-generator compilation for a hot bundle
        if: ${{ steps.shared-core-cache.outputs.cache-hit == 'true' }}
        uses: actions/cache@v4
        with:
          path: packages/healthmd-core-rust/target/debug
          key: apple-core-host-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('packages/healthmd-core-rust/vendor/**', 'packages/healthmd-core-rust/Cargo.lock', 'packages/healthmd-core-rust/rust-toolchain.toml') }}
      - name: Check bindings before hot bundle admission
        if: ${{ steps.shared-core-cache.outputs.cache-hit == 'true' }}
        working-directory: .
        run: packages/healthmd-core-rust/scripts/generate-apple-bindings.sh --check

      - name: Admit only an exact validated bundle
        id: admit
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ steps.shared-core-cache.outputs.cache-hit }}' == 'true' ]]; then
            actual=$(../../packages/healthmd-core-rust/scripts/apple-source-digest.sh)
            test "$actual" = "$(cat Packages/HealthMdCoreRust/Artifacts/.healthmd-core-source.sha256)"
            ../../packages/healthmd-core-rust/scripts/validate-apple-xcframework.sh Packages/HealthMdCoreRust/Artifacts/HealthmdCore.xcframework
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Retain validated bundle for this exact workflow
        if: ${{ steps.admit.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: apple-sdk27-shared-core
          path: |
            apps/apple/Packages/HealthMdCoreRust/Artifacts/HealthmdCore.xcframework
            apps/apple/Packages/HealthMdCoreRust/Artifacts/.healthmd-core-source.sha256
            apps/apple/Packages/HealthMdCoreRust/Artifacts/.healthmd-core-sdk27.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  assemble-shared-core:
    name: Assemble and validate cold shared Rust core
    needs: [changes, probe-shared-core, prepare-core-slices]
    if: ${{ always() && needs.changes.outputs.prepare == 'true' && needs.probe-shared-core.result == 'success' && needs.probe-shared-core.outputs.cache-hit == 'false' && needs.prepare-core-slices.result == 'success' }}
    # Free standard public-repository SDK27 runner, never xlarge.
    runs-on: xcode-27
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/apple
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'

      - name: Require SDK27 public history signature and record provenance
        run: |
          bash scripts/qualify-history-authorization-sdk27.sh
          mkdir -p Packages/HealthMdCoreRust/Artifacts
          cp build/logs/history-sdk27-receipt.txt Packages/HealthMdCoreRust/Artifacts/.healthmd-core-sdk27.txt

      - name: Fingerprint active Apple toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          fingerprint=$({ xcodebuild -version; xcrun --sdk iphonesimulator --show-sdk-version; xcrun --sdk macosx --show-sdk-version; } | shasum -a 256 | awk '{print $1}')
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - id: shared-core-cache
        if: ${{ needs.probe-shared-core.outputs.cache-hit == 'false' }}
        name: Restore exact-source shared-core cache
        uses: actions/cache@v4
        with:
          path: |
            apps/apple/Packages/HealthMdCoreRust/Artifacts/HealthmdCore.xcframework
            apps/apple/Packages/HealthMdCoreRust/Artifacts/.healthmd-core-source.sha256
          key: >-
            apple-shared-core-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('packages/healthmd-core-rust/vendor/**', 'packages/healthmd-core-rust/Cargo.toml', 'packages/healthmd-core-rust/Cargo.lock', 'packages/healthmd-core-rust/rust-toolchain.toml', 'packages/healthmd-core-rust/crates/**', 'packages/healthmd-core-rust/scripts/*apple*', 'apps/apple/Packages/HealthMdCoreRust/Bindings/**') }}

      - name: Collect all five uniquely named native slices
        if: ${{ needs.probe-shared-core.outputs.cache-hit == 'false' && steps.shared-core-cache.outputs.cache-hit != 'true' }}
        uses: actions/download-artifact@v4
        with:
          pattern: apple-core-slice-*
          path: build/apple-core-slices
          merge-multiple: true

      - name: Restore pinned host binding-generator compilation
        if: ${{ needs.probe-shared-core.outputs.cache-hit == 'false' && steps.shared-core-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache@v4
        with:
          path: packages/healthmd-core-rust/target/debug
          key: apple-core-host-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('packages/healthmd-core-rust/vendor/**', 'packages/healthmd-core-rust/Cargo.lock', 'packages/healthmd-core-rust/rust-toolchain.toml') }}

      - name: Prepare and validate shared Rust core for Apple
        if: ${{ needs.probe-shared-core.outputs.cache-hit == 'false' && steps.shared-core-cache.outputs.cache-hit != 'true' }}
        working-directory: .
        run: |
          set -euo pipefail
          python3 apps/apple/scripts/ci_apple_core_slices.py verify \
            --slices build/apple-core-slices --source-sha "$(git rev-parse HEAD)" \
            --toolchain '${{ steps.toolchain.outputs.fingerprint }}'
          packages/healthmd-core-rust/scripts/generate-apple-bindings.sh --check
          packages/healthmd-core-rust/scripts/build-apple-xcframework.sh \
            --assemble "$PWD/build/apple-core-slices" \
            "$PWD/apps/apple/Packages/HealthMdCoreRust/Artifacts/HealthmdCore.xcframework"
          packages/healthmd-core-rust/scripts/apple-source-digest.sh \
            > apps/apple/Packages/HealthMdCoreRust/Artifacts/.healthmd-core-source.sha256

      - name: Validate cached or newly prepared shared Rust core
        run: |
          actual=$(../../packages/healthmd-core-rust/scripts/apple-source-digest.sh)
          test "$actual" = "$(cat Packages/HealthMdCoreRust/Artifacts/.healthmd-core-source.sha256)"
          bash scripts/qualify-history-authorization-sdk27.sh
          python3 scripts/compare-history-sdk27-receipts.py build/logs/history-sdk27-receipt.txt Packages/HealthMdCoreRust/Artifacts/.healthmd-core-sdk27.txt
          ../../packages/healthmd-core-rust/scripts/validate-apple-xcframework.sh \
            Packages/HealthMdCoreRust/Artifacts/HealthmdCore.xcframework

      - name: Share the exact prepared XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: apple-sdk27-shared-core
          path: |
            apps/apple/Packages/HealthMdCoreRust/Artifacts/HealthmdCore.xcframework
            apps/apple/Packages/HealthMdCoreRust/Artifacts/.healthmd-core-source.sha256
            apps/apple/Packages/HealthMdCoreRust/Artifacts/.healthmd-core-sdk27.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  prepare-shared-core:
    name: Prepare shared Rust core once
    needs: [changes, probe-shared-core, prepare-core-slices, assemble-shared-core]
    if: ${{ always() && needs.changes.outputs.prepare == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require exactly one complete validated native producer path
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PROBE_RESULT: ${{ needs.probe-shared-core.result }}
          CACHE_HIT: ${{ needs.probe-shared-core.outputs.cache-hit }}
          SLICES_RESULT: ${{ needs.prepare-core-slices.result }}
          ASSEMBLY_RESULT: ${{ needs.assemble-shared-core.result }}
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = success
          test "$PROBE_RESULT" = success
          case "$CACHE_HIT:$SLICES_RESULT:$ASSEMBLY_RESULT" in
            true:skipped:skipped|false:success:success) ;;
            *) echo '::error::Shared core requires a complete consistent validated producer path'; exit 1 ;;
          esac

  prepare-ios-artifacts:
    name: Prepare qualified iOS unit-test products once
    needs: [changes, prepare-shared-core]
    if: ${{ needs.changes.outputs.ios == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 30
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}
    defaults:
      run:
        working-directory: apps/apple

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - name: Verify build-number format
        # Guard against the v1.8.0/1.8.1 regression. Two checks:
        #  (a) CURRENT_PROJECT_VERSION in pbxproj must be a 12-digit YYYYMMDDHHMM
        #      timestamp.
        #  (b) Info.plist CFBundleVersion must be the $(CURRENT_PROJECT_VERSION)
        #      macro, not a hardcoded literal — otherwise the literal silently
        #      overrides any pbxproj bump (root cause of the v1.8.0/v1.8.1
        #      shipped builds).
        run: |
          set -e
          bad=$(awk '/CURRENT_PROJECT_VERSION =/ { gsub(/[ \t;]/, "", $3); print $3 }' \
                  HealthMd.xcodeproj/project.pbxproj | sort -u | grep -vE '^[0-9]{12}$' || true)
          if [ -n "$bad" ]; then
            echo "::error::CURRENT_PROJECT_VERSION must be a 12-digit YYYYMMDDHHMM timestamp."
            echo "Offending values:"
            echo "$bad"
            echo
            echo "Why: a small integer (e.g. \"1\", \"2\") would be numerically less than the"
            echo "freemium build threshold and silently auto-unlock the paywall for all new"
            echo "installs (the v1.8.0/1.8.1 bug)."
            exit 1
          fi

          # Reject any Info.plist whose CFBundleVersion is a literal value
          # rather than the $(CURRENT_PROJECT_VERSION) macro.
          # shellcheck disable=SC2016
          while IFS= read -r plist; do
            value=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$plist" 2>/dev/null || true)
            if [ -n "$value" ] && [ "$value" != '$(CURRENT_PROJECT_VERSION)' ]; then
              echo "::error::$plist hardcodes CFBundleVersion = \"$value\". Use \$(CURRENT_PROJECT_VERSION) instead."
              echo "Why: a literal value silently overrides pbxproj bumps and asc xcode version edit."
              exit 1
            fi
            mvalue=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$plist" 2>/dev/null || true)
            if [ -n "$mvalue" ] && [ "$mvalue" != '$(MARKETING_VERSION)' ]; then
              echo "::error::$plist hardcodes CFBundleShortVersionString = \"$mvalue\". Use \$(MARKETING_VERSION) instead."
              exit 1
            fi
          done < <(find HealthMd -name 'Info.plist' -not -path '*/build/*')

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'

      - name: Restore prepared shared Rust core
        uses: actions/download-artifact@v4
        with:
          name: apple-sdk27-shared-core
          path: apps/apple/Packages/HealthMdCoreRust/Artifacts

      - name: Verify SDK27 consumer provenance (iOS)
        run: |
          bash scripts/qualify-history-authorization-sdk27.sh
          python3 scripts/compare-history-sdk27-receipts.py build/logs/history-sdk27-receipt.txt Packages/HealthMdCoreRust/Artifacts/.healthmd-core-sdk27.txt

      - name: Validate prepared shared Rust core
        run: |
          test -f Packages/HealthMdCoreRust/Artifacts/HealthmdCore.xcframework/Info.plist
          test -s Packages/HealthMdCoreRust/Artifacts/.healthmd-core-source.sha256
          ../../packages/healthmd-core-rust/scripts/validate-apple-xcframework.sh \
            Packages/HealthMdCoreRust/Artifacts/HealthmdCore.xcframework

      - name: Test iOS simulator selection policy
        run: python3 scripts/tests/test_select_ios_simulator.py

      - name: Select newest compatible iOS Simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          IOS_DESTINATION=$(scripts/start-ci-ios-simulator.sh)
          echo "Using simulator destination: ${IOS_DESTINATION}"
          echo "ios_destination=${IOS_DESTINATION}" >> "$GITHUB_OUTPUT"

      - name: Build complete iOS unit-test products
        timeout-minutes: 25
        run: |
          set -euo pipefail
          mkdir -p build/logs
          make build-ios-tests CORE_RUST_PREPARE=: IOS_DERIVED_DATA_DIR=build/ios-unit-derived \
            IOS_TEST_BUILD_FLAGS="ARCHS=$(uname -m) ONLY_ACTIVE_ARCH=YES COMPILER_INDEX_STORE_ENABLE=NO" \
            IOS_SIM="${{ steps.simulator.outputs.ios_destination }}" \
            2>&1 | tee build/logs/build-ios.log
      - name: Enumerate and retain complete qualified iOS unit products
        id: package
        run: |
          set -euo pipefail
          python3 scripts/native_test_shards.py prepare \
            --platform 'iOS Simulator' --destination '${{ steps.simulator.outputs.ios_destination }}' \
            --derived build/ios-unit-derived --output build/ios-unit-prepared \
            --sdk-receipt build/logs/history-sdk27-receipt.txt \
            --source-sha "$(git rev-parse HEAD)" --run-id '${{ github.run_id }}' --attempt '${{ github.run_attempt }}'
          cp build/logs/build-ios.log build/ios-unit-prepared/
          python3 -c 'import json; print("sha256=" + json.load(open("build/ios-unit-prepared/native-products-receipt.json"))["prepared_archive_sha256"])' >> "$GITHUB_OUTPUT"
      - name: Retain current-run iOS unit products and compiled inventory
        uses: actions/upload-artifact@v4
        with:
          name: ios-native-products
          path: apps/apple/build/ios-unit-prepared/
          compression-level: 0 # The product archive is already gzip-compressed.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
      - name: Retain iOS unit build diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-native-build-logs
          path: apps/apple/build/logs/
          if-no-files-found: error
          retention-days: 14

  ios-device-candidate:
    name: Build unsigned iOS QA candidate alongside unit shards
    needs: [changes, prepare-shared-core, prepare-ios-artifacts]
    if: ${{ needs.changes.outputs.ios == 'true' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') }}
    runs-on: xcode-27
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/apple

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'

      - name: Restore prepared shared Rust core
        uses: actions/download-artifact@v4
        with:
          name: apple-sdk27-shared-core
          path: apps/apple/Packages/HealthMdCoreRust/Artifacts

      - name: Verify SDK27 consumer provenance (iOS)
        run: |
          bash scripts/qualify-history-authorization-sdk27.sh
          python3 scripts/compare-history-sdk27-receipts.py build/logs/history-sdk27-receipt.txt Packages/HealthMdCoreRust/Artifacts/.healthmd-core-sdk27.txt

      - name: Validate prepared shared Rust core
        run: |
          test -f Packages/HealthMdCoreRust/Artifacts/HealthmdCore.xcframework/Info.plist
          test -s Packages/HealthMdCoreRust/Artifacts/.healthmd-core-source.sha256
          ../../packages/healthmd-core-rust/scripts/validate-apple-xcframework.sh \
            Packages/HealthMdCoreRust/Artifacts/HealthmdCore.xcframework

      - name: Build unsigned physical-device QA candidate
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          mkdir -p build/device-qa build/logs
          # Debug inherits the project's iphoneos SDK; Debug-iOS is simulator-only.
          xcodebuild -showBuildSettings -json \
            -project HealthMd.xcodeproj -scheme HealthMd \
            -configuration Debug -destination 'generic/platform=iOS' \
            -derivedDataPath build/device-qa-derived CODE_SIGNING_ALLOWED=NO \
            > build/device-qa-settings.json
          python3 -c 'import json; rows=json.load(open("build/device-qa-settings.json")); settings=next(row["buildSettings"] for row in rows if row.get("target")=="HealthMd"); assert settings["PLATFORM_NAME"]=="iphoneos"; assert "iPhoneOS27.0.sdk" in settings["SDKROOT"]; print(json.dumps({key:settings[key] for key in ("SDKROOT","PLATFORM_NAME","CONFIGURATION","PRODUCT_BUNDLE_IDENTIFIER")},sort_keys=True))' \
            > build/device-qa/build-settings.json
          xcodebuild build \
            -project HealthMd.xcodeproj -scheme HealthMd \
            -configuration Debug -destination 'generic/platform=iOS' \
            -derivedDataPath build/device-qa-derived \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee build/logs/build-device-qa.log
          app=build/device-qa-derived/Build/Products/Debug-iphoneos/HealthMd.app
          test -f "$app/HealthMd"
          python3 scripts/ui_test_document_fixture.py verify-device --plist "$app/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$app/Info.plist")" = iPhoneOS
          xcrun lipo -verify_arch arm64 "$app/HealthMd"
          {
            echo "SOURCE_SHA=$(git rev-parse HEAD)"
            echo "SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
            echo "PURPOSE=unsigned-device-QA-only"
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
            xcrun vtool -show-build "$app/HealthMd"
          } > build/device-qa/provenance.txt
          cp build/logs/history-sdk27-receipt.txt build/device-qa/
          tar -czf build/device-qa/HealthMd-unsigned.app.tar.gz \
            -C build/device-qa-derived/Build/Products/Debug-iphoneos HealthMd.app
          (cd build/device-qa && shasum -a 256 HealthMd-unsigned.app.tar.gz > SHA256SUMS)

      - name: Upload unsigned physical-device QA candidate
        if: ${{ success() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-device-candidate
          path: apps/apple/build/device-qa/
          if-no-files-found: error
          retention-days: 3


  ios-native-shards:
    name: iOS native shard ${{ matrix.shard }}
    needs: [changes, prepare-shared-core, prepare-ios-artifacts]
    if: ${{ needs.changes.outputs.ios == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: xcode-27
    timeout-minutes: 75
    defaults:
      run:
        working-directory: apps/apple

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'

      - name: Restore prepared shared Rust core
        uses: actions/download-artifact@v4
        with:
          name: apple-sdk27-shared-core
          path: apps/apple/Packages/HealthMdCoreRust/Artifacts

      - name: Verify SDK27 consumer provenance (iOS)
        run: |
          bash scripts/qualify-history-authorization-sdk27.sh
          python3 scripts/compare-history-sdk27-receipts.py build/logs/history-sdk27-receipt.txt Packages/HealthMdCoreRust/Artifacts/.healthmd-core-sdk27.txt

      - name: Validate prepared shared Rust core
        run: |
          test -f Packages/HealthMdCoreRust/Artifacts/HealthmdCore.xcframework/Info.plist
          test -s Packages/HealthMdCoreRust/Artifacts/.healthmd-core-source.sha256
          ../../packages/healthmd-core-rust/scripts/validate-apple-xcframework.sh \
            Packages/HealthMdCoreRust/Artifacts/HealthmdCore.xcframework

      - name: Test iOS simulator selection policy
        run: python3 scripts/tests/test_select_ios_simulator.py

      - name: Select newest compatible iOS Simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          IOS_DESTINATION=$(scripts/start-ci-ios-simulator.sh)
          echo "Using simulator destination: ${IOS_DESTINATION}"
          echo "ios_destination=${IOS_DESTINATION}" >> "$GITHUB_OUTPUT"

      - name: Restore this run's compiled iOS unit products
        uses: actions/download-artifact@v4
        with:
          name: ios-native-products
          path: apps/apple/build/ios-unit-prepared
      - name: Execute complete selected iOS native methods
        run: |
          set -euo pipefail
          python3 scripts/native_test_shards.py run \
            --products build/ios-unit-prepared --derived build/ios-unit-derived \
            --destination '${{ steps.simulator.outputs.ios_destination }}' \
            --output build/ios-native-shard --shard '${{ matrix.shard }}' \
            --prepared-sha256 '${{ needs.prepare-ios-artifacts.outputs.sha256 }}' \
            --sdk-receipt build/logs/history-sdk27-receipt.txt \
            --source-sha "$(git rev-parse HEAD)" --run-id '${{ github.run_id }}' --attempt '${{ github.run_attempt }}'
      - name: Retain iOS native results and actual method receipt
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-native-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: apps/apple/build/ios-native-shard/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  test-ios:
    needs: [changes, prepare-shared-core, prepare-ios-artifacts, ios-native-shards, ios-device-candidate]
    if: ${{ always() && needs.changes.outputs.ios == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 75
    defaults:
      run:
        working-directory: apps/apple

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'

      - name: Restore prepared shared Rust core
        uses: actions/download-artifact@v4
        with:
          name: apple-sdk27-shared-core
          path: apps/apple/Packages/HealthMdCoreRust/Artifacts

      - name: Verify SDK27 consumer provenance (iOS)
        run: |
          bash scripts/qualify-history-authorization-sdk27.sh
          python3 scripts/compare-history-sdk27-receipts.py build/logs/history-sdk27-receipt.txt Packages/HealthMdCoreRust/Artifacts/.healthmd-core-sdk27.txt

      - name: Validate prepared shared Rust core
        run: |
          test -f Packages/HealthMdCoreRust/Artifacts/HealthmdCore.xcframework/Info.plist
          test -s Packages/HealthMdCoreRust/Artifacts/.healthmd-core-source.sha256
          ../../packages/healthmd-core-rust/scripts/validate-apple-xcframework.sh \
            Packages/HealthMdCoreRust/Artifacts/HealthmdCore.xcframework

      - name: Require every iOS producer, shard and selected device candidate
        env:
          PRODUCTS_RESULT: ${{ needs.prepare-ios-artifacts.result }}
          SHARDS_RESULT: ${{ needs.ios-native-shards.result }}
          CANDIDATE_REQUIRED: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
          CANDIDATE_RESULT: ${{ needs.ios-device-candidate.result }}
        run: |
          set -euo pipefail
          test "$PRODUCTS_RESULT" = success
          test "$SHARDS_RESULT" = success
          case "$CANDIDATE_REQUIRED:$CANDIDATE_RESULT" in
            true:success|false:skipped) ;;
            *) echo '::error::Selected iOS device candidate must succeed'; exit 1 ;;
          esac
      - name: Restore this run's compiled iOS unit products
        uses: actions/download-artifact@v4
        with:
          name: ios-native-products
          path: apps/apple/build/ios-unit-prepared
      - name: Collect all current-run iOS native shard results
        uses: actions/download-artifact@v4
        with:
          pattern: ios-native-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: apps/apple/build/ios-native-reports
      - name: Verify complete iOS native inventory and merge results
        run: |
          set -euo pipefail
          python3 scripts/native_test_shards.py combine \
            --products build/ios-unit-prepared --derived build/ios-unit-derived \
            --reports build/ios-native-reports --output build/logs --result build/test-results/HealthMd-iOS.xcresult \
            --prepared-sha256 '${{ needs.prepare-ios-artifacts.outputs.sha256 }}' \
            --sdk-receipt build/logs/history-sdk27-receipt.txt \
            --source-sha "$(git rev-parse HEAD)" --run-id '${{ github.run_id }}' --attempt '${{ github.run_attempt }}'

      - name: Report iOS test result
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          result=build/test-results/HealthMd-iOS.xcresult
          if [[ ! -d "$result" ]]; then
            echo "::error::xcodebuild did not create the iOS xcresult bundle"
            exit 1
          fi
          summary=$(xcrun xcresulttool get test-results summary --path "$result")
          printf '%s\n' "$summary" | tee build/logs/ios-test-summary.json
          printf "## iOS test result\n\n\`\`\`json\n%s\n\`\`\`\n" "$summary" >> "$GITHUB_STEP_SUMMARY"
          RESULT_SUMMARY="$summary" python3 - <<'PY'
          import json
          import os

          summary = json.loads(os.environ["RESULT_SUMMARY"])
          result = summary.get("result", "Unknown")
          failures = summary.get("failedTests", 0)
          details = "; ".join(
              failure.get("failureText", failure.get("testName", "unknown test failure"))
              for failure in summary.get("testFailures", [])[:5]
          )
          if result != "Passed" or failures:
              print(f"::error::xcresult reports {result} with {failures} failed tests: {details}")
              raise SystemExit(1)
          else:
              print(f"xcresult reports Passed: {summary.get('passedTests', 0)} passed, "
                    f"{summary.get('skippedTests', 0)} skipped")
          PY

      - name: Preserve tiny synthetic native failure diagnostics
        if: ${{ !cancelled() }}
        run: grep -F 'Health172 synthetic' build/logs/xcodebuild-ios-raw.log || true
      - name: Collect bounded named iOS automation test receipt
        id: ios-automation-receipt
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p 'test_ci_automation_test_receipt.py' -v
          xcrun xcresulttool get test-results tests --path build/test-results/HealthMd-iOS.xcresult > build/logs/ios-test-tree.json
          python3 scripts/ci-automation-test-receipt.py build/logs/ios-test-tree.json build/logs/ios-automation-test-receipt.txt --head "$GITHUB_SHA" --platform iOS --diagnostics build/logs/ios-automation-test-diagnostics.txt

      - name: Upload bounded iOS automation test receipt
        if: ${{ !cancelled() && steps.ios-automation-receipt.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-automation-test-receipt
          path: apps/apple/build/logs/ios-automation-test-receipt.txt
          if-no-files-found: error
          retention-days: 14

      - name: Check warnings (iOS)
        if: ${{ !cancelled() }}
        run: scripts/check-warnings.sh build/logs/xcodebuild-ios-raw.log

      - name: Check TDD evidence
        if: ${{ !cancelled() }}
        run: scripts/check-tdd-evidence.sh

      - name: Upload iOS artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-diagnostics
          path: |
            apps/apple/build/logs/build-ios.log
            apps/apple/build/logs/xcodebuild-ios-raw.log
            apps/apple/build/logs/ios-test-summary.json
            apps/apple/build/logs/ios-test-tree.json
            apps/apple/build/logs/native-case-inventory.json
            apps/apple/build/logs/ios-automation-test-diagnostics.txt
            apps/apple/build/test-results/HealthMd-iOS.xcresult
          retention-days: 14

  prepare-macos-artifacts:
    name: Prepare qualified macOS unit-test products once
    env:
      MACOS_CODE_COVERAGE: 'YES'
    needs: [changes, prepare-shared-core]
