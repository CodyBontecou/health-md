name: PR189 memory diagnosis (not qualification)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: pr189-rss-diagnostic-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'
      - uses: actions/download-artifact@v4
        with:
          name: apple-sdk27-shared-core
          path: apps/apple/Packages/HealthMdCoreRust/Artifacts
          run-id: 40398490439
          github-token: ${{ github.token }}
      - name: Verify exact prepared core and SDK provenance
        working-directory: apps/apple
        run: |
          bash scripts/qualify-history-authorization-sdk27.sh
          python3 ../../.github/scripts/pr189-rss-core-reuse.py build/logs/history-sdk27-receipt.txt Packages/HealthMdCoreRust/Artifacts/.healthmd-core-sdk27.txt
          actual=$(../../packages/healthmd-core-rust/scripts/apple-source-digest.sh)
          test "$actual" = "$(cat Packages/HealthMdCoreRust/Artifacts/.healthmd-core-source.sha256)"
          ../../packages/healthmd-core-rust/scripts/validate-apple-xcframework.sh Packages/HealthMdCoreRust/Artifacts/HealthmdCore.xcframework
      - name: Measure encoder phases during one full macOS suite
        run: bash .github/scripts/pr189-rss-fullsuite.sh
      - name: Retain synthetic diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr189-sdk27-rss-diagnostics
          path: apps/apple/build/logs/
          retention-days: 3
          if-no-files-found: warn
