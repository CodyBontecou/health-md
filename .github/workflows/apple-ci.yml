            --derived build/macos-qa-derived --output build/macos-prepared \
            --sdk-receipt build/logs/history-sdk27-receipt.txt \
            --source-sha "$(git rev-parse HEAD)" --run-id '${{ github.run_id }}' --attempt '${{ github.run_attempt }}'
          cp build/logs/build-macos.log build/macos-prepared/
          python3 -c 'import json; print("sha256=" + json.load(open("build/macos-prepared/native-products-receipt.json"))["prepared_archive_sha256"])' >> "$GITHUB_OUTPUT"
      - name: Retain current-run native products and compiled inventory
        uses: actions/upload-artifact@v4
        with:
          name: macos-native-products
          path: apps/apple/build/macos-prepared/
          compression-level: 0 # The product archive is already gzip-compressed.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
      - name: Retain native build diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-native-build-logs
          path: apps/apple/build/logs/
          if-no-files-found: error
          retention-days: 14

