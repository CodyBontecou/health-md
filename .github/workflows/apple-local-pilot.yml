name: Local Runner Tooling

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify runner tooling safety
        run: |
          python3 -m unittest \
            apps/apple/scripts/tests/test_local_actions_pilot.py \
            scripts/tests/test_setup_local_actions_runner.py
