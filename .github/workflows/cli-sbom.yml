name: CLI Release SBOM

on:
  workflow_call:
    inputs:
      tag:
        description: Exact healthmd-cli release tag
        required: true
        type: string
      release_sha:
        description: Exact release commit
        required: true
        type: string
      main_sha:
        description: Main commit captured by the release identity gate
        required: true
        type: string

permissions:
  attestations: write
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/cli
    env:
      TAG: ${{ inputs.tag }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      MAIN_SHA: ${{ inputs.main_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Verify release identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          identity="$(python3 scripts/verify-release.py --tag "$TAG" --sha "$RELEASE_SHA" --main-sha "$MAIN_SHA")"
          version="$(jq -r .version <<<"$identity")"
          echo "SBOM_BASENAME=healthmd-cli-$version" >> "$GITHUB_ENV"

      - name: Stage complete CLI source closure
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/sbom-source"
          mkdir -p "$source_dir/apps" "$source_dir/packages"
          cp -R apps/cli "$source_dir/apps/cli"
          cp -R packages/healthmd-core-rust "$source_dir/packages/healthmd-core-rust"
          echo "SBOM_SOURCE=$source_dir" >> "$GITHUB_ENV"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: ${{ env.SBOM_SOURCE }}
          format: spdx-json
          output-file: apps/cli/${{ env.SBOM_BASENAME }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: ${{ env.SBOM_SOURCE }}
          format: cyclonedx-json
          output-file: apps/cli/${{ env.SBOM_BASENAME }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Checksum SBOMs
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            "${SBOM_BASENAME}.spdx.json" \
            "${SBOM_BASENAME}.cdx.json" \
            > "${SBOM_BASENAME}.sbom.sha256"
          sha256sum --check "${SBOM_BASENAME}.sbom.sha256"

      - name: Attest SBOMs
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: |
            apps/cli/${{ env.SBOM_BASENAME }}.spdx.json
            apps/cli/${{ env.SBOM_BASENAME }}.cdx.json
            apps/cli/${{ env.SBOM_BASENAME }}.sbom.sha256

      - name: Upload qualified SBOMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: artifacts-cli-sbom
          path: |
            apps/cli/${{ env.SBOM_BASENAME }}.spdx.json
            apps/cli/${{ env.SBOM_BASENAME }}.cdx.json
            apps/cli/${{ env.SBOM_BASENAME }}.sbom.sha256
          if-no-files-found: error
