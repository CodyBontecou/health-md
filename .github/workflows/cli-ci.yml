name: CLI CI

on:
  # Run on every PR so the stable final gate can be a required check. Main-branch pushes
  # remain path-aware to avoid rebuilding an unaffected component after merge.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'apps/cli/**'
      - 'packages/contracts/**'
      - 'packages/healthmd-core-rust/**'
      - '.github/workflows/cli-*.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      release_sha:
        description: Exact commit to qualify
        required: false
        type: string

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  msrv:
    name: Rust 1.85 MSRV
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv
          workspaces: apps/cli -> target
      - run: cargo check --workspace --locked
      - run: cargo check --workspace --all-features --locked
      - run: cargo check -p healthmd-cli --all-targets --no-default-features --features streamable-http --locked

  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/cli -> target
      - name: Repository contracts
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cargo fmt --all --check
          default_tree="$(cargo tree -p healthmd-cli --edges normal --no-default-features)"
          if grep -E '(axum|reqwest|jsonwebtoken) v[0-9]' <<<"$default_tree"; then
            echo 'default local CLI unexpectedly includes remote HTTP/OAuth dependencies' >&2
            exit 1
          fi
          cargo test -p healthmd-cli --all-targets --no-default-features \
            --features streamable-http --locked
          python3 scripts/update-mcp-shared-assets.py --check
          python3 scripts/test-safe-extract-release.py
          python3 ../../packages/contracts/validate.py
          cmp LICENSE crates/healthmd-operations/LICENSE
          cmp LICENSE crates/healthmd-client/LICENSE
          cmp LICENSE crates/healthmd-mcp/LICENSE
          cmp LICENSE crates/healthmd-cli/LICENSE
          bash -n .github/workflows/wait-for-crate.sh
          bash -n scripts/download-draft-release-assets.sh
          bash scripts/test-download-draft-release-assets.sh
          dist_version="$(awk -F'"' '/cargo-dist-version/ { print $2 }' dist-workspace.toml)"
          test "$dist_version" = 0.31.0
          installer="$(mktemp)"
          trap 'rm -f "$installer"' EXIT
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/axodotdev/cargo-dist/releases/download/v${dist_version}/cargo-dist-installer.sh" \
            -o "$installer"
          echo 'e79d87e418b9d2cbe992d014985457c28a5a7c553add3da4ed1047e161c928f4  '"$installer" | sha256sum --check
          sh "$installer"
          # The repository-root release workflow is a monorepo adaptation of cargo-dist's
          # generated workflow, so validate the distribution plan rather than requiring
          # byte-for-byte generated workflow output under apps/cli/.github.
          dist plan --allow-dirty >/dev/null
      - name: Test default local build
        run: cargo test --workspace --locked
      - name: Test every optional feature
        run: cargo test --workspace --all-features --locked
      - name: Clippy default local build
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy every optional feature
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: CLI and MCP smoke test
        shell: bash
        run: |
          set -euo pipefail
          cargo run --quiet --bin healthmd -- --help >/dev/null
          cargo run --quiet --bin healthmd -- query --help >/dev/null
          cargo run --quiet --bin healthmd -- mcp serve --help >/dev/null
          if cargo run --quiet --bin healthmd -- mcp serve-http --help >/dev/null 2>&1; then
            echo 'default local build unexpectedly exposes serve-http' >&2
            exit 1
          fi
          if cargo run --quiet --bin healthmd -- mcp serve-hosted --help >/dev/null 2>&1; then
            echo 'removed serve-hosted command is still exposed by the default build' >&2
            exit 1
          fi
          cargo run --quiet --bin healthmd --all-features -- mcp serve-http --help >/dev/null
          if cargo run --quiet --bin healthmd --all-features -- mcp serve-hosted --help >/dev/null 2>&1; then
            echo 'removed serve-hosted command is still exposed by an optional feature' >&2
            exit 1
          fi
          cargo run --quiet --bin healthmd -- mcp schema healthmd_sleep_sessions \
            >"${RUNNER_TEMP}/healthmd-sleep-schema.json"
          cargo run --quiet --bin healthmd -- setup codex --help >/dev/null
          cargo run --quiet --bin healthmd-mcp -- --help >/dev/null
          state="${RUNNER_TEMP}/healthmd-cli-state"
          result="${RUNNER_TEMP}/healthmd-cli-smoke.json"
          if HEALTHMD_CLI_DATA_DIR="$state" cargo run --quiet -- \
              --backend direct direct devices >"$result"; then
            code=0
          else
            code=$?
          fi
          python3 - "$RUNNER_OS" "$code" "$result" <<'PY'
          import json
          import pathlib
          import sys

          runner, code, path = sys.argv[1], int(sys.argv[2]), pathlib.Path(sys.argv[3])
          payload = json.loads(path.read_text())
          if code == 0:
              assert payload["schema"] == "healthmd.direct_devices", payload
          elif runner == "Linux":
              # Hosted/headless Linux commonly has no unlocked Secret Service. The CLI must
              # fail closed and emit JSON rather than falling back to plaintext credentials.
              assert code == 1, (code, payload)
              assert payload["error"] == "direct_storage_unavailable", payload
          else:
              raise SystemExit(f"unexpected {runner} smoke failure ({code}): {payload}")
          PY
          cargo build --quiet --bin healthmd --bin healthmd-mcp
          codex_home="${RUNNER_TEMP}/codex-home"
          CODEX_HOME="$codex_home" target/debug/healthmd setup codex --skip-pairing \
            >"${RUNNER_TEMP}/healthmd-codex-setup.json"
          python3 - "$codex_home" "${RUNNER_TEMP}/healthmd-codex-setup.json" <<'PY'
          import json
          import pathlib
          import sys
          import tomllib

          codex_home, receipt_path = map(pathlib.Path, sys.argv[1:])
          receipt = json.loads(receipt_path.read_text())
          config = tomllib.loads((codex_home / "config.toml").read_text())
          healthmd = config["mcp_servers"]["healthmd"]
          assert receipt["schema"] == "healthmd.codex_setup"
          assert receipt["configuration"]["same_executable_identity"] is True
          assert healthmd["args"] == ["mcp", "serve"]
          assert healthmd["tools"]["healthmd_export_files"]["approval_mode"] == "prompt"
          PY
          python3 - "$RUNNER_OS" "$state" <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import sys
          import threading

          runner, state = sys.argv[1:]
          executable = pathlib.Path("target/debug/healthmd" + (".exe" if runner == "Windows" else ""))
          compatibility = pathlib.Path("target/debug/healthmd-mcp" + (".exe" if runner == "Windows" else ""))
          requests = [
              {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{"extensions":{"io.modelcontextprotocol/ui":{"mimeTypes":["text/html;profile=mcp-app"]}}}}},
              {"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}},
              {"jsonrpc":"2.0","id":3,"method":"resources/list","params":{}},
              {"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"healthmd_capabilities","arguments":{}}},
              {"jsonrpc":"2.0","id":5,"method":"tools/call","params":{"name":"healthmd_doctor","arguments":{}}},
          ]
          env = os.environ.copy()
          env["HEALTHMD_CLI_DATA_DIR"] = state + "-mcp"
          def run_stdio_server(command):
              process = subprocess.Popen(
                  command,
                  stdin=subprocess.PIPE,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  env=env,
              )
              assert process.stdin is not None
              assert process.stdout is not None
              assert process.stderr is not None
              responses = {}
              read_failure = []

              def collect_responses():
                  try:
                      while len(responses) < len(requests):
                          line = process.stdout.readline()
                          if not line:
                              raise RuntimeError("MCP server exited before every response")
                          value = json.loads(line)
                          if "id" in value:
                              responses[value["id"]] = value
                  except BaseException as error:
                      read_failure.append(error)

              reader = threading.Thread(target=collect_responses, daemon=True)
              reader.start()
              for request in requests:
                  process.stdin.write(json.dumps(request) + "\n")
                  process.stdin.flush()
              # Keep stdin open until every response arrives. Closing it immediately would
              # correctly cancel in-flight direct readiness calls and make this smoke racy.
              reader.join(timeout=30)
              if reader.is_alive():
                  process.kill()
                  reader.join(timeout=5)
                  raise subprocess.TimeoutExpired(command, 30)
              process.stdin.close()
              try:
                  return_code = process.wait(timeout=5)
              except subprocess.TimeoutExpired:
                  process.kill()
                  return_code = process.wait(timeout=5)
              stderr = process.stderr.read()
              assert not read_failure, read_failure
              assert return_code == 0, (return_code, stderr)
              assert not stderr, stderr
              return responses

          responses = run_stdio_server([str(executable), "mcp", "serve"])
          assert responses[1]["result"]["capabilities"]["extensions"]["io.modelcontextprotocol/ui"]["mimeTypes"] == ["text/html;profile=mcp-app"]
          tools = responses[2]["result"]["tools"]
          tool_names = {tool["name"] for tool in tools}
          assert len(tools) == 19
          assert "healthmd_metric_chart" in tool_names
          assert {"healthmd_pairing_start", "healthmd_pairing_status"} <= tool_names
          sleep = next(tool for tool in tools if tool["name"] == "healthmd_sleep_sessions")
          assert len(sleep["inputSchema"]["properties"]["dates"]["oneOf"]) == 2
          assert sleep["inputSchema"]["examples"][0]["all_pages"] is True
          assert responses[3]["result"]["resources"][0]["uri"] == "ui://healthmd/query-visualization-v1"
          capability_text = responses[4]["result"]["content"][0]["text"]
          capabilities = json.loads(capability_text)
          assert capabilities["requires_mac_app"] is False
          assert capabilities["query_tool_guidance"]["sleep"] == "healthmd_sleep_sessions"
          doctor_result = responses[5]["result"]
          assert isinstance(doctor_result, dict), doctor_result
          assert set(doctor_result) == {"content", "isError"}, doctor_result
          assert isinstance(doctor_result["isError"], bool), doctor_result
          assert isinstance(doctor_result["content"], list), doctor_result
          assert len(doctor_result["content"]) == 1, doctor_result
          doctor_content = doctor_result["content"][0]
          assert isinstance(doctor_content, dict), doctor_content
          assert set(doctor_content) == {"type", "text"}, doctor_content
          assert doctor_content["type"] == "text", doctor_content
          assert isinstance(doctor_content["text"], str), doctor_content
          doctor = json.loads(doctor_content["text"])
          assert isinstance(doctor, dict), doctor
          if doctor_result["isError"]:
              health_free_errors = {
                  "healthmd_not_paired", "healthmd_device_ambiguous", "healthmd_timeout",
                  "healthmd_response_too_large", "healthmd_protocol_error",
                  "healthmd_pairing_required", "healthmd_unavailable",
              }
              assert set(doctor) == {"error", "message"}, doctor
              assert doctor["error"] in health_free_errors, doctor
              assert isinstance(doctor["message"], str) and doctor["message"], doctor
          else:
              health_free_fields = {
                  "schema", "schema_version", "status", "ready", "message", "device_name",
                  "application_protocol_version", "port", "app_active",
                  "protected_data_available", "export_in_progress", "query_in_progress",
                  "can_trigger_file_exports", "can_trigger_queries", "active_job_id",
                  "active_query_request_id", "query_capabilities", "next_tool", "wake",
              }
              assert set(doctor) <= health_free_fields, doctor
              assert doctor["schema"] == "healthmd.direct_readiness", doctor
              assert doctor["schema_version"] == 1, doctor
              assert doctor["status"] in {"ready", "unavailable", "not_paired", "query_unsupported"}, doctor
              assert isinstance(doctor["ready"], bool), doctor
              assert doctor["ready"] == (doctor["status"] == "ready"), doctor
              assert isinstance(doctor["message"], str) and doctor["message"], doctor
              if doctor["status"] == "not_paired":
                  assert isinstance(doctor.get("next_tool"), str), doctor
                  assert doctor["next_tool"] == "healthmd_pairing_start", doctor
              if "wake" in doctor:
                  # RFC-0005: enrollment is reported truthfully per selected device. This smoke
                  # runs against a fresh state with nothing paired and no stored wake credential,
                  # so the honest report is wait-only. (Enrolled devices report
                  # {"mode": "enrolled", "state": "available"}; pinned in the Rust unit tests.)
                  assert doctor["wake"]["enrollment"] == {
                      "mode": "wait_only", "state": "unavailable",
                  }, doctor
                  assert isinstance(doctor["wake"]["timeout_seconds"], int), doctor
                  assert isinstance(doctor["wake"]["enabled"], bool), doctor
          compatibility_responses = run_stdio_server([str(compatibility)])
          # Separate processes can serialize equivalent JSON object keys in a different order.
          assert compatibility_responses == responses, (compatibility_responses, responses)
          PY

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Check both independently locked workspaces
        run: |
          cargo deny --manifest-path apps/cli/Cargo.toml --config "$GITHUB_WORKSPACE/deny.toml" check
          cargo deny --manifest-path packages/healthmd-core-rust/Cargo.toml --config "$GITHUB_WORKSPACE/deny.toml" check

  packaged-crates:
    name: Packaged crate smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Install package MSRV toolchain
        run: rustup toolchain install 1.85.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: packaged-crates
          workspaces: |
            apps/cli -> target
            packages/healthmd-core-rust -> target
      - name: Verify release version closure and channel policy
        run: |
          python3 -m unittest \
            apps/cli/scripts/test_verify_generated_release_metadata.py \
            apps/cli/scripts/test_verify_release.py \
            apps/cli/scripts/test_qualify_exact_ci.py \
            apps/cli/scripts/test_watch_cli_release.py
          python3 apps/cli/scripts/verify-release.py
      - name: Build and execute packaged source archives
        run: |
          version="$(cargo metadata --manifest-path apps/cli/Cargo.toml --no-deps --format-version=1 | jq -r '.packages[] | select(.name == "healthmd-cli") | .version')"
          python3 apps/cli/scripts/smoke-crate-packages.py --version "$version"

  gate:
    name: CLI CI
    if: ${{ always() }}
    needs: [msrv, test, dependency-policy, packaged-crates]
    runs-on: ubuntu-24.04
    steps:
      - name: Require CLI checks
        env:
          MSRV_RESULT: ${{ needs.msrv.result }}
          TEST_RESULT: ${{ needs.test.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-policy.result }}
          PACKAGE_RESULT: ${{ needs.packaged-crates.result }}
        run: |
          test "$MSRV_RESULT" = success
          test "$TEST_RESULT" = success
          test "$DEPENDENCY_RESULT" = success
          test "$PACKAGE_RESULT" = success
