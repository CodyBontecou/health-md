name: CLI Publish crates.io

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact Cargo version to publish
        required: true
        type: string
      authentication:
        description: crates.io authentication mode
        required: true
        default: trusted-publishing
        type: choice
        options:
          - trusted-publishing
          - bootstrap-token
      confirmation:
        description: Type "publish crates" to confirm the irreversible publication
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  VERSION: ${{ inputs.version }}

jobs:
  publish:
    name: Publish protocol → operations → client → MCP → CLI
    runs-on: ubuntu-24.04
    environment: crates-io
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.88.0
          components: clippy,rustfmt

      - name: Install package MSRV toolchain
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Validate immutable public release identity
        env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "publish crates"
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_NAME" = "healthmd-cli/v$VERSION"
          git fetch --force origin \
            "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME" \
            "+refs/heads/main:refs/remotes/origin/main"
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          python3 scripts/verify-release.py \
            --tag "$GITHUB_REF_NAME" --sha "$GITHUB_SHA" --main-sha "$GITHUB_SHA"
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME")"
          test "$(jq -r .draft <<<"$release")" = false
          test "$(jq -r .tag_name <<<"$release")" = "$GITHUB_REF_NAME"
          test "$(jq -r .target_commitish <<<"$release")" = "$GITHUB_SHA"
          if [[ "${{ inputs.authentication }}" == bootstrap-token ]]; then
            test -n "$BOOTSTRAP_TOKEN"
          fi

      - name: Verify shared-core workspace
        run: |
          cargo fmt --manifest-path ../../packages/healthmd-core-rust/Cargo.toml --all --check
          cargo test --manifest-path ../../packages/healthmd-core-rust/Cargo.toml --workspace --all-features --locked
          cargo clippy --manifest-path ../../packages/healthmd-core-rust/Cargo.toml --workspace --all-targets --all-features --locked -- -D warnings

      - name: Verify CLI workspace and package closure
        run: |
          cargo fmt --all --check
          cargo test --workspace --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          python3 scripts/smoke-crate-packages.py --version "$VERSION"

      - name: Authenticate with crates.io trusted publishing
        if: ${{ inputs.authentication == 'trusted-publishing' }}
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish protocol
        env:
          CARGO_REGISTRY_TOKEN: ${{ inputs.authentication == 'trusted-publishing' && steps.crates-auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: scripts/publish-crate.sh ../../packages/healthmd-core-rust/Cargo.toml healthmd-protocol "$VERSION"

      - name: Publish operations
        env:
          CARGO_REGISTRY_TOKEN: ${{ inputs.authentication == 'trusted-publishing' && steps.crates-auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: scripts/publish-crate.sh Cargo.toml healthmd-operations "$VERSION"

      - name: Publish client
        env:
          CARGO_REGISTRY_TOKEN: ${{ inputs.authentication == 'trusted-publishing' && steps.crates-auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: scripts/publish-crate.sh Cargo.toml healthmd-client "$VERSION"

      - name: Publish MCP application
        env:
          CARGO_REGISTRY_TOKEN: ${{ inputs.authentication == 'trusted-publishing' && steps.crates-auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: scripts/publish-crate.sh Cargo.toml healthmd-mcp "$VERSION"

      - name: Publish CLI
        env:
          CARGO_REGISTRY_TOKEN: ${{ inputs.authentication == 'trusted-publishing' && steps.crates-auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: scripts/publish-crate.sh Cargo.toml healthmd-cli "$VERSION"
