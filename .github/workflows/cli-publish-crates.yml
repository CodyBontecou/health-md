name: CLI Publish crates.io

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact Cargo version to publish
        required: true
        type: string
      release_sha:
        description: Exact 40-character SHA retained by the successful CLI Release run
        required: true
        type: string
      authentication:
        description: crates.io authentication mode
        required: true
        default: trusted-publishing
        type: choice
        options:
          - trusted-publishing
          - bootstrap-token
      confirmation:
        description: Type "publish crates" to confirm the irreversible publication
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

env:
  VERSION: ${{ inputs.version }}

jobs:
  publish:
    name: Publish protocol → operations → client → MCP → CLI
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    environment: crates-io
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_sha }}

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.88.0
          components: clippy,rustfmt

      - name: Install package MSRV toolchain
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Validate immutable public release identity
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_RELEASE_SHA: ${{ inputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "publish crates"
          test "$GITHUB_REF_TYPE" = "branch"
          test "$GITHUB_REF_NAME" = "main"
          [[ "$EXPECTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          tag="healthmd-cli/v$VERSION"
          git fetch --force origin \
            "refs/tags/$tag:refs/tags/$tag" \
            "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse 'HEAD^{commit}')" = "$EXPECTED_RELEASE_SHA"
          test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$EXPECTED_RELEASE_SHA"
          release_runs="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/cli-release.yml/runs" \
            -f branch="$tag" -f event=push -f status=success -f per_page=100)"
          retained_release_sha="$(jq -er --arg tag "$tag" '
            [.workflow_runs[] |
              select(.head_branch == $tag and .event == "push" and .conclusion == "success")] |
            if length == 1 then .[0].head_sha
            else error("expected exactly one successful retained CLI Release run") end
          ' <<<"$release_runs")"
          test "$retained_release_sha" = "$EXPECTED_RELEASE_SHA"
          git merge-base --is-ancestor "$EXPECTED_RELEASE_SHA" refs/remotes/origin/main
          python3 scripts/verify-release.py \
            --tag "$tag" --sha "$EXPECTED_RELEASE_SHA" --main-sha "$EXPECTED_RELEASE_SHA"
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
          test "$(jq -r .draft <<<"$release")" = false
          test "$(jq -r .tag_name <<<"$release")" = "$tag"
          test "$(jq -r .target_commitish <<<"$release")" = "$EXPECTED_RELEASE_SHA"

      - name: Validate one-time bootstrap token
        if: ${{ inputs.authentication == 'bootstrap-token' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: test -n "$CARGO_REGISTRY_TOKEN"

      - name: Configure crates.io API user agent
        shell: bash
        run: |
          set -euo pipefail
          curl_home="$RUNNER_TEMP/healthmd-curl"
          install -d -m 0700 "$curl_home"
          printf '%s\n' \
            'user-agent = "healthmd-cli-release/0.1 (+https://github.com/CodyBontecou/health-md)"' \
            > "$curl_home/.curlrc"
          printf 'CURL_HOME=%s\n' "$curl_home" >> "$GITHUB_ENV"

      - name: Verify shared-core workspace
        run: |
          cargo fmt --manifest-path ../../packages/healthmd-core-rust/Cargo.toml --all --check
          cargo test --manifest-path ../../packages/healthmd-core-rust/Cargo.toml --workspace --all-features --locked
          cargo clippy --manifest-path ../../packages/healthmd-core-rust/Cargo.toml --workspace --all-targets --all-features --locked -- -D warnings

      - name: Verify CLI workspace and package closure
        run: |
          cargo fmt --all --check
          cargo test --workspace --locked
          cargo test --workspace --all-features --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          python3 scripts/smoke-crate-packages.py --version "$VERSION"

      - name: Authenticate with crates.io trusted publishing
        if: ${{ inputs.authentication == 'trusted-publishing' }}
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish protocol
        env:
          CARGO_REGISTRY_TOKEN: ${{ inputs.authentication == 'trusted-publishing' && steps.crates-auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/publish-crate.sh ../../packages/healthmd-core-rust/Cargo.toml healthmd-protocol "$VERSION"

      - name: Publish operations
        env:
          CARGO_REGISTRY_TOKEN: ${{ inputs.authentication == 'trusted-publishing' && steps.crates-auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/publish-crate.sh Cargo.toml healthmd-operations "$VERSION"

      - name: Publish client
        env:
          CARGO_REGISTRY_TOKEN: ${{ inputs.authentication == 'trusted-publishing' && steps.crates-auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/publish-crate.sh Cargo.toml healthmd-client "$VERSION"

      - name: Publish MCP application
        env:
          CARGO_REGISTRY_TOKEN: ${{ inputs.authentication == 'trusted-publishing' && steps.crates-auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/publish-crate.sh Cargo.toml healthmd-mcp "$VERSION"

      - name: Publish CLI
        env:
          CARGO_REGISTRY_TOKEN: ${{ inputs.authentication == 'trusted-publishing' && steps.crates-auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/publish-crate.sh Cargo.toml healthmd-cli "$VERSION"
