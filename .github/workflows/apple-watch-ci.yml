name: Apple Watch CI

on:
  pull_request:
    paths:
      - 'apps/apple/HealthMdWatch/**'
      - 'apps/apple/HealthMdWatchShared/**'
      - 'apps/apple/HealthMdWatchWidgets/**'
      - 'apps/apple/HealthMd.xcodeproj/**'
      - 'apps/apple/Packages/HealthMdWatchExport/**'
      - 'packages/contracts/**'
      - '.github/workflows/apple-watch-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-watch-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture-upload-and-build:
    name: Watch capture/upload regressions and Watch build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Validate contract inventory and mirrored fixture
        run: python3 packages/contracts/validate.py
      - name: Run dependency-free capture and upload behavior tests
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          mkdir -p apps/apple/build/watch-ci
          swift test --package-path apps/apple/Packages/HealthMdWatchExport --jobs 2 \
            2>&1 | tee apps/apple/build/watch-ci/tests.log
      - name: Compile actual Watch app and widgets
        if: ${{ !cancelled() }}
        working-directory: apps/apple
        run: |
          set -euo pipefail
          xcodebuild build -project HealthMd.xcodeproj -scheme HealthMdWatch \
            -configuration Debug -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath build/watch-derived -jobs 2 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' PROVISIONING_PROFILE_SPECIFIER='' \
            2>&1 | tee build/watch-ci/build.log
      - name: Preserve bounded diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: apple-watch-ci-diagnostics
          path: apps/apple/build/watch-ci/*.log
          retention-days: 7
