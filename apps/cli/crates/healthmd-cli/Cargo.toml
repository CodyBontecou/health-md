[package]
name = "healthmd-cli"
description = "Portable command-line client for Health.md"
default-run = "healthmd"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = ["crates-io"]

[features]
default = []
# Compatibility alias retained for alpha.6 source-install commands. Wake support is always built.
wake-worker = ["healthmd-client/wake-worker"]
# TLS egress for the object-store backing (`https://` S3/R2 endpoints). Off by default so
# default builds keep the stable `https object-store transport is not available` boundary and
# stay dependency-lean; the crate set is already locked in this workspace via
# `healthmd-client`'s reqwest/rustls stack, so enabling this only adds dependency edges.
object-store-tls = ["dep:tokio-rustls", "dep:rustls", "dep:webpki-roots"]
streamable-http = ["healthmd-mcp/streamable-http"]
oauth-resource-server = [
    "streamable-http",
    "healthmd-mcp/oauth-resource-server",
    "dep:url",
]

[package.metadata.dist]
formula = "healthmd"

[[bin]]
name = "healthmd"
path = "src/main.rs"

[[bin]]
name = "healthmd-mcp"
path = "src/bin/healthmd-mcp/main.rs"

[dependencies]
anstyle.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
directories.workspace = true
fs2.workspace = true
getrandom.workspace = true
healthmd-client = { path = "../healthmd-client", version = "=0.1.0-alpha.6" }
healthmd-mcp = { path = "../healthmd-mcp", version = "=0.1.0-alpha.6" }
healthmd-operations = { path = "../healthmd-operations", version = "=0.1.0-alpha.6" }
healthmd-protocol = { path = "../../../../packages/healthmd-core-rust/crates/healthmd-protocol", version = "=0.1.0-alpha.6" }
hmac.workspace = true
if-addrs.workspace = true
png.workspace = true
qrcode.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-util.workspace = true
# TLS stack for the object-store backing, gated behind `object-store-tls`. Versions match the
# already-locked workspace resolution (via healthmd-client's reqwest); `default-features = false`
# with the ring provider keeps aws-lc-rs out of the graph. tokio-rustls features forward to
# rustls; rustls enables the PEM reader and TLS 1.2 fallback support it needs.
tokio-rustls = { version = "0.26", default-features = false, features = [
    "logging",
    "ring",
    "tls12",
], optional = true }
rustls = { version = "0.23", default-features = false, features = [
    "logging",
    "ring",
    "std",
    "tls12",
], optional = true }
webpki-roots = { version = "1.0", optional = true }
toml_edit.workspace = true
url = { workspace = true, optional = true }
uuid.workspace = true

[lints]
workspace = true
