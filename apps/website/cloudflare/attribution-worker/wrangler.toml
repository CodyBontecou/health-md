name = "healthmd-campaign-redirects"
main = "src/worker.js"
compatibility_date = "2026-06-22"
workers_dev = true

routes = [
  { pattern = "healthmd.app/v/*", zone_name = "healthmd.app" },
  { pattern = "www.healthmd.app/v/*", zone_name = "healthmd.app" },
  { pattern = "healthmd.app/v1/installs*", zone_name = "healthmd.app" },
  { pattern = "www.healthmd.app/v1/installs*", zone_name = "healthmd.app" }
]

[triggers]
# Delete click/install attribution older than 13 months and rate windows older than 24 hours.
crons = ["17 4 * * *"]

[vars]
APP_STORE_BASE_URL = "https://apps.apple.com/us/app/health-md/id6757763969"
PLAY_STORE_BASE_URL = "https://play.google.com/store/apps/details?id=com.healthmd.android"
DOWNLOAD_PAGE_URL = "https://healthmd.app/"
# Public store URLs are configured above. Set Apple attribution values with:
#   npx wrangler secret put APPLE_PROVIDER_TOKEN
#   npx wrangler secret put CPP_OBSIDIAN_PPID
#   npx wrangler secret put CPP_PRIVACY_PPID
#   npx wrangler secret put CPP_CSV_PPID
# Extractable abuse-throttling tokens for Android install ingest. During rotation,
# keep the old value in the PREVIOUS secret until clients have updated:
#   npx wrangler secret put CAMPAIGN_ATTRIBUTION_INGEST_TOKEN
#   npx wrangler secret put CAMPAIGN_ATTRIBUTION_INGEST_TOKEN_PREVIOUS

[[d1_databases]]
binding = "DB"
database_name = "healthmd-campaigns"
database_id = "48311da9-95d1-4343-9c21-5617bd08ca62"
migrations_dir = "migrations"
