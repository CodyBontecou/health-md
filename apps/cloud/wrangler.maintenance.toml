name = "healthmd-cloud-maintenance"
main = "src/maintenance-worker.ts"
compatibility_date = "2026-08-01"
workers_dev = false
preview_urls = false

[triggers]
crons = ["*/5 * * * *"]

# Source-only production profile. It has no public route and owns bounded,
# idempotent lifecycle work against isolated production resources.
[[d1_databases]]
binding = "DB"
database_name = "healthmd-cloud-production-placeholder"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "EXPORTS"
bucket_name = "healthmd-cloud-production-placeholder-not-for-deployment"

[[queues.producers]]
binding = "LIFECYCLE_QUEUE"
queue = "healthmd-cloud-lifecycle-placeholder-not-for-deployment"

[[queues.consumers]]
queue = "healthmd-cloud-lifecycle-placeholder-not-for-deployment"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 10
dead_letter_queue = "healthmd-cloud-lifecycle-dead-letter-placeholder-not-for-deployment"

[[analytics_engine_datasets]]
binding = "METRICS"
dataset = "healthmd_cloud_maintenance_metrics_placeholder"

[vars]
ENVIRONMENT = "production"
SERVICE_PROFILE = "maintenance"
DEPLOYMENT_REVISION = "REPLACE_WITH_FULL_GIT_COMMIT_SHA"
PUBLIC_ORIGIN = "https://maintenance.healthmd.app"
AUTH_SIGNUP_MODE = "closed"
AUTH_EMAIL_FROM = ""
CURRENT_EXPORT_KEY_ID = "v1"
ACCOUNT_KEY_MODE = "per_account"
CURRENT_ACCOUNT_WRAPPING_KEY_ID = "kek-v1"
HEALTH_FREE_METRICS_REQUIRED = "1"
MAX_EXPORT_BYTES = "26214400"
SESSION_TTL_DAYS = "30"
MAGIC_LINK_TTL_MINUTES = "15"
REVISION_RETENTION_DAYS = "30"
DELETION_STATUS_TTL_DAYS = "30"

# Required secrets:
#   ACCOUNT_KEY_WRAPPING_KEYS_JSON (current and every still-referenced historical KEK)
#   CLOUD_RUNTIME_APPROVED=healthmd-cloud-v1-reviewed
