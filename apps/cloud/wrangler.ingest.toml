name = "healthmd-cloud-ingest"
main = "src/ingest-worker.ts"
compatibility_date = "2026-08-01"
workers_dev = false
preview_urls = false

# Source-only production profile. Placeholder bindings deliberately prevent
# deployment until Phase 0/1 approvals and isolated resources exist.
[[d1_databases]]
binding = "DB"
database_name = "healthmd-cloud-production-placeholder"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "EXPORTS"
bucket_name = "healthmd-cloud-production-placeholder-not-for-deployment"

[[analytics_engine_datasets]]
binding = "METRICS"
dataset = "healthmd_cloud_ingest_metrics_placeholder"

[vars]
ENVIRONMENT = "production"
SERVICE_PROFILE = "ingest"
DEPLOYMENT_REVISION = "REPLACE_WITH_FULL_GIT_COMMIT_SHA"
PUBLIC_ORIGIN = "https://api.healthmd.app"
AUTH_SIGNUP_MODE = "closed"
AUTH_EMAIL_FROM = ""
CURRENT_EXPORT_KEY_ID = "v1"
ACCOUNT_KEY_MODE = "per_account"
CURRENT_ACCOUNT_WRAPPING_KEY_ID = "kek-v1"
HEALTH_FREE_METRICS_REQUIRED = "1"
MAX_EXPORT_BYTES = "26214400"
SESSION_TTL_DAYS = "30"
MAGIC_LINK_TTL_MINUTES = "15"
INGEST_TOKEN_HOURLY_LIMIT = "120"
INGEST_ACCOUNT_HOURLY_LIMIT = "240"

# Required secrets:
#   EXPORT_ENCRYPTION_KEYS_JSON (legacy-read compatibility during migration)
#   ACCOUNT_KEY_WRAPPING_KEYS_JSON (for example {"kek-v1":"<32-byte-base64>"})
#   CLOUD_RUNTIME_APPROVED=healthmd-cloud-v1-reviewed
