import groovy.json.JsonOutput
import org.gradle.api.tasks.testing.Test
import java.nio.charset.StandardCharsets

// Opt-in only. Normal developer Gradle invocations keep their full discovery.
def lane = System.getenv('HEALTHMD_JVM_LANE')
if (lane != null) {
    def variant = System.getenv('HEALTHMD_JVM_VARIANT')
    def taskNames = [debug: 'testPlayDebugUnitTest', release: 'testPlayReleaseUnitTest', e2e: 'testPlayE2eUnitTest']
    def nativeClass = 'com.healthmd.direct.AgentBridgeNativeConfigurationReaderTest'
    def sourceSha = System.getenv('HEALTHMD_JVM_SOURCE_SHA')
    def runId = System.getenv('GITHUB_RUN_ID')
    def attempt = System.getenv('GITHUB_RUN_ATTEMPT')
    if (!(lane in ['remaining', 'native-0', 'native-1']) || !taskNames.containsKey(variant)
            || !(sourceSha ==~ /[0-9a-f]{40}/) || !(runId ==~ /[1-9][0-9]*/) || !(attempt ==~ /[1-9][0-9]*/)) {
        throw new GradleException('Invalid source/run/variant/native JVM lane')
    }
    gradle.projectsEvaluated {
        def androidRoot = rootProject.projectDir
        def current = new ByteArrayOutputStream()
        rootProject.exec {
            workingDir androidRoot
            commandLine 'git', 'rev-parse', 'HEAD'
            standardOutput current
        }
        if (current.toString('UTF-8').trim() != sourceSha) throw new GradleException('JVM lane source SHA differs from checkout')
        rootProject.project(':app').tasks.named(taskNames[variant], Test).configure { testTask ->
            doFirst {
                if (!filter.includePatterns.empty || !filter.excludePatterns.empty) {
                    throw new GradleException('Native JVM lanes require the original unfiltered Test task')
                }
                def raw = new ByteArrayOutputStream()
                rootProject.exec {
                    commandLine testTask.javaLauncher.get().executablePath.asFile.absolutePath,
                        '--class-path', (testTask.classpath + testTask.testClassesDirs).asPath,
                        new File(androidRoot, 'scripts/NativeJvmInventory.java').absolutePath, nativeClass
                    standardOutput raw
                }
                def methods = raw.toString('UTF-8').readLines().collect {
                    new String(Base64.decoder.decode(it), StandardCharsets.UTF_8)
                }.sort()
                if (methods.empty || methods.toSet().size() != methods.size()) throw new GradleException('Invalid compiled native method inventory')
                def selected = []
                if (lane == 'remaining') {
                    filter.excludeTestsMatching(nativeClass)
                } else {
                    def parity = lane == 'native-0' ? 0 : 1
                    methods.eachWithIndex { method, index ->
                        if (index % 2 == parity) {
                            selected.add(method)
                            filter.includeTest(nativeClass, method)
                        }
                    }
                    if (selected.empty) throw new GradleException('Native JVM lane is empty')
                }
                def receipt = [source_sha: sourceSha, run_id: runId, attempt: attempt, variant: variant,
                    lane: lane, task: testTask.path, native_class: nativeClass, native_methods: methods,
                    selected_methods: selected, include_patterns: filter.includePatterns.toList().sort(),
                    exclude_patterns: filter.excludePatterns.toList().sort()]
                def output = new File(androidRoot, "build/reports/ci/jvm-native-${variant}-${lane}.json")
                output.parentFile.mkdirs()
                output.text = JsonOutput.prettyPrint(JsonOutput.toJson(receipt)) + '\n'
            }
        }
    }
}
