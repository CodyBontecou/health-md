import groovy.json.JsonOutput
import org.gradle.api.tasks.testing.Test
import org.gradle.api.artifacts.component.ProjectComponentIdentifier
import java.nio.charset.StandardCharsets
import java.security.MessageDigest

// Opt-in only. Normal developer Gradle invocations keep their full discovery.
def lane = System.getenv('HEALTHMD_JVM_LANE')
if (lane != null) {
    def variant = System.getenv('HEALTHMD_JVM_VARIANT')
    def taskNames = [debug: 'testPlayDebugUnitTest', release: 'testPlayReleaseUnitTest', e2e: 'testPlayE2eUnitTest']
    def nativeClass = 'com.healthmd.direct.AgentBridgeNativeConfigurationReaderTest'
    def sourceSha = System.getenv('HEALTHMD_JVM_SOURCE_SHA')
    def runId = System.getenv('GITHUB_RUN_ID')
    def attempt = System.getenv('GITHUB_RUN_ATTEMPT')
    if (!(lane in ['remaining', 'native-0', 'native-1']) || !taskNames.containsKey(variant)
            || !(sourceSha ==~ /[0-9a-f]{40}/) || !(runId ==~ /[1-9][0-9]*/) || !(attempt ==~ /[1-9][0-9]*/)) {
        throw new GradleException('Invalid source/run/variant/native JVM lane')
    }
    gradle.projectsEvaluated {
        def androidRoot = rootProject.projectDir
        def current = new ByteArrayOutputStream()
        rootProject.exec {
            workingDir androidRoot
            commandLine 'git', 'rev-parse', 'HEAD'
            standardOutput current
        }
        if (current.toString('UTF-8').trim() != sourceSha) throw new GradleException('JVM lane source SHA differs from checkout')
        rootProject.project(':app').tasks.named(taskNames[variant], Test).configure { testTask ->
            doFirst {
                def clean = rootProject.exec {
                    workingDir androidRoot
                    commandLine 'git', 'diff', '--quiet', 'HEAD', '--'
                    ignoreExitValue true
                }
                if (clean.exitValue != 0) throw new GradleException('JVM qualification requires unchanged tracked source')
                if (!filter.includePatterns.empty || !filter.excludePatterns.empty) {
                    throw new GradleException('Native JVM lanes require the original unfiltered Test task')
                }
                def raw = new ByteArrayOutputStream()
                rootProject.exec {
                    commandLine testTask.javaLauncher.get().executablePath.asFile.absolutePath,
                        '--class-path', (testTask.classpath + testTask.testClassesDirs).asPath,
                        new File(androidRoot, 'scripts/NativeJvmInventory.java').absolutePath, nativeClass
                    standardOutput raw
                }
                def methods = raw.toString('UTF-8').readLines().collect {
                    new String(Base64.decoder.decode(it), StandardCharsets.UTF_8)
                }.sort()
                if (methods.empty || methods.toSet().size() != methods.size()) throw new GradleException('Invalid compiled native method inventory')
                def version = { List<String> command ->
                    def output = new ByteArrayOutputStream()
                    rootProject.exec {
                        commandLine command
                        standardOutput output
                        errorOutput output
                    }
                    def value = output.toString('UTF-8').trim()
                    if (value.empty) throw new GradleException('Missing JVM qualification compiler identity')
                    MessageDigest.getInstance('SHA-256').digest(value.getBytes(StandardCharsets.UTF_8)).encodeHex().toString()
                }
                def ndkRoot = System.getenv('ANDROID_NDK_HOME')
                if (!ndkRoot) throw new GradleException('Pinned NDK identity is required for JVM qualification')
                def ndkProperties = new Properties()
                new File(ndkRoot, 'source.properties').withInputStream { ndkProperties.load(it) }
                if (ndkProperties.getProperty('Pkg.Revision') != '27.1.12297006') {
                    throw new GradleException('JVM qualification NDK revision differs from the pinned profile')
                }
                // Retried lanes may reuse same-run results only under this exact
                // compiler/runtime profile. Never retain arbitrary environment values.
                def effectiveEnvironment = testTask.environment
                def environmentNames = (['JAVA_TOOL_OPTIONS', 'JDK_JAVA_OPTIONS', 'GRADLE_OPTS',
                    'JAVA_OPTS', 'RUSTFLAGS', 'RUSTC', 'RUSTC_WRAPPER', 'CC', 'CXX', 'AR', 'LD'] +
                    effectiveEnvironment.keySet().findAll { name ->
                        ['HEALTHMD_', 'UPDATE_', 'ROBOLECTRIC_', 'CARGO_', 'ORG_GRADLE_PROJECT_'].any { name.startsWith(it) }
                    }).findAll { it != 'HEALTHMD_JVM_LANE' }.toSet().sort()
                def environmentInputs = environmentNames.collectEntries { name ->
                    [(name): effectiveEnvironment[name]?.toString()]
                }
                def environmentDigest = MessageDigest.getInstance('SHA-256')
                    .digest(JsonOutput.toJson(environmentInputs).getBytes(StandardCharsets.UTF_8)).encodeHex().toString()
                // Only dependency INPUTS are comparable across independent builds.
                // Generated project classes/resources can contain build-local metadata;
                // their inputs are bound by the clean source and compiler profiles.
                def fileInput = { scope, component, File file ->
                    def digest = MessageDigest.getInstance('SHA-256')
                    def files = file.isDirectory() ? rootProject.fileTree(file).files.sort { a, b ->
                        file.toPath().relativize(a.toPath()).toString() <=> file.toPath().relativize(b.toPath()).toString()
                    } : [file]
                    files.each { member ->
                        def relative = file.isDirectory() ? file.toPath().relativize(member.toPath()).toString() : file.name
                        digest.update((relative + '\u0000').getBytes(StandardCharsets.UTF_8))
                        def content = MessageDigest.getInstance('SHA-256')
                        member.withInputStream { stream ->
                            byte[] buffer = new byte[65536]
                            int size
                            while ((size = stream.read(buffer)) != -1) content.update(buffer, 0, size)
                        }
                        digest.update(content.digest())
                    }
                    [scope: scope, component: component, name: file.name,
                        sha256: digest.digest().encodeHex().toString()]
                }
                def artifactInputs = { Map<String, Object> configurations ->
                    def records = []
                    configurations.each { scope, configuration ->
                        // Filter components BEFORE artifact selection: AGP project
                        // variants expose classes, profiles and other artifact types.
                        // Resolving an untyped project view first is ambiguous.
                        configuration.incoming.artifactView {
                            componentFilter { !(it instanceof ProjectComponentIdentifier) }
                        }.artifacts.artifacts.each { artifact ->
                            def component = artifact.id.componentIdentifier
                            if (!(component instanceof ProjectComponentIdentifier)) {
                                records.add(fileInput(scope, component.displayName, artifact.file))
                            }
                        }
                    }
                    records.sort { a, b ->
                        (a.scope + ':' + a.component + ':' + a.name) <=> (b.scope + ':' + b.component + ':' + b.name)
                    }
                }
                def runtimeConfigurations = [:]
                ['RuntimeClasspath', 'CompileClasspath'].each { suffix ->
                    def name = "play${variant.capitalize()}UnitTest${suffix}"
                    def configuration = testTask.project.configurations.findByName(name)
                    if (configuration == null) configuration = testTask.project.configurations.findByName("test${suffix}")
                    if (configuration == null || !configuration.canBeResolved) throw new GradleException('Missing JVM dependency-input configuration')
                    runtimeConfigurations[suffix] = configuration
                }
                def dependencies = artifactInputs(runtimeConfigurations)
                def plugins = artifactInputs([root: rootProject.buildscript.configurations.classpath,
                    app: testTask.project.buildscript.configurations.classpath])
                def android = testTask.project.extensions.findByName('android')
                def sdkInputs = android == null ? [] : android.bootClasspath.collect { fileInput('boot', 'Android SDK', it) }
                if (android != null && sdkInputs.empty) throw new GradleException('Missing Android SDK compiler inputs')
                def hashText = { text -> MessageDigest.getInstance('SHA-256')
                    .digest(text.getBytes(StandardCharsets.UTF_8)).encodeHex().toString() }
                def hostCoreDigest = MessageDigest.getInstance('SHA-256')
                def hostCoreDirectory = effectiveEnvironment['HEALTHMD_BRIDGE_HOST_CORE_DIRECTORY']?.toString()
                if (hostCoreDirectory != null && !hostCoreDirectory.trim().empty) {
                    def found = false
                    hostCoreDirectory.split(java.util.regex.Pattern.quote(File.pathSeparator)).eachWithIndex { directory, index ->
                        def library = new File(directory, System.mapLibraryName('healthmd_core_uniffi'))
                        hostCoreDigest.update((index.toString() + '\u0000').getBytes(StandardCharsets.UTF_8))
                        hostCoreDigest.update((library.isFile() ? 'present\u0000' : 'missing\u0000').getBytes(StandardCharsets.UTF_8))
                        if (library.isFile()) {
                            found = true
                            def binaryDigest = MessageDigest.getInstance('SHA-256')
                            library.withInputStream { stream ->
                                byte[] buffer = new byte[65536]
                                int size
                                while ((size = stream.read(buffer)) != -1) binaryDigest.update(buffer, 0, size)
                            }
                            hostCoreDigest.update(binaryDigest.digest())
                        }
                    }
                    if (!found) throw new GradleException('Configured host native-core library is missing from the qualification profile')
                }
                // Bind provider-backed generator/engine inputs, including unprefixed
                // environment values and -P overrides. Persist only their digest.
                def configurationNames = [] as Set
                rootProject.fileTree(androidRoot) {
                    include '**/*.gradle', '**/*.gradle.kts'
                    exclude '**/build/**', '**/.gradle/**'
                }.files.each { script ->
                    def matcher = script.getText('UTF-8') =~ /(?:configuredValue|configuredEngineMode|gradleProperty|environmentVariable)\(["']([^"']+)["']\)/
                    matcher.each { match -> configurationNames.add(match[1]) }
                }
                configurationNames.addAll(gradle.startParameter.projectProperties.keySet())
                def configurationInputs = configurationNames.toList().sort().collectEntries { name ->
                    [(name): testTask.project.providers.gradleProperty(name)
                        .orElse(testTask.project.providers.environmentVariable(name)).getOrNull()]
                }
                def qualificationProfile = [version: 2, compiler: [
                    test_java_sha256: version([testTask.javaLauncher.get().executablePath.asFile.absolutePath, '-version']),
                    gradle_java_sha256: hashText(System.getProperty('java.runtime.version') + ' / ' + System.getProperty('java.vendor')),
                    gradle: gradle.gradleVersion, gradle_plugins_sha256: hashText(JsonOutput.toJson(plugins)),
                    android_sdk_sha256: hashText(JsonOutput.toJson(sdkInputs)), rustc_sha256: version(['rustc', '-vV']),
                    cargo_ndk_sha256: version(['cargo', 'ndk', '--version']),
                    ndk_revision: ndkProperties.getProperty('Pkg.Revision'),
                    os: System.getProperty('os.name'), arch: System.getProperty('os.arch')], execution: [
                    environment_sha256: environmentDigest,
                    configuration_sha256: hashText(JsonOutput.toJson(configurationInputs)),
                    host_core_sha256: hostCoreDigest.digest().encodeHex().toString(),
                    dependency_inputs_sha256: hashText(JsonOutput.toJson(dependencies)),
                    jvm_args_sha256: hashText(JsonOutput.toJson(testTask.allJvmArgs)),
                    max_parallel_forks: testTask.maxParallelForks]]
                def selected = []
                if (lane == 'remaining') {
                    filter.excludeTestsMatching(nativeClass)
                } else {
                    def parity = lane == 'native-0' ? 0 : 1
                    methods.eachWithIndex { method, index ->
                        if (index % 2 == parity) {
                            selected.add(method)
                            filter.includeTest(nativeClass, method)
                        }
                    }
                    if (selected.empty) throw new GradleException('Native JVM lane is empty')
                }
                def receipt = [source_sha: sourceSha, run_id: runId, attempt: attempt, variant: variant,
                    lane: lane, task: testTask.path, native_class: nativeClass, native_methods: methods,
                    selected_methods: selected, include_patterns: filter.includePatterns.toList().sort(),
                    exclude_patterns: filter.excludePatterns.toList().sort(), qualification_profile: qualificationProfile,
                    input_artifacts: [compiler_plugins: plugins, android_sdk: sdkInputs, dependencies: dependencies]]
                def output = new File(androidRoot, "build/reports/ci/jvm-native-${variant}-${lane}.json")
                output.parentFile.mkdirs()
                output.text = JsonOutput.prettyPrint(JsonOutput.toJson(receipt)) + '\n'
            }
        }
    }
}
