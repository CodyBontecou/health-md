import org.gradle.api.tasks.testing.Test

// Cache compilation and lint, but execute every JVM test for each CI invocation.
// Some policy/contract tests read repository files outside their declared inputs.
allprojects {
    tasks.withType(Test).configureEach {
        outputs.doNotCacheIf('CI JVM tests must execute against current repository files') { true }
        outputs.upToDateWhen { false }
        // scripts/ci/android.sh sets these when ~ is not writable (sandboxed check runners).
        def robolectricHome = System.getenv('HEALTHMD_CI_ROBOLECTRIC_HOME')
        if (robolectricHome) {
            systemProperty 'user.home', robolectricHome
            systemProperty 'maven.repo.local', System.getenv('HEALTHMD_CI_ROBOLECTRIC_REPO')
        }
    }
}
