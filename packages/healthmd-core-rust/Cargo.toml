[workspace]
members = [
    "crates/healthmd-core",
    "crates/healthmd-core-uniffi",
    "crates/healthmd-protocol",
    "xtask",
]
default-members = [
    "crates/healthmd-core",
    "crates/healthmd-core-uniffi",
]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.4"
edition = "2024"
rust-version = "1.85"
authors = ["Health.md contributors"]
license = "AGPL-3.0-only"
repository = "https://github.com/CodyBontecou/health-md"
homepage = "https://health.md"

[workspace.dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = "0.10"
getrandom = "0.3"
hmac = "0.12"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_ignored = "0.1"
serde_json = { version = "1.0", features = ["raw_value"] }
sha2 = "0.10"
subtle = "2.6"
thiserror = "2.0"
# UniFFI's default `cargo-metadata` feature exceeds the runtime crates' Rust 1.85 MSRV.
# The xtask enables only `cli`, which supports library-mode binding generation without it.
uniffi = { version = "=0.32.0", default-features = false }
unicode-normalization = "0.1"
unicode-casefold = "0.2"
uuid = { version = "1.16", features = ["serde", "v4"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
zeroize = "1.9"

healthmd-core = { path = "crates/healthmd-core", version = "=0.1.0-alpha.4" }
healthmd-protocol = { path = "crates/healthmd-protocol", version = "=0.1.0-alpha.4" }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
